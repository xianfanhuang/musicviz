<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sonoria | 看见音乐中的自己</title>
    
    <!-- Three.js 基础库 -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <style>
        /* 极简修复版样式 */
        :root {
            --brand-hue: 180;
            --brand-color: hsl(var(--brand-hue), 80%, 60%);
            --bg-color: #000000;
        }

        *, *::before, *::after { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-color);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-tap-highlight-color: transparent;
        }

        /* 修复的入场层 */
        #intro-layer {
            position: fixed; 
            inset: 0; 
            z-index: 3000;
            background: #000;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            cursor: pointer;
            transition: opacity 1s ease, visibility 1s;
        }
        
        #intro-layer.hidden { 
            opacity: 0; 
            visibility: hidden; 
            pointer-events: none; 
        }

        .intro-logo {
            width: 80px; 
            height: 80px;
            color: var(--brand-color);
            margin-bottom: 30px;
            animation: pulse 3s infinite ease-in-out;
        }

        .intro-text {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .intro-main {
            font-size: 22px;
            font-weight: 300;
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.3s;
        }
        
        .intro-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.6s;
        }

        .intro-hint {
            position: absolute;
            bottom: 40px;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            opacity: 0;
            animation: fadeIn 1s ease forwards 0.9s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 画布 */
        #canvas-container { 
            position: fixed; 
            inset: 0; 
            z-index: 1; 
            opacity: 0;
            transition: opacity 2s ease;
        }
        
        #canvas-container.visible { 
            opacity: 1; 
        }

        /* 简化UI层 */
        #ui-layer {
            position: fixed; 
            inset: 0; 
            z-index: 10; 
            pointer-events: none;
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end;
            padding: 30px;
            opacity: 0;
            transition: opacity 1s ease;
        }
        
        #ui-layer.visible { 
            opacity: 1; 
            pointer-events: auto;
        }

        .control-island {
            pointer-events: auto;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }
        
        .btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        
        .btn svg {
            width: 20px;
            height: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #444;
            transition: background 0.3s;
        }
        
        .status-dot.active {
            background: var(--brand-color);
            box-shadow: 0 0 10px var(--brand-color);
        }

        .track-info {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            padding: 0 20px;
        }
        
        .mic-active {
            color: var(--brand-color) !important;
            animation: glow 2s infinite;
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px var(--brand-color); }
            50% { box-shadow: 0 0 20px var(--brand-color); }
        }

        /* 权限提示 */
        .permission-prompt {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
            display: none;
            max-width: 300px;
            text-align: center;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 权限提示 -->
    <div class="permission-prompt" id="permission-prompt"></div>

    <!-- 入场层 -->
    <div id="intro-layer">
        <svg class="intro-logo" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="50" cy="50" r="45" opacity="0.3"/>
            <path d="M30 50 Q50 20 70 50 T90 50" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="2" fill="currentColor"/>
        </svg>
        
        <div class="intro-text">
            <div class="intro-main">Sonoria</div>
            <div class="intro-sub">看见音乐中的自己</div>
        </div>

        <div class="intro-hint">点击屏幕开始</div>
    </div>

    <!-- 画布 -->
    <div id="canvas-container">
        <canvas id="visualizer"></canvas>
    </div>

    <!-- UI层 -->
    <div id="ui-layer">
        <div class="track-info" id="current-track">等待输入...</div>
        
        <div class="control-island">
            <!-- 文件上传 -->
            <label class="btn" title="导入音乐">
                <input type="file" id="file-input" accept="audio/*" style="display:none">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </label>

            <!-- 状态指示 -->
            <div class="status-dot" id="play-status"></div>

            <!-- 播放控制 -->
            <button class="btn" id="play-btn" title="播放/暂停">
                <svg id="icon-play" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="icon-pause" width="20" height="20" fill="currentColor" viewBox="0 0 24 24" style="display:none">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>

            <!-- 麦克风 -->
            <button class="btn" id="mic-btn" title="环境音感应">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // ==================== 核心修复版本 ====================
        
        // 音频引擎 - 修复了自动播放问题
        class AudioEngine {
            constructor() {
                this.audioContext = null;
                this.analyser = null;
                this.source = null;
                this.micStream = null;
                this.audioElement = null;
                this.dataArray = null;
                
                this.state = {
                    playing: false,
                    micActive: false,
                    initialized: false
                };
                
                // 存储用户交互的回调队列
                this.interactionQueue = [];
                this.userInteracted = false;
            }
            
            // 安全的音频上下文初始化
            async init() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    
                    if (!AudioContext) {
                        this.showMessage('您的浏览器不支持Web Audio API');
                        return false;
                    }
                    
                    // 只有在用户交互后才创建AudioContext
                    if (!this.userInteracted) {
                        return new Promise((resolve) => {
                            this.interactionQueue.push(() => {
                                this._createAudioContext().then(resolve);
                            });
                        });
                    }
                    
                    return await this._createAudioContext();
                    
                } catch (error) {
                    console.error('音频初始化失败:', error);
                    this.showMessage('音频引擎初始化失败: ' + error.message);
                    return false;
                }
            }
            
            async _createAudioContext() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // 创建分析器
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 2048;
                    this.analyser.smoothingTimeConstant = 0.8;
                    
                    // 创建数据数组
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    
                    // 创建音频元素（用于文件播放）
                    this.audioElement = new Audio();
                    this.audioElement.crossOrigin = 'anonymous';
                    
                    this.state.initialized = true;
                    console.log('音频引擎初始化成功');
                    return true;
                    
                } catch (error) {
                    console.error('创建音频上下文失败:', error);
                    return false;
                }
            }
            
            // 处理用户交互
            handleUserInteraction() {
                this.userInteracted = true;
                
                // 执行等待中的回调
                if (this.interactionQueue.length > 0) {
                    this.interactionQueue.forEach(callback => callback());
                    this.interactionQueue = [];
                }
                
                // 恢复音频上下文（如果已创建）
                if (this.audioContext && this.audioContext.state === 'suspended') {
                    this.audioContext.resume().then(() => {
                        console.log('音频上下文已恢复');
                    }).catch(error => {
                        console.error('恢复音频上下文失败:', error);
                    });
                }
            }
            
            // 加载音频文件
            async loadFile(file) {
                if (!this.state.initialized) {
                    const success = await this.init();
                    if (!success) return false;
                }
                
                try {
                    // 停止当前播放
                    this.stop();
                    
                    // 创建对象URL
                    const url = URL.createObjectURL(file);
                    this.audioElement.src = url;
                    
                    // 等待音频可以播放
                    await new Promise((resolve, reject) => {
                        this.audioElement.oncanplay = resolve;
                        this.audioElement.onerror = reject;
                        
                        // 超时处理
                        setTimeout(() => {
                            reject(new Error('音频加载超时'));
                        }, 10000);
                    });
                    
                    // 创建音频源
                    if (this.source) {
                        this.source.disconnect();
                    }
                    
                    this.source = this.audioContext.createMediaElementSource(this.audioElement);
                    this.source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);
                    
                    // 更新状态
                    this.state.micActive = false;
                    
                    console.log('音频文件加载成功:', file.name);
                    return true;
                    
                } catch (error) {
                    console.error('加载音频文件失败:', error);
                    this.showMessage('无法加载音频文件: ' + error.message);
                    return false;
                }
            }
            
            // 播放/暂停
            play() {
                if (!this.state.initialized) {
                    this.showMessage('请先初始化音频引擎');
                    return false;
                }
                
                if (this.state.micActive) {
                    // 麦克风模式已在运行
                    return true;
                }
                
                try {
                    if (this.state.playing) {
                        this.audioElement.pause();
                        this.state.playing = false;
                    } else {
                        // 确保音频上下文处于运行状态
                        if (this.audioContext.state === 'suspended') {
                            this.audioContext.resume();
                        }
                        
                        // 播放音频
                        const playPromise = this.audioElement.play();
                        
                        if (playPromise !== undefined) {
                            playPromise.then(() => {
                                this.state.playing = true;
                                console.log('音频播放开始');
                            }).catch(error => {
                                console.error('播放失败:', error);
                                this.showMessage('播放失败: ' + error.message);
                                this.state.playing = false;
                            });
                        }
                    }
                    
                    return this.state.playing;
                    
                } catch (error) {
                    console.error('播放控制失败:', error);
                    return false;
                }
            }
            
            // 停止所有音频
            stop() {
                if (this.audioElement) {
                    this.audioElement.pause();
                    this.audioElement.currentTime = 0;
                }
                
                if (this.micStream) {
                    this.micStream.getTracks().forEach(track => track.stop());
                    this.micStream = null;
                }
                
                this.state.playing = false;
                this.state.micActive = false;
            }
            
            // 切换麦克风
            async toggleMic() {
                if (!this.state.initialized) {
                    const success = await this.init();
                    if (!success) return false;
                }
                
                try {
                    if (this.state.micActive) {
                        // 关闭麦克风
                        if (this.micStream) {
                            this.micStream.getTracks().forEach(track => track.stop());
                            this.micStream = null;
                        }
                        
                        if (this.source) {
                            this.source.disconnect();
                            this.source = null;
                        }
                        
                        this.state.micActive = false;
                        this.state.playing = false;
                        
                        console.log('麦克风已关闭');
                        return false;
                        
                    } else {
                        // 打开麦克风
                        this.stop(); // 停止当前播放
                        
                        // 请求麦克风权限
                        const stream = await navigator.mediaDevices.getUserMedia({
                            audio: {
                                echoCancellation: true,
                                noiseSuppression: true,
                                autoGainControl: true
                            }
                        });
                        
                        // 创建音频源
                        if (this.source) {
                            this.source.disconnect();
                        }
                        
                        this.source = this.audioContext.createMediaStreamSource(stream);
                        this.source.connect(this.analyser);
                        this.analyser.connect(this.audioContext.destination);
                        
                        this.micStream = stream;
                        this.state.micActive = true;
                        this.state.playing = true;
                        
                        console.log('麦克风已开启');
                        return true;
                    }
                    
                } catch (error) {
                    console.error('麦克风控制失败:', error);
                    
                    if (error.name === 'NotAllowedError') {
                        this.showMessage('请允许麦克风权限');
                    } else if (error.name === 'NotFoundError') {
                        this.showMessage('未找到麦克风设备');
                    } else {
                        this.showMessage('麦克风错误: ' + error.message);
                    }
                    
                    return false;
                }
            }
            
            // 获取音频数据
            getAudioData() {
                if (!this.analyser || !this.dataArray || !this.state.initialized) {
                    return { bass: 0, mid: 0, high: 0, energy: 0 };
                }
                
                try {
                    this.analyser.getByteFrequencyData(this.dataArray);
                    
                    const length = this.dataArray.length;
                    let bass = 0, mid = 0, high = 0, energy = 0;
                    
                    // 分析频率数据
                    for (let i = 0; i < length; i++) {
                        const value = this.dataArray[i];
                        energy += value;
                        
                        if (i < length * 0.1) {
                            bass += value; // 低频
                        } else if (i < length * 0.5) {
                            mid += value;  // 中频
                        } else {
                            high += value; // 高频
                        }
                    }
                    
                    // 归一化处理
                    return {
                        bass: bass / (length * 0.1 * 255),
                        mid: mid / (length * 0.4 * 255),
                        high: high / (length * 0.5 * 255),
                        energy: energy / (length * 255)
                    };
                    
                } catch (error) {
                    console.error('获取音频数据失败:', error);
                    return { bass: 0, mid: 0, high: 0, energy: 0 };
                }
            }
            
            // 显示消息
            showMessage(message) {
                const prompt = document.getElementById('permission-prompt');
                if (prompt) {
                    prompt.textContent = message;
                    prompt.style.display = 'block';
                    
                    setTimeout(() => {
                        prompt.style.display = 'none';
                    }, 3000);
                } else {
                    alert(message);
                }
            }
        }
        
        // 可视化引擎
        class VisualizerEngine {
            constructor() {
                this.canvas = document.getElementById('visualizer');
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.particles = null;
                this.controls = null;
                this.composer = null;
                
                this.initialized = false;
                
                // 粒子系统参数
                this.particleCount = 20000;
                this.lorenzState = { x: 0.1, y: 0, z: 0 };
                this.params = { sigma: 10, rho: 28, beta: 2.66 };
            }
            
            init() {
                try {
                    // 检查WebGL支持
                    if (!this.checkWebGLSupport()) {
                        throw new Error('您的浏览器不支持WebGL');
                    }
                    
                    // 初始化Three.js
                    this.scene = new THREE.Scene();
                    
                    // 相机
                    this.camera = new THREE.PerspectiveCamera(
                        60, 
                        window.innerWidth / window.innerHeight, 
                        0.1, 
                        1000
                    );
                    this.camera.position.set(0, 0, 90);
                    
                    // 渲染器
                    this.renderer = new THREE.WebGLRenderer({
                        canvas: this.canvas,
                        antialias: true,
                        alpha: true,
                        powerPreference: 'high-performance'
                    });
                    
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                    this.renderer.setClearColor(0x000000, 0);
                    
                    // 初始化粒子系统
                    this.initParticles();
                    
                    // 初始化控制器
                    this.initControls();
                    
                    // 初始化后处理（Bloom效果）
                    this.initPostProcessing();
                    
                    // 处理窗口大小变化
                    window.addEventListener('resize', () => this.onResize());
                    
                    this.initialized = true;
                    console.log('可视化引擎初始化成功');
                    
                    return true;
                    
                } catch (error) {
                    console.error('可视化引擎初始化失败:', error);
                    this.showMessage('可视化引擎初始化失败: ' + error.message);
                    return false;
                }
            }
            
            checkWebGLSupport() {
                try {
                    const canvas = document.createElement('canvas');
                    return !!(window.WebGLRenderingContext && 
                        (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
                } catch {
                    return false;
                }
            }
            
            initParticles() {
                // 创建粒子几何体
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(this.particleCount * 3);
                
                // 初始化粒子位置
                for (let i = 0; i < this.particleCount * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 20;
                    positions[i + 1] = (Math.random() - 0.5) * 20;
                    positions[i + 2] = (Math.random() - 0.5) * 20;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                
                // 创建粒子材质
                const material = new THREE.PointsMaterial({
                    size: 0.15,
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending,
                    sizeAttenuation: true
                });
                
                // 创建粒子系统
                this.particles = new THREE.Points(geometry, material);
                this.scene.add(this.particles);
            }
            
            initControls() {
                // 轨道控制器
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.autoRotate = true;
                this.controls.autoRotateSpeed = 0.3;
                this.controls.maxPolarAngle = Math.PI * 0.8;
                this.controls.minDistance = 30;
                this.controls.maxDistance = 150;
            }
            
            initPostProcessing() {
                // 效果合成器
                this.composer = new THREE.EffectComposer(this.renderer);
                
                // 渲染通道
                const renderPass = new THREE.RenderPass(this.scene, this.camera);
                this.composer.addPass(renderPass);
                
                // Bloom效果
                const bloomPass = new THREE.UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    1.0,  // 强度
                    0.4,  // 半径
                    0.85  // 阈值
                );
                this.composer.addPass(bloomPass);
            }
            
            update(audioData) {
                if (!this.initialized || !this.particles) return;
                
                // 获取粒子位置数据
                const positions = this.particles.geometry.attributes.position.array;
                
                // 音频驱动的参数
                const dt = 0.008 + audioData.energy * 0.01;
                const s = this.params.sigma + audioData.high * 8;
                const r = this.params.rho + audioData.bass * 20;
                const b = this.params.beta;
                
                let { x, y, z } = this.lorenzState;
                
                // 更新粒子位置（Lorenz吸引子）
                for (let i = 0; i < positions.length; i += 3) {
                    const dx = s * (y - x) * dt;
                    const dy = (x * (r - z) - y) * dt;
                    const dz = (x * y - b * z) * dt;
                    
                    x += dx;
                    y += dy;
                    z += dz;
                    
                    positions[i] = x;
                    positions[i + 1] = y;
                    positions[i + 2] = z;
                }
                
                // 保存状态供下一帧使用
                this.lorenzState = { x, y, z };
                this.particles.geometry.attributes.position.needsUpdate = true;
                
                // 更新粒子颜色
                const hue = 180 + audioData.bass * 60;
                const lightness = 0.5 + audioData.energy * 0.3;
                this.particles.material.color.setHSL(hue / 360, 0.8, lightness);
                
                // 更新控制器
                this.controls.update();
            }
            
            render() {
                if (!this.initialized) return;
                
                // 渲染场景
                this.composer.render();
            }
            
            onResize() {
                if (!this.initialized) return;
                
                const width = window.innerWidth;
                const height = window.innerHeight;
                
                // 更新相机
                this.camera.aspect = width / height;
                this.camera.updateProjectionMatrix();
                
                // 更新渲染器
                this.renderer.setSize(width, height);
                this.composer.setSize(width, height);
                
                // 更新像素比
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            }
            
            showMessage(message) {
                const prompt = document.getElementById('permission-prompt');
                if (prompt) {
                    prompt.textContent = message;
                    prompt.style.display = 'block';
                    
                    setTimeout(() => {
                        prompt.style.display = 'none';
                    }, 3000);
                }
            }
        }
        
        // 主应用
        const SonoriaApp = {
            audioEngine: null,
            visualizer: null,
            initialized: false,
            
            async init() {
                console.log('初始化Sonoria应用...');
                
                // 绑定入口点击事件
                const intro = document.getElementById('intro-layer');
                intro.addEventListener('click', () => this.startExperience());
                
                // 初始化音频引擎（不立即创建音频上下文）
                this.audioEngine = new AudioEngine();
                
                // 初始化可视化引擎
                this.visualizer = new VisualizerEngine();
                
                // 绑定控制事件
                this.bindControls();
                
                console.log('应用初始化完成，等待用户交互...');
            },
            
            async startExperience() {
                if (this.initialized) return;
                
                try {
                    console.log('开始体验...');
                    
                    // 处理用户交互（解锁音频）
                    this.audioEngine.handleUserInteraction();
                    
                    // 初始化可视化引擎
                    const vizSuccess = this.visualizer.init();
                    if (!vizSuccess) {
                        throw new Error('可视化引擎初始化失败');
                    }
                    
                    // 开始动画循环
                    this.startAnimationLoop();
                    
                    // 隐藏入场层
                    document.getElementById('intro-layer').classList.add('hidden');
                    
                    // 显示画布和UI
                    document.getElementById('canvas-container').classList.add('visible');
                    document.getElementById('ui-layer').classList.add('visible');
                    
                    this.initialized = true;
                    console.log('体验开始成功');
                    
                    // 显示欢迎消息
                    this.updateTrackInfo('欢迎来到Sonoria');
                    
                } catch (error) {
                    console.error('启动体验失败:', error);
                    this.showMessage('启动失败: ' + error.message);
                }
            },
            
            bindControls() {
                // 文件上传
                const fileInput = document.getElementById('file-input');
                fileInput.addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    const fileName = file.name.split('.')[0];
                    this.updateTrackInfo(`加载中: ${fileName}...`);
                    
                    try {
                        const success = await this.audioEngine.loadFile(file);
                        if (success) {
                            this.updateTrackInfo(fileName);
                            this.updatePlayState(true);
                        }
                    } catch (error) {
                        console.error('文件加载失败:', error);
                        this.updateTrackInfo('加载失败');
                        this.updatePlayState(false);
                    }
                });
                
                // 播放按钮
                const playBtn = document.getElementById('play-btn');
                playBtn.addEventListener('click', () => {
                    const playing = this.audioEngine.play();
                    this.updatePlayState(playing);
                });
                
                // 麦克风按钮
                const micBtn = document.getElementById('mic-btn');
                micBtn.addEventListener('click', async () => {
                    const active = await this.audioEngine.toggleMic();
                    
                    micBtn.classList.toggle('mic-active', active);
                    
                    if (active) {
                        this.updateTrackInfo('环境音感应中...');
                        this.updatePlayState(true);
                    } else {
                        this.updateTrackInfo('等待输入...');
                        this.updatePlayState(false);
                    }
                });
                
                // 键盘快捷键
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        playBtn.click();
                    }
                });
            },
            
            startAnimationLoop() {
                const animate = () => {
                    requestAnimationFrame(animate);
                    
                    // 获取音频数据
                    const audioData = this.audioEngine ? this.audioEngine.getAudioData() : {
                        bass: 0, mid: 0, high: 0, energy: 0
                    };
                    
                    // 更新可视化
                    this.visualizer.update(audioData);
                    this.visualizer.render();
                };
                
                animate();
            },
            
            updateTrackInfo(text) {
                const element = document.getElementById('current-track');
                if (element) {
                    element.textContent = text;
                }
            },
            
            updatePlayState(playing) {
                const playIcon = document.getElementById('icon-play');
                const pauseIcon = document.getElementById('icon-pause');
                const statusDot = document.getElementById('play-status');
                
                if (playing) {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    statusDot.classList.add('active');
                } else {
                    playIcon.style.display = 'block';
                    pauseIcon.style.display = 'none';
                    statusDot.classList.remove('active');
                }
            },
            
            showMessage(message) {
                this.audioEngine.showMessage(message);
            }
        };
        
        // 页面加载完成后初始化应用
        window.addEventListener('DOMContentLoaded', () => {
            SonoriaApp.init();
        });
        
        // 处理窗口大小变化
        window.addEventListener('resize', () => {
            if (SonoriaApp.visualizer) {
                SonoriaApp.visualizer.onResize();
            }
        });
        
    </script>
</body>
</html>
