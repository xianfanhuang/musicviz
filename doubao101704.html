<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonoria |动人心绚，乐音之境</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #f093fb;
            --accent: #4facfe;
            --bg-dark: #0a0a14;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.6);
            --border-light: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            --radius-lg: 28px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --pulse: 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* 浅色模式支持 */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-dark: #f8f9fc;
                --bg-card: rgba(0, 0, 0, 0.02);
                --bg-card-hover: rgba(0, 0, 0, 0.04);
                --text-primary: rgba(0, 0, 0, 0.9);
                --text-secondary: rgba(0, 0, 0, 0.5);
                --border-light: rgba(0, 0, 0, 0.06);
                --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            touch-action: manipulation;
            line-height: 1.5;
        }

        #visualizer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: opacity 1s ease;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 10, 20, 0.5) 0%, rgba(10, 10, 20, 0.2) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 播放器卡片 - 核心容器 */
        .player-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(120%);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
            max-height: 92vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .player-card:hover {
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.15);
        }

        /* 横屏模式优化 */
        @media (orientation: landscape) and (max-height: 550px) {
            .player-card {
                max-width: 90vw;
                display: flex;
                flex-direction: row;
                align-items: center;
                padding: 20px;
                max-height: 90vh;
            }
            
            .logo-section {
                margin-bottom: 0;
                margin-right: 24px;
                flex-shrink: 0;
            }
            
            .upload-area {
                display: none;
            }
        }

        /* 品牌标识 */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
            position: relative;
        }

        .logo-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 0 32px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
            transition: transform 0.5s var(--pulse);
        }

        .is-playing .logo-circle {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.4);
        }

        .logo-circle::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
        }

        .logo-icon {
            font-size: 2rem;
            color: white;
            z-index: 1;
        }

        .brand {
            text-align: center;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .slogan {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
        }

        /* 曲目信息 - 情感化展示 */
        .player-info {
            text-align: center;
            margin-bottom: 28px;
            padding: 0 12px;
            transition: transform 0.3s ease;
        }

        .is-playing .player-info {
            transform: translateY(-4px);
        }

        .track-title {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.3s ease;
            letter-spacing: 0.1px;
        }

        .track-artist {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* URL输入区域 - 极简设计 */
        .url-input-section {
            margin: 18px 0;
            position: relative;
        }

        .url-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }

        .url-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.15);
            background: var(--bg-card-hover);
        }

        .parse-button {
            margin-top: 10px;
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
            -webkit-appearance: none;
            font-size: 0.9rem;
            letter-spacing: 0.2px;
        }

        .parse-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.25);
        }

        .parse-button:active {
            transform: translateY(0);
        }

        /* 进度条 - 精致交互 */
        .progress-section {
            margin: 28px 0;
            position: relative;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
            cursor: pointer;
            position: relative;
            touch-action: manipulation;
            transition: height 0.2s ease;
        }

        .progress-bar:hover {
            height: 6px;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }

        .progress::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            transform: translate(50%, -25%);
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.6);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .progress-bar:hover .progress::after {
            opacity: 1;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* 控制按钮 - 图标驱动设计 */
        .control-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 24px;
            gap: 20px;
        }

        .icon-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .icon-button:hover {
            background: var(--bg-card-hover);
            transform: translateY(-3px);
        }

        .icon-button:active {
            transform: translateY(0);
        }

        .icon-button.active {
            background: rgba(102, 126, 234, 0.15);
            color: var(--primary);
        }

        /* 呼吸感波纹效果 */
        .icon-button.ripple::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 10%, transparent 10.01%);
            transform: scale(0);
            animation: ripple 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes ripple {
            to { transform: scale(2.5); opacity: 0; }
        }

        /* 主播放按钮 - 情感焦点 */
        .play-button {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
            color: white;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .play-button:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .play-button:active {
            transform: translateY(0) scale(1);
        }

        /* 底部导航 - 极简图标 */
        .bottom-nav {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 28px;
        }

        /* 上传区域 - 呼吸感设计 */
        .upload-area {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 110px;
            border: 2px dashed var(--border-light);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.4s ease;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 24px;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(102, 126, 234, 0.05);
            transform: translateY(-2px);
        }

        .upload-area i {
            font-size: 26px;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .upload-area:hover i {
            color: var(--primary);
        }

        .upload-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.1px;
        }

        /* 主题选择器 - 精致标签 */
        .theme-selector {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .theme-button {
            padding: 6px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.2px;
        }

        .theme-button.active {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.3);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
        }

        .theme-button:hover:not(.active) {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        /* 播放列表 - 优雅展开 */
        .playlist-section {
            margin-top: 24px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: var(--radius-md);
            background: rgba(0, 0, 0, 0.05);
        }

        .playlist-section.expanded {
            max-height: 300px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 12px;
            padding-top: 16px;
        }

        .playlist-title {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .playlist-controls {
            display: flex;
            gap: 8px;
        }

        .playlist-items {
            max-height: 250px;
            overflow-y: auto;
            padding: 0 12px 12px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .playlist-item:hover {
            background: var(--bg-card-hover);
            transform: translateX(4px);
        }

        .playlist-item.active {
            background: rgba(102, 126, 234, 0.15);
        }

        .playlist-item.dragging {
            opacity: 0.6;
            transform: scale(1.02);
            background: rgba(102, 126, 234, 0.1);
        }

        .playlist-item-icon {
            margin-right: 12px;
            color: var(--text-secondary);
            font-size: 18px;
        }

        .playlist-item-info {
            flex: 1;
            overflow: hidden;
        }

        .playlist-item-title {
            font-size: 0.82rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .playlist-item-artist {
            font-size: 0.72rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-duration {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-left: 10px;
            font-weight: 500;
        }

        .playlist-item-delete {
            font-size: 16px;
            color: var(--text-secondary);
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .playlist-item:hover .playlist-item-delete {
            opacity: 1;
        }

        .playlist-item-delete:hover {
            color: #ff6b6b;
            transform: scale(1.1);
        }

        /* 通知栏 - 情感反馈 */
        .status {
            text-align: center;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 24px;
            font-weight: 500;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
        }

        .status.visible {
            opacity: 1;
            transform: translateY(0);
        }

        input[type="file"] {
            display: none;
        }

        /* 引导模态框 - 优雅呈现 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            transform: scale(0.95) translateY(20px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal.show .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-content h2 {
            font-size: 1.6rem;
            margin-bottom: 16px;
            font-weight: 600;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .modal-content p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .modal-content button {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 24px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
            -webkit-appearance: none;
        }

        .modal-content button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        /* 加载指示器 - 精致动画 */
        #loading-indicator {
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            z-index: 9999; 
            padding: 14px 22px; 
            background: var(--bg-card);
            border-radius: var(--radius-sm); 
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.9);
            transition: all 0.3s ease;
        }

        #loading-indicator.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .loader-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 语言切换按钮 - 极简设计 */
        .language-switcher {
            position: absolute;
            top: 24px;
            right: 24px;
            padding: 4px 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .language-switcher:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        /* 性能模式切换 */
        .performance-toggle {
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .performance-toggle.active {
            background: rgba(102, 126, 234, 0.15);
            color: var(--primary);
        }

        /* 响应式优化 */
        @media (max-width: 480px) {
            .player-card {
                padding: 28px 20px;
            }
            
            .control-row {
                gap: 16px;
            }
            
            .icon-button {
                width: 44px;
                height: 44px;
            }
            
            .play-button {
                width: 58px;
                height: 58px;
            }
            
            .bottom-nav {
                gap: 20px;
            }
            
            .theme-selector {
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <canvas id="visualizer"></canvas>
    <div class="overlay"></div>

    <div class="container" id="main-container">
        <div class="player-card" id="player-card">
            <button class="language-switcher" id="language-switcher">中/En</button>
            
            <div class="logo-section">
                <div class="logo-circle">
                    <i class="material-icons-round logo-icon">graphic_eq</i>
                </div>
                <div class="brand">
                    <h1 class="title">Sonoria</h1>
                    <p class="slogan" data-i18n="slogan">动人心绚，乐音之境</p>
                </div>
            </div>

            <div class="player-info" id="player-info">
                <div class="track-title" id="track-title" data-i18n="waiting">等待音频输入</div>
                <div class="track-artist" id="track-artist" data-i18n="instruction">上传音乐文件或使用麦克风</div>
            </div>

            <!-- URL输入区域 -->
            <div class="url-input-section">
                <input type="text" class="url-input" id="url-input" placeholder="输入网易云/QQ音乐/B站音频链接" data-i18n-placeholder="urlPlaceholder">
                <button class="parse-button" id="parse-button" data-i18n="parseButton">解析链接</button>
            </div>

            <div class="progress-section">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="control-row">

            <div class="theme-selector">

                <button class="theme-button" data-mode="cosmic">宇宙</button>

            <div class="playlist-section" id="playlist-section">
                <div class="playlist-header">
                    <div class="playlist-title" data-i18n="playlist">播放列表</div>
                    <div class="playlist-controls">
