<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitCode Qwen API 测试</title>
    <script src="https://cdn.jsdelivr.net/npm/openai@4.28.0/+esm" type="module"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e4e4e7;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 24px;
        }
        h1 {
            color: #fff;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #a1a1aa;
            font-weight: 500;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #8E2DE2;
        }
        button {
            background: #7C3AED;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #6d28d9;
        }
        button:disabled {
            background: #3f3f46;
            cursor: not-allowed;
        }
        #response {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .loading {
            color: #a1a1aa;
        }
        .info {
            background: rgba(124,58,237,0.1);
            border: 1px solid rgba(124,58,237,0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #c4b5fd;
        }
    </style>
</head>
<body>
    <h1>🤖 GitCode Qwen API 测试</h1>

    <div class="info">
        <strong>💡 提示：</strong><br>
        1. 访问 <a href="https://ai.gitcode.com/dashboard/api-key" target="_blank" style="color:#fff;text-decoration:underline;">https://ai.gitcode.com/dashboard/api-key</a> 创建API密钥<br>
        2. 选择合适的模型（推荐 Qwen/Qwen3.5-122B-A10B）<br>
        3. 免费额度：登录送200万Token，学生每月5000万Token
    </div>

    <div class="container">
        <div class="input-group">
            <label for="apiKey">GitCode API Key</label>
            <input type="password" id="apiKey" placeholder="请输入GitCode API密钥（只在你本地使用，不会上传）">
        </div>

        <div class="input-group">
            <label for="model">选择模型</label>
            <select id="model">
                <option value="Qwen/Qwen3.5-35B-A3B">Qwen/Qwen3.5-35B-A3B (快速)</option>
                <option value="Qwen/Qwen3.5-122B-A10B" selected>Qwen/Qwen3.5-122B-A10B (平衡)</option>
                <option value="Qwen/Qwen3.5-397B-A17B">Qwen/Qwen3.5-397B-A17B (高质量)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="message">测试消息</label>
            <textarea id="message" rows="3" placeholder="输入要发送给AI的消息...">你好，请介绍一下自己</textarea>
        </div>

        <button id="sendBtn" onclick="sendRequest()">发送请求</button>

        <div id="response"></div>
    </div>

    <script type="module">
        async function sendRequest() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('model').value;
            const message = document.getElementById('message').value.trim();
            const responseDiv = document.getElementById('response');
            const sendBtn = document.getElementById('sendBtn');

            if (!apiKey) {
                alert('请输入GitCode API Key');
                return;
            }

            if (!message) {
                alert('请输入测试消息');
                return;
            }

            responseDiv.innerHTML = '<span class="loading">⏳ 发送中...</span>';
            sendBtn.disabled = true;

            try {
                const openai = new OpenAI({
                    apiKey: apiKey,
                    baseURL: 'https://api-ai.gitcode.com/v1',
                    dangerouslyAllowBrowser: true
                });

                const response = await openai.chat.completions.create({
                    model: model,
                    messages: [
                        {
                            role: 'system',
                            content: '你是一个有帮助的AI助手。'
                        },
                        {
                            role: 'user',
                            content: message
                        }
                    ],
                    max_tokens: 500,
                    temperature: 0.7
                });

                const content = response.choices[0]?.message?.content || '无返回内容';
                const usage = response.usage;

                responseDiv.innerHTML = `
                    <strong>📤 回复：</strong><br><br>
                    ${content}

                    <br><br>
                    <strong>📊 Token使用：</strong>
                    <pre style="background:#27272a;padding:8px;border-radius:4px;margin-top:8px;font-size:12px;">
Prompt: ${usage.prompt_tokens}
Completion: ${usage.completion_tokens}
Total: ${usage.total_tokens}
                    </pre>
                `;

                console.log('完整响应：', response);

            } catch (error) {
                console.error('错误：', error);
                responseDiv.innerHTML = `
                    <span style="color:#ef4444;">
                        <strong>❌ 请求失败</strong><br><br>
                        ${error.message}<br><br>
                        <small>请检查API Key是否正确，查看控制台获取详细信息</small>
                    </span>
                `;
            } finally {
                sendBtn.disabled = false;
            }
        }

        // 导出到全局作用域
        window.sendRequest = sendRequest;
    </script>
</body>
</html>
