<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonoria - 动人心绚，乐音之境</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #667eea;
            --secondary: #f093fb;
            --tertiary: #4facfe;
            --bg-dark: #0a0a14;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: rgba(255, 255, 255, 0.9);
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border-light: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            touch-action: none;
        }
        
        #visualizer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 10, 20, 0.4) 0%, rgba(10, 10, 20, 0.2) 100%);
            z-index: 2;
            pointer-events: none;
        }
        
        .container {
            position: relative;
            z-index: 3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.5s ease;
        }
        
        .player-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 500px;
            transition: all 0.5s ease;
            position: relative;
        }
        
        .player-card.minimized {
            padding: 20px;
            border-radius: 50px;
            width: auto;
            max-width: 300px;
        }
        
        .minimized .player-info,
        .minimized .progress-section,
        .minimized .upload-area,
        .minimized .theme-selector,
        .minimized .playlist-section {
            display: none;
        }
        
        .minimized .control-row {
            justify-content: center;
        }
        
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .logo-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .logo-circle::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
        }
        
        .logo-icon {
            font-size: 2rem;
            color: white;
            z-index: 1;
        }
        
        .brand {
            text-align: center;
        }
        
        .title {
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--tertiary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
            letter-spacing: -0.5px;
        }
        
        .slogan {
            font-size: 0.9rem;
            opacity: 0.8;
            font-weight: 300;
            margin-top: 4px;
        }
        
        .player-info {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .track-title {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .track-artist {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .progress-section {
            margin: 25px 0;
        }
        
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        
        .icon-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-light);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .icon-button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .icon-button:active {
            transform: translateY(1px);
        }
        
        .icon-button.active {
            background: rgba(102, 126, 234, 0.2);
            color: #8a7cff;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }
        
        .icon-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .play-button {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }
        
        .upload-area {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100px;
            border: 2px dashed var(--border-light);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }
        
        .upload-area:hover {
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(102, 126, 234, 0.05);
        }
        
        .upload-area i {
            font-size: 28px;
            color: var(--text-secondary);
        }
        
        .upload-text {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .theme-selector {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .theme-button {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }
        
        .theme-button.active {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.5);
            color: var(--text-primary);
        }
        
        .theme-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .playlist-section {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .playlist-title {
            font-size: 1rem;
            font-weight: 500;
        }
        
        .playlist-controls {
            display: flex;
            gap: 10px;
        }
        
        .playlist-items {
            max-height: 150px;
            overflow-y: auto;
        }
        
        .playlist-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .playlist-item.active {
            background: rgba(102, 126, 234, 0.2);
        }
        
        .playlist-item-icon {
            margin-right: 12px;
            color: var(--text-secondary);
        }
        
        .playlist-item-info {
            flex: 1;
            overflow: hidden;
        }
        
        .playlist-item-title {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .playlist-item-artist {
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .playlist-item-duration {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-left: 10px;
        }
        
        .status {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 20px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .swipe-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        
        .swipe-hint.show {
            opacity: 1;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .player-card {
                padding: 25px;
            }
            
            .title {
                font-size: 1.8rem;
            }
            
            .control-row {
                gap: 10px;
            }
            
            .icon-button {
                width: 40px;
                height: 40px;
            }
            
            .play-button {
                width: 50px;
                height: 50px;
            }
            
            .theme-selector {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .theme-button {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
        
        @media (max-width: 480px) {
            .player-card {
                padding: 20px;
            }
            
            .title {
                font-size: 1.6rem;
            }
            
            .control-row {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <canvas id="visualizer"></canvas>
    <div class="overlay"></div>
    
    <div class="container" id="main-container">
        <div class="player-card" id="player-card">
            <div class="logo-section">
                <div class="logo-circle" id="logo-circle">
                    <i class="material-icons logo-icon">music_note</i>
                </div>
                <div class="brand">
                    <h1 class="title">Sonoria</h1>
                    <p class="slogan">动人心绚，乐音之境</p>
                </div>
            </div>
            
            <div class="player-info" id="player-info">
                <div class="track-title" id="track-title">等待音乐...</div>
                <div class="track-artist" id="track-artist">上传或选择音乐开始体验</div>
            </div>
            
            <div class="progress-section">
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>
            
            <div class="control-row">
                <button class="icon-button" id="shuffle-button" title="随机播放">
                    <i class="material-icons">shuffle</i>
                </button>
                <button class="icon-button" id="prev-button" title="上一首">
                    <i class="material-icons">skip_previous</i>
                </button>
                <button class="icon-button play-button" id="play-toggle" title="播放">
                    <i class="material-icons">play_arrow</i>
                </button>
                <button class="icon-button" id="next-button" title="下一首">
                    <i class="material-icons">skip_next</i>
                </button>
                <button class="icon-button" id="mic-toggle" title="麦克风">
                    <i class="material-icons">mic_none</i>
                </button>
            </div>
            
            <div class="upload-area" id="upload-area">
                <i class="material-icons">library_music</i>
                <div class="upload-text">拖放音乐文件到此处或点击上传</div>
            </div>
            
            <div class="theme-selector">
                <button class="theme-button active" data-mode="aurora">极光</button>
                <button class="theme-button" data-mode="cosmic">宇宙</button>
                <button class="theme-button" data-mode="neural">神经</button>
                <button class="theme-button" data-mode="liquid">液态</button>
                <button class="theme-button" data-mode="quantum">量子</button>
            </div>
            
            <div class="playlist-section" id="playlist-section">
                <div class="playlist-header">
                    <div class="playlist-title">播放列表</div>
                    <div class="playlist-controls">
                        <button class="icon-button" id="clear-button" title="清空列表">
                            <i class="material-icons">clear_all</i>
                        </button>
                        <button class="icon-button" id="sort-button" title="随机排序">
                            <i class="material-icons">shuffle</i>
                        </button>
                    </div>
                </div>
                
                <div class="playlist-items" id="playlist-items">
                    <!-- 播放列表项将动态添加 -->
                </div>
            </div>
            
            <div class="status" id="status">
            </div>
        </div>
    </div>

    <div class="swipe-hint" id="swipe-hint">左右滑动切换可视化主题</div>

    <input type="file" id="audio-upload" accept="audio/mp3,audio/m4a,audio/wav,audio/flac,audio/*,video/mp4" multiple>
    
    <script>
        class AudioVisualizer {
            constructor(canvas, audioContext) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.audioContext = audioContext;
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 1024;
                this.analyser.smoothingTimeConstant = 0.85;
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.bufferLength = this.analyser.frequencyBinCount;
                this.animationId = null;
                
                this.mode = 'aurora';
                this.isPlaying = false;
                this.hue = 0;
                this.beatHistory = [];
                this.lastBeatTime = 0;
                this.bpm = 120;
                this.beatIntervals = [];
                this.HISTORY_SIZE = 43;
                this.BEAT_THRESHOLD = 1.2;
                this.BPM_HISTORY = 10;
                this.particles = [];
                this.waves = [];
                
                this.resizeCanvas();
                window.addEventListener('resize', this.resizeCanvas.bind(this));
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            connectAudio(source) {
                const audioSource = typeof source === 'string' ? new Audio(source) : source;
                const mediaSource = this.audioContext.createMediaElementSource(audioSource);
                mediaSource.connect(this.analyser);
                this.analyser.connect(this.audioContext.destination);
            }

            connectStream(stream) {
                const streamSource = this.audioContext.createMediaStreamSource(stream);
                streamSource.connect(this.analyser);
            }

            setMode(mode) {
                this.mode = mode;
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < 200; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.5,
                        size: Math.random() * 2 + 1,
                        opacity: Math.random() * 0.4 + 0.3,
                        baseSize: Math.random() * 2 + 1
                    });
                }
            }

            initWaves() {
                this.waves = [];
                for (let i = 0; i < 4; i++) {
                    this.waves.push({
                        amplitude: 0,
                        frequency: 0.015 + i * 0.01,
                        phase: 0,
                        y: this.canvas.height / 2 + (i - 1.5) * 40
                    });
                }
            }

            detectBeat(energy) {
                this.beatHistory.push(energy);
                if (this.beatHistory.length > this.HISTORY_SIZE) this.beatHistory.shift();
                if (this.beatHistory.length === this.HISTORY_SIZE) {
                    const avg = this.beatHistory.reduce((a, b) => a + b) / this.HISTORY_SIZE;
                    const variance = this.beatHistory.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / this.HISTORY_SIZE;
                    const threshold = -variance * 0.0025 + this.BEAT_THRESHOLD;
                    if (energy > avg * threshold && performance.now() - this.lastBeatTime > 200) {
                        this.lastBeatTime = performance.now();
                        this.beatIntervals.push(this.lastBeatTime);
                        if (this.beatIntervals.length > this.BPM_HISTORY + 1) this.beatIntervals.shift();
                        if (this.beatIntervals.length > 1) {
                            const intervals = [];
                            for (let i = 1; i < this.beatIntervals.length; i++) {
                                intervals.push(this.beatIntervals[i] - this.beatIntervals[i - 1]);
                            }
                            const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
                            this.bpm = 60000 / avgInterval;
                        }
                        return true;
                    }
                }
                return false;
            }

            getEmotionHue(bpm, energy) {
                const arousal = Math.min(1, bpm / 180);
                const valence = Math.min(1, energy / 255);
                return (arousal * 60 + valence * 120) % 360;
            }

            animate() {
                this.animationId = requestAnimationFrame(this.animate.bind(this));
                if (!this.isPlaying) return;

                this.analyser.getByteFrequencyData(this.dataArray);
                const bass = this.dataArray.slice(0, 40).reduce((a, b) => a + b) / 40;
                const mid = this.dataArray.slice(80, 200).reduce((a, b) => a + b) / 120;
                const treble = this.dataArray.slice(300, 512).reduce((a, b) => a + b) / 212;
                const energy = this.dataArray.reduce((a, b) => a + b) / this.dataArray.length;
                const isBeat = this.detectBeat(energy);
                this.hue = this.getEmotionHue(this.bpm, energy);

                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                const gradient = this.ctx.createRadialGradient(this.canvas.width / 2, this.canvas.height / 2, 0, this.canvas.width / 2, this.canvas.height / 2, Math.max(this.canvas.width, this.canvas.height) / 2);
                gradient.addColorStop(0, `hsla(${this.hue}, 75%, 20%, 0.9)`);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 1)');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                let pulseRadius = 70 + bass / 1.2;
                if (isBeat) pulseRadius *= 1.5;
                const pulseGradient = this.ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, pulseRadius);
                pulseGradient.addColorStop(0, `hsla(${this.hue + 180}, 85%, 55%, ${bass / 255 + (isBeat ? 0.3 : 0)})`);
                pulseGradient.addColorStop(1, `hsla(${this.hue + 180}, 85%, 55%, 0)`);
                this.ctx.fillStyle = pulseGradient;
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, pulseRadius, 0, Math.PI * 2);
                this.ctx.fill();

                switch (this.mode) {
                    case 'aurora':
                        // Wave-based for aurora
                        this.waves.forEach((wave, i) => {
                            wave.amplitude += ((mid / 1.5 + 25 + (isBeat ? 50 : 0)) - wave.amplitude) * 0.12;
                            wave.phase += 0.04 + treble / 6000;
                            this.ctx.beginPath();
                            this.ctx.strokeStyle = `hsla(${this.hue + i * 50}, 65%, 65%, ${0.6 + bass / 512})`;
                            this.ctx.lineWidth = 2.5;
                            for (let x = 0; x < this.canvas.width; x += 4) {
                                const y = wave.y + Math.sin(x * wave.frequency + wave.phase) * wave.amplitude;
                                this.ctx.lineTo(x, y);
                            }
                            this.ctx.stroke();
                        });
                        break;
                    case 'cosmic':
                        // Particle-based for cosmic
                        this.particles.forEach(p => {
                            const dx = centerX - p.x;
                            const dy = centerY - p.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist > 0) {
                                p.vx += (dx / dist) * (bass / 700);
                                p.vy += (dy / dist) * (bass / 700);
                            }

                            p.vx += (Math.random() - 0.5) * (treble / 350);
                            p.vy += (Math.random() - 0.5) * (treble / 350);
                            if (isBeat) {
                                p.vx *= 1.3;
                                p.vy *= 1.3;
                            }
                            p.vx *= 0.96;
                            p.vy *= 0.96;

                            p.x += p.vx;
                            p.y += p.vy;

                            if (p.x < 0) p.x = this.canvas.width;
                            if (p.x > this.canvas.width) p.x = 0;
                            if (p.y < 0) p.y = this.canvas.height;
                            if (p.y > this.canvas.height) p.y = 0;

                            p.size = p.baseSize + bass / 80 + (isBeat ? 2 : 0);
                            this.ctx.beginPath();
                            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            this.ctx.fillStyle = `hsla(${this.hue + treble / 4}, 75%, 75%, ${p.opacity})`;
                            this.ctx.fill();
                        });
                        break;
                    case 'neural':
                        // Line connections for neural
                        // Similar to particles but with lines between them
                        this.particles.forEach(p => {
                            // Update as in cosmic
                            const dx = centerX - p.x;
                            const dy = centerY - p.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist > 0) {
                                p.vx += (dx / dist) * (bass / 700);
                                p.vy += (dy / dist) * (bass / 700);
                            }

                            p.vx += (Math.random() - 0.5) * (treble / 350);
                            p.vy += (Math.random() - 0.5) * (treble / 350);
                            if (isBeat) {
                                p.vx *= 1.3;
                                p.vy *= 1.3;
                            }
                            p.vx *= 0.96;
                            p.vy *= 0.96;

                            p.x += p.vx;
                            p.y += p.vy;

                            if (p.x < 0) p.x = this.canvas.width;
                            if (p.x > this.canvas.width) p.x = 0;
                            if (p.y < 0) p.y = this.canvas.height;
                            if (p.y > this.canvas.height) p.y = 0;
                        });

                        this.particles.forEach((p1, i) => {
                            this.particles.slice(i + 1).forEach(p2 => {
                                const dx = p1.x - p2.x;
                                const dy = p1.y - p2.y;
                                const dist = Math.sqrt(dx * dx + dy * dy);
                                if (dist < 100) {
                                    this.ctx.beginPath();
                                    this.ctx.moveTo(p1.x, p1.y);
                                    this.ctx.lineTo(p2.x, p2.y);
                                    this.ctx.strokeStyle = `hsla(${this.hue}, 50%, 50%, ${1 - dist / 100})`;
                                    this.ctx.lineWidth = 1;
                                    this.ctx.stroke();
                                }
                            });
                            this.ctx.beginPath();
                            this.ctx.arc(p1.x, p1.y, p1.size, 0, Math.PI * 2);
                            this.ctx.fillStyle = `hsla(${this.hue + treble / 4}, 75%, 75%, ${p1.opacity})`;
                            this.ctx.fill();
                        });
                        break;
                    case 'liquid':
                        // Wave with distortion for liquid
                        this.waves.forEach((wave, i) => {
                            wave.amplitude += ((mid / 1.5 + 25 + (isBeat ? 50 : 0)) - wave.amplitude) * 0.12;
                            wave.phase += 0.04 + treble / 6000;
                            this.ctx.beginPath();
                            this.ctx.fillStyle = `hsla(${this.hue + i * 50}, 65%, 65%, ${0.3 + bass / 512})`;
                            this.ctx.moveTo(0, this.canvas.height);
                            for (let x = 0; x < this.canvas.width; x += 4) {
                                const y = wave.y + Math.sin(x * wave.frequency + wave.phase) * wave.amplitude * Math.sin(x / 100);
                                this.ctx.lineTo(x, y);
                            }
                            this.ctx.lineTo(this.canvas.width, this.canvas.height);
                            this.ctx.fill();
                        });
                        break;
                    case 'quantum':
                        // Particle with trails for quantum
                        this.ctx.globalAlpha = 0.05;
                        this.particles.forEach(p => {
                            // Update as in cosmic
                            const dx = centerX - p.x;
                            const dy = centerY - p.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist > 0) {
                                p.vx += (dx / dist) * (bass / 700);
                                p.vy += (dy / dist) * (bass / 700);
                            }

                            p.vx += (Math.random() - 0.5) * (treble / 350);
                            p.vy += (Math.random() - 0.5) * (treble / 350);
                            if (isBeat) {
                                p.vx *= 1.3;
                                p.vy *= 1.3;
                            }
                            p.vx *= 0.96;
                            p.vy *= 0.96;

                            this.ctx.beginPath();
                            this.ctx.moveTo(p.x, p.y);
                            p.x += p.vx;
                            p.y += p.vy;
                            this.ctx.lineTo(p.x, p.y);
                            this.ctx.strokeStyle = `hsla(${this.hue + treble / 4}, 75%, 75%, 0.8)`;
                            this.ctx.lineWidth = p.size;
                            this.ctx.stroke();

                            if (p.x < 0) p.x = this.canvas.width;
                            if (p.x > this.canvas.width) p.x = 0;
                            if (p.y < 0) p.y = this.canvas.height;
                            if (p.y > this.canvas.height) p.y = 0;
                        });
                        this.ctx.globalAlpha = 1;
                        break;
                }

                this.hue = (this.hue + treble / 8) % 360;
            }

            start() {
                this.isPlaying = true;
                this.initParticles();
                this.initWaves();
                this.animate();
            }

            stop() {
                this.isPlaying = false;
                cancelAnimationFrame(this.animationId);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('visualizer');
            const mainContainer = document.getElementById('main-container');
            const playerCard = document.getElementById('player-card');
            const uploadArea = document.getElementById('upload-area');
            const audioUpload = document.getElementById('audio-upload');
            const playToggle = document.getElementById('play-toggle');
            const shuffleButton = document.getElementById('shuffle-button');
            const prevButton = document.getElementById('prev-button');
            const nextButton = document.getElementById('next-button');
            const micToggle = document.getElementById('mic-toggle');
            const clearButton = document.getElementById('clear-button');
            const sortButton = document.getElementById('sort-button');
            const progressBar = document.getElementById('progress');
            const currentTimeEl = document.getElementById('current-time');
            const totalTimeEl = document.getElementById('total-time');
            const trackTitle = document.getElementById('track-title');
            const trackArtist = document.getElementById('track-artist');
            const playlistItems = document.getElementById('playlist-items');
            const swipeHint = document.getElementById('swipe-hint');
            const themeButtons = document.querySelectorAll('.theme-button');
            const status = document.getElementById('status');
            
            let audioContext;
            let analyser;
            let source;
            let audioElement;
            let visualizer;
            let isPlaying = false;
            let isMicActive = false;
            let playlist = [];
            let currentTrack = 0;
            let isShuffled = false;
            let inactivityTimer;
            let touchStartX = 0;
            
            function initAudioContext() {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                visualizer = new AudioVisualizer(canvas, audioContext);
                visualizer.start();
            }

            function setupAudio(fileOrStream, isMic = false) {
                if (!audioContext) initAudioContext();

                if (isMic) {
                    visualizer.connectStream(fileOrStream);
                    isPlaying = true;
                    status.textContent = 'Listening to microphone';
                    return;
                }

                if (audioElement) audioElement.pause();
                audioElement = new Audio(URL.createObjectURL(fileOrStream));
                visualizer.connectAudio(audioElement);
                audioElement.play();
                isPlaying = true;
                playToggle.innerHTML = '<i class="material-icons">pause</i>';
                status.textContent = 'Playing uploaded track';
            }

            uploadArea.addEventListener('click', () => audioUpload.click());

            audioUpload.addEventListener('change', (e) => {
                const files = e.target.files;
                if (files) {
                    Array.from(files).forEach(file => playlist.push(file));
                    if (playlist.length > 0) {
                        currentTrack = 0;
                        setupAudio(playlist[currentTrack]);
                    }
                }
            });

            playToggle.addEventListener('click', () => {
                if (isPlaying) {
                    audioElement.pause();
                    isPlaying = false;
                    playToggle.innerHTML = '<i class="material-icons">play_arrow</i>';
                } else if (audioElement) {
                    audioElement.play();
                    isPlaying = true;
                    playToggle.innerHTML = '<i class="material-icons">pause</i>';
                }
            });

            micToggle.addEventListener('click', async () => {
                if (isMicActive) {
                    isMicActive = false;
                    micToggle.classList.remove('active');
                } else {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        setupAudio(stream, true);
                        isMicActive = true;
                        micToggle.classList.add('active');
                    } catch (err) {
                        status.textContent = 'Microphone access denied';
                    }
                }
            });

            themeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    visualizer.setMode(btn.dataset.mode);
                    themeButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });

            document.addEventListener('touchstart', (e) => touchStartX = e.touches[0].clientX);

            document.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const diffX = touchStartX - touchEndX;
                if (Math.abs(diffX) > 50) {
                    const themes = Array.from(themeButtons).map(b => b.dataset.mode);
                    const currentIndex = themes.indexOf(visualizer.mode);
                    let newIndex;
                    if (diffX > 0) {
                        newIndex = (currentIndex + 1) % themes.length;
                    } else {
                        newIndex = (currentIndex - 1 + themes.length) % themes.length;
                    }
                    visualizer.setMode(themes[newIndex]);
                    themeButtons.forEach(b => b.classList.remove('active'));
                    themeButtons[newIndex].classList.add('active');
                    swipeHint.classList.add('show');
                    setTimeout(() => swipeHint.classList.remove('show'), 2000);
                }
            });

            document.addEventListener('mousemove', () => {
                clearTimeout(inactivityTimer);
                playerCard.classList.remove('minimized');
                inactivityTimer = setTimeout(() => playerCard.classList.add('minimized'), 15000);
            });

            initAudioContext();
        });
    </script>
</body>
</html>
