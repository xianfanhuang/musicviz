<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonoria - 动人心绚，乐音之境</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 重置与基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            /* Apple 风格色彩系统 */
            --system-primary: rgba(10, 132, 255, 0.9);
            --system-secondary: rgba(191, 90, 242, 0.9);
            --system-tertiary: rgba(48, 209, 88, 0.9);
            --system-bg: rgba(0, 0, 0, 0.92);
            --system-surface: rgba(28, 28, 30, 0.8);
            --system-surface-elevated: rgba(44, 44, 46, 0.8);
            --system-label-primary: rgba(255, 255, 255, 0.95);
            --system-label-secondary: rgba(255, 255, 255, 0.75);
            --system-label-tertiary: rgba(255, 255, 255, 0.55);
            --system-border: rgba(255, 255, 255, 0.15);
            
            /* 动态色彩系统 */
            --hue: 220;
            --accent-primary: hsl(var(--hue), 100%, 65%);
            --accent-secondary: hsl(calc(var(--hue) + 30), 100%, 65%);
            
            /* 毛玻璃效果 */
            --backdrop-blur: blur(20px);
            --backdrop-saturate: saturate(180%);
            
            /* 动画曲线 */
            --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            
            /* 间距系统 */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            background: var(--system-bg);
            color: var(--system-label-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            font-weight: 400;
            line-height: 1.47059;
            letter-spacing: -0.022em;
        }
        
        /* ===== 可视化画布 ===== */
        #visualizer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .visualizer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                rgba(120, 120, 255, 0.05) 0%,
                rgba(0, 0, 0, 0) 70%
            );
            z-index: 2;
            pointer-events: none;
        }
        
        /* ===== 主容器与播放器卡片 ===== */
        .container {
            position: relative;
            z-index: 3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-md);
            transition: opacity 0.5s var(--ease-out);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s var(--ease-out) forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .player-card {
            background: var(--system-surface);
            backdrop-filter: var(--backdrop-blur) var(--backdrop-saturate);
            -webkit-backdrop-filter: var(--backdrop-blur) var(--backdrop-saturate);
            border-radius: 24px;
            padding: var(--spacing-xl);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid var(--system-border);
            width: 100%;
            max-width: 500px;
            transition: all 0.4s var(--ease-out);
            position: relative;
            display: grid;
            grid-template-rows: auto 1fr auto auto;
            gap: var(--spacing-lg);
            min-height: 600px;
        }
        
        .player-card:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 24px 48px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        
        .player-card.minimized {
            padding: var(--spacing-lg);
            border-radius: 50px;
            width: auto;
            max-width: 300px;
            min-height: auto;
        }
        
        .minimized .player-info,
        .minimized .progress-section,
        .minimized .upload-area,
        .minimized .theme-selector,
        .minimized .playlist-section {
            display: none;
        }
        
        .minimized .control-row {
            justify-content: center;
        }
        
        /* ===== 品牌与专辑区域 ===== */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .album-art-section {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto var(--spacing-lg);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .album-art {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }
        
        .logo-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-md);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .logo-circle::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
        }
        
        .logo-icon {
            font-size: 2rem;
            color: white;
            z-index: 1;
        }
        
        .brand {
            text-align: center;
        }
        
        .title {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
            letter-spacing: -0.5px;
            line-height: 1.1;
        }
        
        .slogan {
            font-size: 0.9rem;
            opacity: 0.8;
            font-weight: 300;
            margin-top: var(--spacing-xs);
        }
        
        /* ===== 播放信息 ===== */
        .player-info {
            text-align: center;
            margin-bottom: var(--spacing-md);
        }
        
        .track-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.3px;
        }
        
        .track-artist {
            font-size: 0.9rem;
            color: var(--system-label-secondary);
            letter-spacing: -0.1px;
        }
        
        /* ===== 进度条 ===== */
        .progress-section {
            margin: var(--spacing-lg) 0;
        }
        
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            margin-bottom: var(--spacing-sm);
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }
        
        .progress::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .progress-container:hover .progress::after {
            opacity: 1;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--system-label-tertiary);
        }
        
        /* ===== 控制按钮 ===== */
        .control-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: var(--spacing-sm);
            align-items: center;
            justify-items: center;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .system-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.2px;
            cursor: pointer;
            transition: all 0.2s var(--ease-out);
            position: relative;
            overflow: hidden;
        }
        
        .system-button:active {
            transform: scale(0.96);
        }
        
        .system-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .system-button:active::before {
            left: 100%;
        }
        
        .icon-button {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid var(--system-border);
            color: var(--system-label-primary);
        }
        
        .icon-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .icon-button.active {
            background: rgba(10, 132, 255, 0.3);
            color: var(--accent-primary);
            box-shadow: 0 0 20px rgba(10, 132, 255, 0.3);
        }
        
        .icon-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .play-button {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            grid-column: 3;
        }
        
        .play-button:hover {
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }
        
        /* ===== 上传区域 ===== */
        .upload-area {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100px;
            border: 2px dashed var(--system-border);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            flex-direction: column;
            gap: var(--spacing-sm);
            padding: var(--spacing-md);
            text-align: center;
            margin-top: var(--spacing-md);
        }
        
        .upload-area:hover {
            border-color: rgba(10, 132, 255, 0.5);
            background: rgba(10, 132, 255, 0.05);
        }
        
        .upload-area i {
            font-size: 28px;
            color: var(--system-label-secondary);
        }
        
        .upload-text {
            font-size: 14px;
            color: var(--system-label-secondary);
        }
        
        /* ===== 主题选择器 ===== */
        .theme-selector {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .theme-button {
            padding: 8px 16px;
            background: var(--system-surface);
            border: 1px solid var(--system-border);
            border-radius: 20px;
            color: var(--system-label-secondary);
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            font-size: 14px;
            backdrop-filter: blur(10px);
        }
        
        .theme-button.active {
            background: rgba(10, 132, 255, 0.3);
            border-color: rgba(10, 132, 255, 0.5);
            color: var(--system-label-primary);
        }
        
        .theme-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        /* ===== 播放列表 ===== */
        .playlist-section {
            margin-top: var(--spacing-md);
            max-height: 200px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }
        
        .playlist-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.2px;
        }
        
        .playlist-controls {
            display: flex;
            gap: var(--spacing-sm);
        }
        
        .playlist-items {
            max-height: 150px;
            overflow-y: auto;
        }
        
        .playlist-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s var(--ease-out);
        }
        
        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .playlist-item.active {
            background: rgba(10, 132, 255, 0.2);
        }
        
        .playlist-item-icon {
            margin-right: 12px;
            color: var(--system-label-secondary);
        }
        
        .playlist-item-info {
            flex: 1;
            overflow: hidden;
        }
        
        .playlist-item-title {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .playlist-item-artist {
            font-size: 0.75rem;
            color: var(--system-label-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .playlist-item-duration {
            font-size: 0.75rem;
            color: var(--system-label-secondary);
            margin-left: 10px;
        }
        
        /* ===== 状态显示 ===== */
        .status {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 14px;
            color: var(--system-label-secondary);
            margin-top: var(--spacing-md);
        }
        
        input[type="file"] {
            display: none;
        }
        
        /* ===== 手势提示 ===== */
        .swipe-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--system-label-secondary);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s var(--ease-out);
            pointer-events: none;
        }
        
        .swipe-hint.show {
            opacity: 1;
        }
        
        /* ===== 沉浸模式 ===== */
        .immersive-mode {
            --system-bg: rgba(0, 0, 0, 0.95);
            background: var(--system-bg);
        }
        
        .immersive-mode .player-card {
            background: transparent;
            backdrop-filter: none;
            border: none;
            box-shadow: none;
        }
        
        .immersive-mode .controls-minimal {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .immersive-mode:hover .controls-minimal {
            opacity: 1;
        }
        
        /* ===== 响应式设计 ===== */
        /* 添加触摸友好的控制元素 */
@media (max-width: 768px) {
    .icon-button {
        min-width: 44px;
        min-height: 44px; /* 满足可访问性最小触摸目标 */
    }
    
    .player-card {
        margin: 10px;
        padding: 20px;
    }
    
    /* 防止滚动时触发浏览器UI */
    body {
        position: fixed;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
}

/* 添加加载动画 */
.loading-spinner {
    display: none;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: var(--primary);
    animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-sm);
            }
            
            .player-card {
                padding: var(--spacing-lg);
            }
            
            .title {
                font-size: 1.8rem;
            }
            
            .album-art-section {
                width: 200px;
                height: 200px;
            }
            
            .control-row {
                gap: var(--spacing-sm);
            }
            
            .icon-button {
                width: 40px;
                height: 40px;
            }
            
            .play-button {
                width: 50px;
                height: 50px;
            }
            
            .theme-selector {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .theme-button {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
        
        @media (max-width: 480px) {
            .player-card {
                padding: var(--spacing-md);
            }
            
            .title {
                font-size: 1.6rem;
            }
            
            .control-row {
                grid-template-columns: repeat(3, 1fr);
                gap: var(--spacing-xs);
            }
            
            .play-button {
                grid-column: 2;
            }
        }
    </style>
</head>
<body class="dynamic-theme">
    <!-- 沉浸模式脚本 -->
    <script>
        (() => {
            if (!new URLSearchParams(location.search).has('immersive')) return;
            const $ = s => document.querySelector(s);
            $('#visualizer').style.cssText = 'z-index:10';
            $('.visualizer-overlay').style.opacity = 0;
            $('.container').style.cssText += 'pointer-events:none;background:transparent;backdrop-filter:none;box-shadow:none';
            $('#player-card').style.cssText += 'background:transparent;border:none;box-shadow:none;pointer-events:auto';
            $('#swipe-hint').style.cssText += 'bottom:8vh;font-size:13px;letter-spacing:1px';
            document.body.classList.add('immersive-mode');
        })();
    </script>

    <!-- 隐形播放条脚本 -->
    <script>
        (() => {
            if (!new URLSearchParams(location.search).has('immersive')) return;
            const logo = document.querySelector('#logo-circle');
            const prog = document.querySelector('#progress');
            const cur = document.querySelector('#current-time');
            const bar = document.querySelector('.progress-section');
            bar.style.display = 'none';

            const breathRing = document.createElement('canvas');
            breathRing.width = breathRing.height = 180;
            Object.assign(breathRing.style, {
                position: 'absolute', width: '180px', height: '180px',
                top: '50%', left: '50%', transform: 'translate(-50%,-50%)',
                pointerEvents: 'none', zIndex: -1
            });
            logo.parentElement.appendChild(breathRing);
            const ctx = breathRing.getContext('2d');

            function drawRing(p) {
                ctx.clearRect(0, 0, 180, 180);
                const r = 80 + Math.sin(performance.now()/600)*6;
                ctx.beginPath();
                ctx.arc(90, 90, r, -Math.PI/2, -Math.PI/2 + Math.PI*2*p);
                ctx.strokeStyle = `rgba(255,255,255,${0.6+Math.sin(performance.now()/400)*0.2})`;
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            const mo = new MutationObserver(() => {
                const p = parseFloat(prog.style.width||0)/100;
                drawRing(p);
                logo.querySelector('.logo-icon').textContent = cur.textContent;
            });
            mo.observe(prog, { attributes: true, attributeFilter: ['style'] });
        })();
    </script>

    <canvas id="visualizer"></canvas>
    <div class="visualizer-overlay"></div>
    
    <div class="container" id="main-container">
        <div class="player-card" id="player-card">
            <div class="logo-section">
                <div class="album-art-section">
                    <div class="album-art">
                        <i class="material-icons">album</i>
                    </div>
                </div>
                <div class="brand">
                    <h1 class="title">Sonoria</h1>
                    <p class="slogan">动人心绚，乐音之境</p>
                </div>
            </div>
            
            <div class="player-info">
                <div class="track-title" id="track-title">等待音乐...</div>
                <div class="track-artist" id="track-artist">上传或选择音乐开始体验</div>
            </div>
            
            <div class="progress-section">
                <div class="progress-container">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>
            
            <div class="control-row">
                <button class="system-button icon-button" id="shuffle-button" title="随机播放">
                    <i class="material-icons">shuffle</i>
                </button>
                <button class="system-button icon-button" id="prev-button" title="上一首">
                    <i class="material-icons">skip_previous</i>
                </button>
                <button class="system-button play-button" id="play-toggle" title="播放">
                    <i class="material-icons">play_arrow</i>
                </button>
                <button class="system-button icon-button" id="next-button" title="下一首">
                    <i class="material-icons">skip_next</i>
                </button>
                <button class="system-button icon-button" id="mic-toggle" title="麦克风">
                    <i class="material-icons">mic_none</i>
                </button>
            </div>
            
            <div class="upload-area" id="upload-area">
                <i class="material-icons">library_music</i>
                <div class="upload-text">拖放音乐文件到此处或点击上传</div>
            </div>
            
            <div class="theme-selector">
                <button class="theme-button active" data-mode="aurora">极光</button>
                <button class="theme-button" data-mode="cosmic">宇宙</button>
                <button class="theme-button" data-mode="neural">神经</button>
                <button class="theme-button" data-mode="liquid">液态</button>
                <button class="theme-button" data-mode="quantum">量子</button>
            </div>
            
            <div class="playlist-section" id="playlist-section">
                <div class="playlist-header">
                    <div class="playlist-title">播放列表</div>
                    <div class="playlist-controls">
                        <button class="system-button icon-button" id="clear-button" title="清空列表">
                            <i class="material-icons">clear_all</i>
                        </button>
                        <button class="system-button icon-button" id="sort-button" title="随机排序">
                            <i class="material-icons">shuffle</i>
                        </button>
                    </div>
                </div>
                
                <div class="playlist-items" id="playlist-items">
                    <!-- 播放列表项将动态添加 -->
                </div>
            </div>
            
            <div class="status" id="status">
                准备就绪 - 拖放音乐文件或使用麦克风
            </div>
        </div>
    </div>

    <div class="swipe-hint" id="swipe-hint">左右滑动切换可视化主题</div>

    <input type="file" id="audio-upload" accept="audio/mp3,audio/m4a,audio/wav,audio/flac,audio/*,video/mp4" multiple>
    
    <script>
        // 性能优化的AudioVisualizer类
        class AudioVisualizer {
            constructor(canvas, audioContext) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d', { alpha: false });
                this.audioContext = audioContext;
                this.analyser = null;
                this.dataArray = null;
                this.bufferLength = 0;
                this.animationId = null;
                
                // 双缓冲优化
                this.offScreenCanvas = document.createElement('canvas');
                this.offScreenCtx = this.offScreenCanvas.getContext('2d');
                
                this.mode = 'aurora';
                this.isPlaying = false;
                
                // 音频分析维度
                this.energyLevel = 0;
                this.bassEnergy = 0;
                this.midEnergy = 0;
                this.trebleEnergy = 0;
                this.beatDetection = 0;
                
                // 性能监控
                this.frameCount = 0;
                this.lastFpsUpdate = 0;
                this.fps = 0;
                
                // 中心圆形参数
                this.centerCircle = {
                    radius: 80,
                    pulse: 0,
                    intensity: 0,
                    color: { primary: '10, 132, 255', secondary: '191, 90, 242' }
                };
                
                this.time = 0;
                
                this.setupCanvas();
                this.setupAnalyser();
            }
            

            setupCanvas() {
                const resizeCanvas = () => {
                    const dpr = Math.min(window.devicePixelRatio, 2);
                    
                    this.canvas.width = window.innerWidth * dpr;
                    this.canvas.height = window.innerHeight * dpr;
                    this.offScreenCanvas.width = window.innerWidth * dpr;
                    this.offScreenCanvas.height = window.innerHeight * dpr;
                    
                    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                    this.ctx.scale(dpr, dpr);
                    this.offScreenCtx.setTransform(1, 0, 0, 1, 0, 0);
                    this.offScreenCtx.scale(dpr, dpr);
                    
                    this.width = window.innerWidth;
                    this.height = window.innerHeight;
                    this.centerX = this.width / 2;
                    this.centerY = this.height / 2;
                };
                
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }

            setupAnalyser() {
                if (this.audioContext) {
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 1024;
                    this.analyser.smoothingTimeConstant = 0.8;
                    this.bufferLength = this.analyser.frequencyBinCount;
                    this.dataArray = new Uint8Array(this.bufferLength);
                }
            }

            connectAudio(audioElement) {
                if (this.audioContext && audioElement) {
                    const source = this.audioContext.createMediaElementSource(audioElement);
                    source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);
                }
            }

            setMode(mode) {
                this.mode = mode;
            }

            start() {
                this.isPlaying = true;
                this.animate();
            }

            stop() {
                this.isPlaying = false;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }

            animate() {
                if (!this.isPlaying) return;
                
                this.animationId = requestAnimationFrame(() => this.animate());
                
                this.time += 0.016;
                this.updateFPS();
                this.updateAudioAnalysis();
                
                // 使用离屏Canvas渲染
                this.clearCanvas(this.offScreenCtx);
                
                // 根据当前模式绘制可视化效果
                switch (this.mode) {
                    case 'cosmic':
                        this.drawCosmicVisualization(this.offScreenCtx);
                        break;
                    case 'neural':
                        this.drawNeuralNetwork(this.offScreenCtx);
                        break;
                    case 'liquid':
                        this.drawLiquidMorphing(this.offScreenCtx);
                        break;
                    case 'quantum':
                        this.drawQuantumField(this.offScreenCtx);
                        break;
                    case 'aurora':
                    default:
                        this.drawAuroraEffect(this.offScreenCtx);
                }
                
                // 在所有模式下都绘制中心圆形光晕
                this.drawCenterCircle(this.offScreenCtx);
                
                // 将离屏Canvas绘制到主Canvas
                this.ctx.drawImage(this.offScreenCanvas, 0, 0);
            }

            updateFPS() {
                this.frameCount++;
                const now = performance.now();
                if (now - this.lastFpsUpdate >= 1000) {
                    this.fps = this.frameCount;
                    this.frameCount = 0;
                    this.lastFpsUpdate = now;
                    
                    // 动态调整渲染质量
                    this.adjustQuality();
                }
            }
            
            adjustQuality() {
                // 根据帧率动态调整渲染质量
                if (this.fps < 30) {
                    this.analyser.fftSize = 512; // 降低分析精度
                } else {
                    this.analyser.fftSize = 1024;
                }
            }

            updateAudioAnalysis() {
                if (!this.analyser || !this.dataArray) return;
                
                this.analyser.getByteFrequencyData(this.dataArray);
                
                // 计算不同频段的能量
                const bassRange = Math.floor(this.bufferLength * 0.1);
                const midRange = Math.floor(this.bufferLength * 0.4);
                
                this.bassEnergy = this.getAverageEnergy(0, bassRange);
                this.midEnergy = this.getAverageEnergy(bassRange, midRange);
                this.trebleEnergy = this.getAverageEnergy(midRange, this.bufferLength);
                
                this.energyLevel = (this.bassEnergy + this.midEnergy + this.trebleEnergy) / 3;
                
                // 简单的节拍检测
                this.beatDetection = this.detectBeat();
                
                // 更新中心圆形参数
                this.updateCenterCircle();
                
                // 更新动态主题色彩
                this.updateDynamicTheme();
            }

            getAverageEnergy(start, end) {
                let sum = 0;
                for (let i = start; i < end; i++) {
                    sum += this.dataArray[i];
                }
                return sum / (end - start);
            }

            detectBeat() {
                // 简化的节拍检测算法
                const threshold = 150;
                const instantEnergy = this.energyLevel;
                
                // 简单的能量变化检测
                if (instantEnergy > threshold && instantEnergy > (this.lastEnergy || 0) * 1.2) {
                    this.lastEnergy = instantEnergy;
                    return 1;
                }
                
                this.lastEnergy = instantEnergy * 0.95 + (this.lastEnergy || 0) * 0.05;
                return 0;
            }

            updateCenterCircle() {
                // 中心圆形根据整体能量和节拍变化
                this.centerCircle.intensity = this.energyLevel / 255;
                this.centerCircle.pulse = this.beatDetection ? 1 : Math.max(0, this.centerCircle.pulse - 0.05);
                
                // 根据能量改变颜色
                if (this.energyLevel > 180) {
                    this.centerCircle.color = { primary: '255, 107, 107', secondary: '255, 159, 67' }; // 红色/橙色
                } else if (this.energyLevel > 120) {
                    this.centerCircle.color = { primary: '240, 147, 251', secondary: '179, 136, 235' }; // 紫色
                } else {
                    this.centerCircle.color = { primary: '10, 132, 255', secondary: '191, 90, 242' }; // 蓝色
                }
            }
            
            updateDynamicTheme() {
                // 根据音频能量动态调整主题色相
                const targetHue = 220 + (this.energyLevel * 0.5); // 根据能量动态调整色相
                document.documentElement.style.setProperty('--hue', targetHue);
            }

            drawCenterCircle(ctx) {
                ctx.save();
                
                // 计算动态半径 - 基础半径 + 能量影响 + 节拍脉冲
                const radius = this.centerCircle.radius + 
                              this.centerCircle.intensity * 60 + 
                              this.centerCircle.pulse * 40;
                
                // 计算透明度 - 基础透明度 + 能量影响
                const opacity = 0.7 + this.centerCircle.intensity * 0.3;
                
                // 创建径向渐变
                const gradient = ctx.createRadialGradient(
                    this.centerX, this.centerY, 0,
                    this.centerX, this.centerY, radius
                );
                
                gradient.addColorStop(0, `rgba(${this.centerCircle.color.primary}, ${opacity})`);
                gradient.addColorStop(0.7, `rgba(${this.centerCircle.color.secondary}, ${opacity * 0.7})`);
                gradient.addColorStop(1, `rgba(${this.centerCircle.color.secondary}, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.centerX, this.centerY, radius, 0, Math.PI * 2);
                ctx.fill();
                
                // 添加呼吸感光晕
                const breathRadius = radius + 20 + Math.sin(this.time * 2) * 10;
                const breathGradient = ctx.createRadialGradient(
                    this.centerX, this.centerY, radius,
                    this.centerX, this.centerY, breathRadius
                );
                
                breathGradient.addColorStop(0, `rgba(${this.centerCircle.color.secondary}, ${0.2})`);
                breathGradient.addColorStop(1, `rgba(${this.centerCircle.color.secondary}, 0)`);
                
                ctx.fillStyle = breathGradient;
                ctx.beginPath();
                ctx.arc(this.centerX, this.centerY, breathRadius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }

            drawAuroraEffect(ctx) {
                ctx.save();
                
                // 创建极光背景效果
                const gradient = ctx.createLinearGradient(0, 0, this.width, this.height);
                gradient.addColorStop(0, `rgba(10, 132, 255, ${0.1 + this.energyLevel/500})`);
                gradient.addColorStop(0.5, `rgba(191, 90, 242, ${0.05 + this.energyLevel/600})`);
                gradient.addColorStop(1, `rgba(48, 209, 88, ${0.02 + this.energyLevel/700})`);
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, this.width, this.height);
                
                // 添加流动线条
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 + this.energyLevel/300})`;
                ctx.lineWidth = 1;
                
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    const y = this.height * 0.3 + i * 80 + Math.sin(this.time * 0.5 + i) * 20;
                    
                    for (let x = 0; x <= this.width; x += 10) {
                        const wave = Math.sin(x * 0.01 + this.time * 0.8 + i) * 30 * (this.energyLevel/255);
                        if (x === 0) {
                            ctx.moveTo(x, y + wave);
                        } else {
                            ctx.lineTo(x, y + wave);
                        }
                    }
                    
                    ctx.stroke();
                }
                
                ctx.restore();
            }

            drawCosmicVisualization(ctx) {
                ctx.save();
                
                // 宇宙背景
                const gradient = ctx.createRadialGradient(
                    this.centerX, this.centerY, 0,
                    this.centerX, this.centerY, Math.max(this.width, this.height)
                );
                
                gradient.addColorStop(0, `rgba(10, 10, 30, 0.9)`);
                gradient.addColorStop(0.5, `rgba(20, 10, 40, 0.7)`);
                gradient.addColorStop(1, `rgba(5, 5, 15, 0.9)`);
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, this.width, this.height);
                
                // 绘制星星
                for (let i = 0; i < 100; i++) {
                    const x = (i * 123.45) % this.width;
                    const y = (i * 67.89) % this.height;
                    const size = (Math.sin(this.time * 0.5 + i) * 0.5 + 0.5) * 2;
                    const brightness = 0.5 + Math.sin(this.time * 0.8 + i) * 0.5;
                    
                    ctx.fillStyle = `rgba(255, 255, 255, ${brightness * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            }

            drawNeuralNetwork(ctx) {
                ctx.save();
                
                // 神经网络背景
                ctx.fillStyle = 'rgba(15, 15, 25, 0.8)';
                ctx.fillRect(0, 0, this.width, this.height);
                
                // 绘制节点和连接
                const nodes = [];
                const nodeCount = 15;
                
                for (let i = 0; i < nodeCount; i++) {
                    const angle = (i / nodeCount) * Math.PI * 2;
                    const distance = 150 + Math.sin(this.time * 0.5 + i) * 50;
                    const x = this.centerX + Math.cos(angle) * distance;
                    const y = this.centerY + Math.sin(angle) * distance;
                    
                    nodes.push({ x, y, energy: this.dataArray[i % this.bufferLength] / 255 });
                    
                    // 绘制连接线
                    for (let j = 0; j < i; j++) {
                        const distance = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
                        if (distance < 200) {
                            const opacity = (1 - distance / 200) * 0.3 * this.energyLevel/255;
                            ctx.strokeStyle = `rgba(10, 132, 255, ${opacity})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(nodes[i].x, nodes[i].y);
                            ctx.lineTo(nodes[j].x, nodes[j].y);
                            ctx.stroke();
                        }
                    }
                }
                
                // 绘制节点
                nodes.forEach(node => {
                    const size = 5 + node.energy * 15;
                    const gradient = ctx.createRadialGradient(
                        node.x, node.y, 0,
                        node.x, node.y, size
                    );
                    
                    gradient.addColorStop(0, `rgba(191, 90, 242, ${0.8 + node.energy * 0.2})`);
                    gradient.addColorStop(1, `rgba(191, 90, 242, 0)`);
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, size, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                ctx.restore();
            }

            drawLiquidMorphing(ctx) {
                ctx.save();
                
                // 液体背景
                const gradient = ctx.createLinearGradient(0, 0, this.width, this.height);
                gradient.addColorStop(0, `rgba(45, 183, 245, ${0.1})`);
                gradient.addColorStop(0.5, `rgba(84, 160, 255, ${0.05})`);
                gradient.addColorStop(1, `rgba(162, 155, 254, ${0.1})`);
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, this.width, this.height);
                
                // 绘制液体波浪
                const waveCount = 3;
                
                for (let w = 0; w < waveCount; w++) {
                    ctx.strokeStyle = `rgba(84, 160, 255, ${0.3 + w * 0.1})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    
                    for (let x = 0; x <= this.width; x += 5) {
                        const audioIndex = Math.floor((x / this.width) * this.bufferLength);
                        const audioValue = this.dataArray[audioIndex] / 255;
                        const baseWave = Math.sin((x / this.width) * Math.PI * 4 + this.time * 0.5 + w) * 30;
                        const audioWave = audioValue * 50;
                        const y = this.centerY + baseWave + audioWave - w * 30;
                        
                        if (x === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    }
                    
                    ctx.stroke();
                }
                
                ctx.restore();
            }

            drawQuantumField(ctx) {
                ctx.save();
                
                // 量子场背景
                ctx.fillStyle = 'rgba(5, 5, 15, 0.9)';
                ctx.fillRect(0, 0, this.width, this.height);
                
                // 绘制量子粒子
                const gridSize = 40;
                const cols = Math.ceil(this.width / gridSize);
                const rows = Math.ceil(this.height / gridSize);
                
                for (let i = 0; i < cols; i++) {
                    for (let j = 0; j < rows; j++) {
                        const x = i * gridSize + (Math.sin(this.time + j) * 5);
                        const y = j * gridSize + (Math.cos(this.time + i) * 5);
                        const index = (i + j * cols) % this.bufferLength;
                        const energy = this.dataArray[index] / 255;
                        
                        if (energy > 0.2) {
                            const size = energy * 15;
                            const opacity = energy * 0.8;
                            
                            ctx.fillStyle = `rgba(48, 209, 88, ${opacity})`;
                            ctx.beginPath();
                            ctx.arc(x, y, size, 0, Math.PI * 2);
                            ctx.fill();
                            
                            // 添加连接线
                            if (i > 0 && j > 0) {
                                const prevEnergy = this.dataArray[((i-1) + (j-1) * cols) % this.bufferLength] / 255;
                                if (prevEnergy > 0.2) {
                                    ctx.strokeStyle = `rgba(48, 209, 88, ${opacity * 0.5})`;
                                    ctx.lineWidth = 1;
                                    ctx.beginPath();
                                    ctx.moveTo(x, y);
                                    ctx.lineTo((i-1) * gridSize, (j-1) * gridSize);
                                    ctx.stroke();
                                }
                            }
                        }
                    }
                }
                
                ctx.restore();
            }

            clearCanvas(ctx) {
                ctx.fillStyle = 'rgba(10, 10, 20, 0.1)';
                ctx.fillRect(0, 0, this.width, this.height);
            }
            
            cleanup() {
                this.stop();
                this.dataArray = null;
                this.analyser = null;
                
                // 清理Canvas
                this.ctx.clearRect(0, 0, this.width, this.height);
                this.offScreenCtx.clearRect(0, 0, this.width, this.height);
            }
        }

        // 应用主逻辑
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const canvas = document.getElementById('visualizer');
            const audioUpload = document.getElementById('audio-upload');
            const uploadArea = document.getElementById('upload-area');
            const status = document.getElementById('status');
            const micToggle = document.getElementById('mic-toggle');
            const playToggle = document.getElementById('play-toggle');
            const prevButton = document.getElementById('prev-button');
            const nextButton = document.getElementById('next-button');
            const shuffleButton = document.getElementById('shuffle-button');
            const clearButton = document.getElementById('clear-button');
            const sortButton = document.getElementById('sort-button');
            const themeButtons = document.querySelectorAll('.theme-button');
            const playerCard = document.getElementById('player-card');
            const mainContainer = document.getElementById('main-container');
            const progressBar = document.getElementById('progress');
            const currentTimeEl = document.getElementById('current-time');
            const totalTimeEl = document.getElementById('total-time');
            const trackTitle = document.getElementById('track-title');
            const trackArtist = document.getElementById('track-artist');
            const playlistItems = document.getElementById('playlist-items');
            const swipeHint = document.getElementById('swipe-hint');
            
            // 音频变量
            let audioContext;
            let audioElement;
            let visualizer;
            let isPlaying = false;
            let isMicActive = false;
            let currentTrackIndex = 0;
            let isShuffled = false;
            let inactivityTimer;
            
            // 播放列表
            let playlist = [];
            
            // 状态管理
            const AppState = {
                INITIAL: 'initial',
                LOADING: 'loading',
                READY: 'ready',
                PLAYING: 'playing',
                ERROR: 'error',
                current: 'initial'
            };
            
            // 初始化音频上下文和可视化器
            function initAudioContext() {
                try {
                    // 检查浏览器支持
                    if (!(window.AudioContext || window.webkitAudioContext)) {
                        throw new Error('NotSupportedError');
                    }
                    
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    visualizer = new AudioVisualizer(canvas, audioContext);
                    visualizer.start();
                    setState(AppState.READY, "音频系统已初始化");
                    return true;
                } catch (error) {
                    console.error("音频上下文初始化失败:", error);
                    setState(AppState.ERROR, "浏览器不支持Web Audio API");
                    return false;
                }
            }
            
            // 状态管理
            function setState(newState, message = '') {
                AppState.current = newState;
                updateStatus(message);
                
                // 根据状态更新UI
                switch(newState) {
                    case AppState.LOADING:
                        playToggle.disabled = true;
                        break;
                    case AppState.READY:
                        playToggle.disabled = false;
                        break;
                    case AppState.ERROR:
                        playToggle.disabled = true;
                        status.style.color = '#ff6b6b';
                        break;
                }
            }
            
            // 更新状态显示
            function updateStatus(message) {
                status.textContent = message;
            }
            
            // 处理上传的音乐文件
            function handleFileUpload(files) {
                if (!files || files.length === 0) return;
                
                // 如果音频上下文未初始化，先初始化
                if (!audioContext && !initAudioContext()) {
                    return;
                }
                
                setState(AppState.LOADING, `正在加载 ${files.length} 个文件...`);
                
                // 将文件添加到播放列表
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    
                    if (!file.type.startsWith('audio/') && !file.type.startsWith('video/')) {
                        continue;
                    }
                    
                    const track = {
                        id: Date.now() + i,
                        file: file,
                        name: file.name.replace(/\.[^/.]+$/, ""), // 移除扩展名
                        url: URL.createObjectURL(file),
                        duration: 0
                    };
                    
                    playlist.push(track);
                    
                    // 预加载音频元数据
                    const audio = new Audio();
                    audio.src = track.url;
                    audio.addEventListener('loadedmetadata', function() {
                        track.duration = audio.duration;
                        renderPlaylist();
                    });
                }
                
                // 如果播放列表之前为空，自动播放第一首
                if (playlist.length === files.length) {
                    currentTrackIndex = 0;
                    loadTrack(currentTrackIndex);
                }
                
                renderPlaylist();
                setState(AppState.READY, `已添加 ${files.length} 个文件到播放列表`);
            }
            
            // 加载指定索引的曲目
            function loadTrack(index) {
                if (playlist.length === 0 || index < 0 || index >= playlist.length) return;
                
                currentTrackIndex = index;
                const track = playlist[currentTrackIndex];
                
                // 创建音频元素
                if (audioElement) {
                    audioElement.pause();
                }
                
                audioElement = new Audio();
                audioElement.src = track.url;
                audioElement.crossOrigin = "anonymous";
                
                // 连接可视化器
                visualizer.connectAudio(audioElement);
                
                // 更新UI
                trackTitle.textContent = track.name;
                trackArtist.textContent = "未知艺术家";
                totalTimeEl.textContent = formatTime(track.duration || 0);
                
                // 设置音频事件
                audioElement.addEventListener('loadedmetadata', function() {
                    totalTimeEl.textContent = formatTime(audioElement.duration);
                });
                
                audioElement.addEventListener('timeupdate', updateProgress);
                audioElement.addEventListener('ended', playNext);
                
                // 启用播放按钮
                playToggle.disabled = false;
                setState(AppState.READY, `已加载: ${track.name}`);
                
                // 更新播放列表高亮
                renderPlaylist();
                
                // 重置不活动计时器
                resetInactivityTimer();
            }
            
            // 播放音乐
            function playMusic() {
                if (!audioElement || !audioContext) return;
                
                // 如果音频上下文是暂停状态，恢复它
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                audioElement.play();
                isPlaying = true;
                playToggle.innerHTML = '<i class="material-icons">pause</i>';
                playToggle.classList.add('playing');
                setState(AppState.PLAYING, '正在播放音乐');
                
                // 重置不活动计时器
                resetInactivityTimer();
            }
            
            // 暂停音乐
            function pauseMusic() {
                if (audioElement && isPlaying) {
                    audioElement.pause();
                    isPlaying = false;
                    playToggle.innerHTML = '<i class="material-icons">play_arrow</i>';
                    playToggle.classList.remove('playing');
                    setState(AppState.READY, '音乐已暂停');
                }
            }
            
            // 播放下一首
            function playNext() {
                if (playlist.length === 0) return;
                
                let nextIndex;
                if (isShuffled) {
                    nextIndex = Math.floor(Math.random() * playlist.length);
                } else {
                    nextIndex = (currentTrackIndex + 1) % playlist.length;
                }
                
                loadTrack(nextIndex);
                if (isPlaying) {
                    playMusic();
                }
            }
            
            // 播放上一首
            function playPrev() {
                if (playlist.length === 0) return;
                
                let prevIndex;
                if (isShuffled) {
                    prevIndex = Math.floor(Math.random() * playlist.length);
                } else {
                    prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
                }
                
                loadTrack(prevIndex);
                if (isPlaying) {
                    playMusic();
                }
            }
            
            // 更新播放进度
            function updateProgress() {
                if (!audioElement) return;
                
                const progress = (audioElement.currentTime / audioElement.duration) * 100;
                progressBar.style.width = `${progress}%`;
                currentTimeEl.textContent = formatTime(audioElement.currentTime);
            }
            
            // 格式化时间显示
            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
            
            // 渲染播放列表
            function renderPlaylist() {
                playlistItems.innerHTML = '';
                
                playlist.forEach((track, index) => {
                    const item = document.createElement('div');
                    item.className = `playlist-item ${index === currentTrackIndex ? 'active' : ''}`;
                    item.dataset.index = index;
                    
                    item.innerHTML = `
                        <div class="playlist-item-icon">
                            <i class="material-icons">music_note</i>
                        </div>
                        <div class="playlist-item-info">
                            <div class="playlist-item-title">${track.name}</div>
                            <div class="playlist-item-artist">未知艺术家</div>
                        </div>
                        <div class="playlist-item-duration">${formatTime(track.duration || 0)}</div>
                    `;
                    
                    item.addEventListener('click', () => {
                        loadTrack(index);
                        if (isPlaying) {
                            playMusic();
                        }
                    });
                    
                    playlistItems.appendChild(item);
                });
            }
            
            // 切换随机播放
            function toggleShuffle() {
                isShuffled = !isShuffled;
                shuffleButton.classList.toggle('active', isShuffled);
                updateStatus(isShuffled ? '随机播放已开启' : '随机播放已关闭');
            }
            
            // 清空播放列表
            function clearPlaylist() {
                if (playlist.length === 0) return;
                
                if (audioElement) {
                    audioElement.pause();
                    isPlaying = false;
                    playToggle.innerHTML = '<i class="material-icons">play_arrow</i>';
                    playToggle.classList.remove('playing');
                }
                
                // 释放URL对象
                playlist.forEach(track => {
                    if (track.url && track.url.startsWith('blob:')) {
                        URL.revokeObjectURL(track.url);
                    }
                });
                
                playlist = [];
                currentTrackIndex = 0;
                trackTitle.textContent = '等待音乐...';
                trackArtist.textContent = '上传或选择音乐开始体验';
                progressBar.style.width = '0%';
                currentTimeEl.textContent = '0:00';
                totalTimeEl.textContent = '0:00';
                renderPlaylist();
                setState(AppState.READY, '播放列表已清空');
            }
            
            // 随机排序播放列表
            function shufflePlaylist() {
                if (playlist.length === 0) return;
                
                for (let i = playlist.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
                }
                
                // 如果正在播放，更新当前索引
                if (audioElement && isPlaying) {
                    const currentTrack = playlist.find(track => track.id === playlist[currentTrackIndex].id);
                    currentTrackIndex = playlist.indexOf(currentTrack);
                }
                
                renderPlaylist();
                updateStatus('播放列表已随机排序');
            }
            
            // 切换麦克风
            function toggleMicrophone() {
                if (isMicActive) {
                    // 关闭麦克风
                    if (audioElement) {
                        audioElement.pause();
                        isPlaying = false;
                        playToggle.innerHTML = '<i class="material-icons">play_arrow</i>';
                        playToggle.classList.remove('playing');
                    }
                    isMicActive = false;
                    micToggle.classList.remove('active');
                    setState(AppState.READY, '麦克风已关闭');
                } else {
                    // 开启麦克风
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        setState(AppState.ERROR, '您的浏览器不支持麦克风输入');
                        return;
                    }
                    
                    if (!audioContext && !initAudioContext()) {
                        return;
                    }
                    
                    setState(AppState.LOADING, '请求麦克风权限...');
                    
                    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                        .then(function(stream) {
                            // 创建媒体流源
                            const source = audioContext.createMediaStreamSource(stream);
                            source.connect(visualizer.analyser);
                            
                            isMicActive = true;
                            micToggle.classList.add('active');
                            setState(AppState.PLAYING, '正在通过麦克风捕捉环境音乐...');
                            trackTitle.textContent = '麦克风输入';
                            trackArtist.textContent = '环境声音';
                            
                            // 如果正在播放音乐，暂停它
                            if (isPlaying) {
                                pauseMusic();
                            }
                        })
                        .catch(function(err) {
                            setState(AppState.ERROR, '无法访问麦克风: ' + err.message);
                        });
                }
                
                // 重置不活动计时器
                resetInactivityTimer();
            }
            
            // 切换可视化主题
            function setVisualizationMode(mode) {
                if (visualizer) {
                    visualizer.setMode(mode);
                    
                    // 更新按钮状态
                    themeButtons.forEach(button => {
                        button.classList.toggle('active', button.dataset.mode === mode);
                    });
                    
                    updateStatus(`已切换到${getModeName(mode)}主题`);
                }
                
                // 重置不活动计时器
                resetInactivityTimer();
            }
            
            // 获取模式名称
            function getModeName(mode) {
                const modeNames = {
                    'aurora': '极光韵律',
                    'cosmic': '宇宙脉动',
                    'neural': '神经脉络',
                    'liquid': '液态流动',
                    'quantum': '量子场域'
                };
                return modeNames[mode] || mode;
            }
            
            // 重置不活动计时器
            function resetInactivityTimer() {
                clearTimeout(inactivityTimer);
                
                // 显示完整播放器
                playerCard.classList.remove('minimized');
                mainContainer.style.opacity = '1';
                
                // 15秒后最小化播放器
                inactivityTimer = setTimeout(() => {
                    if (isPlaying) {
                        playerCard.classList.add('minimized');
                        mainContainer.style.opacity = '0.7';
                    }
                }, 15000);
            }
            
            // 显示滑动提示
            function showSwipeHint() {
                swipeHint.classList.add('show');
                setTimeout(() => {
                    swipeHint.classList.remove('show');
                }, 3000);
            }
            
            // 键盘快捷键支持
            function initKeyboardControls() {
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT') return;
                    
                    switch(e.code) {
                        case 'Space':
                            e.preventDefault();
                            playToggle.click();
                            break;
                        case 'ArrowRight':
                            nextButton.click();
                            break;
                        case 'ArrowLeft':
                            prevButton.click();
                            break;
                        case 'KeyM':
                            micToggle.click();
                            break;
                        case 'Escape':
                            // 退出沉浸模式
                            if (document.body.classList.contains('immersive-mode')) {
                                window.history.back();
                            }
                            break;
                    }
                });
            }
            
            // 事件监听
            uploadArea.addEventListener('click', function() {
                audioUpload.click();
            });
            
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.style.borderColor = 'rgba(10, 132, 255, 0.7)';
                uploadArea.style.background = 'rgba(10, 132, 255, 0.1)';
            });
            
            uploadArea.addEventListener('dragleave', function() {
                uploadArea.style.borderColor = 'var(--system-border)';
                uploadArea.style.background = 'transparent';
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--system-border)';
                uploadArea.style.background = 'transparent';
                
                if (e.dataTransfer.files.length) {
                    handleFileUpload(e.dataTransfer.files);
                }
            });
            
            audioUpload.addEventListener('change', function(e) {
                if (e.target.files.length) {
                    handleFileUpload(e.target.files);
                }
            });
            
            playToggle.addEventListener('click', function() {
                if (isPlaying) {
                    pauseMusic();
                } else {
                    playMusic();
                }
            });
            
            prevButton.addEventListener('click', playPrev);
            nextButton.addEventListener('click', playNext);
            shuffleButton.addEventListener('click', toggleShuffle);
            clearButton.addEventListener('click', clearPlaylist);
            sortButton.addEventListener('click', shufflePlaylist);
            micToggle.addEventListener('click', toggleMicrophone);
            
            // 模式切换按钮事件
            themeButtons.forEach(button => {
                button.addEventListener('click', function() {
                    setVisualizationMode(this.dataset.mode);
                });
            });
            
            // 触摸滑动事件
            let touchStartX = 0;
            let touchEndX = 0;
            
            document.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            });
            
            document.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });
            
            function handleSwipe() {
                const swipeThreshold = 50;
                const diff = touchEndX - touchStartX;
                
                if (Math.abs(diff) > swipeThreshold) {
                    if (diff > 0) {
                        // 右滑 - 上一个主题
                        const currentMode = document.querySelector('.theme-button.active').dataset.mode;
                        const modes = ['aurora', 'cosmic', 'neural', 'liquid', 'quantum'];
                        const currentIndex = modes.indexOf(currentMode);
                        const prevIndex = (currentIndex - 1 + modes.length) % modes.length;
                        setVisualizationMode(modes[prevIndex]);
                    } else {
                        // 左滑 - 下一个主题
                        const currentMode = document.querySelector('.theme-button.active').dataset.mode;
                        const modes = ['aurora', 'cosmic', 'neural', 'liquid', 'quantum'];
                        const currentIndex = modes.indexOf(currentMode);
                        const nextIndex = (currentIndex + 1) % modes.length;
                        setVisualizationMode(modes[nextIndex]);
                    }
                    
                    showSwipeHint();
                }
            }
            
            // 鼠标移动事件 - 重置不活动计时器
            document.addEventListener('mousemove', resetInactivityTimer);
            document.addEventListener('touchstart', resetInactivityTimer);
            
            // 初始化音频系统
            if (!initAudioContext()) {
                setState(AppState.ERROR, "您的浏览器不支持音频分析功能");
            } else {
                setState(AppState.READY, "准备就绪 - 拖放音乐文件或使用麦克风");
            }
            
            // 初始化键盘控制
            initKeyboardControls();
            
            // 显示滑动提示
            setTimeout(showSwipeHint, 2000);
            
            // 性能监控（开发时）
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                setInterval(() => {
                    if (visualizer) {
                        console.log(`FPS: ${visualizer.fps}`);
                    }
                }, 5000);
            }
        });
    </script>
</body>
</html>
