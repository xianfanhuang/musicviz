<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonoria - 动人心绚，乐音之境</title>
    <style>
        /* 基础字体样式 */
        @font-face {
            font-family: 'Material Icons';
            font-style: normal;
            font-weight: 400;
            src: url(https://fonts.gstatic.com/s/materialicons/v142/flUhRq6tzZclQEJ-Vdg-IuiaDsNc.woff2) format('woff2');
        }
        
        .material-icons {
            font-family: 'Material Icons';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #f093fb;
            --tertiary: #4facfe;
            --bg-dark: #0a0a14;
            --bg-light: #f5f5f5;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-light: rgba(0, 0, 0, 0.05);
            --text-primary: rgba(255, 255, 255, 0.9);
            --text-secondary: rgba(255, 255, 255, 0.9);
            --text-primary-light: rgba(0, 0, 0, 0.9);
            --text-secondary-light: rgba(0, 0, 0, 0.7);
            --border-light: rgba(255, 255, 255, 0.1);
            --border-light-light: rgba(0, 0, 0, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            touch-action: none;
        }

        body.light {
            background: var(--bg-light);
            color: var(--text-primary-light);
            --bg-card: var(--bg-card-light);
            --text-primary: var(--text-primary-light);
            --text-secondary: var(--text-secondary-light);
            --border-light: var(--border-light-light);
        }

        #visualizer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 10, 20, 0.4) 0%, rgba(10, 10, 20, 0.2) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        .player-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 500px;
            transition: all 0.5s ease;
            position: relative;
        }

        .player-card.minimized {
            padding: 15px;
            border-radius: 50px;
            width: auto;
            max-width: 300px;
        }

        .minimized .player-info,
        .minimized .progress-section,
        .minimized .upload-area,
        .minimized .theme-selector,
        .minimized .playlist-section,
        .minimized .secondary-controls {
            display: none;
        }

        .minimized .control-row {
            justify-content: center;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
            position: relative;
            overflow: hidden;
        }

        .logo-circle::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
        }

        .logo-icon {
            font-size: 2rem;
            color: white;
            z-index: 1;
        }

        .brand {
            text-align: center;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--tertiary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
            letter-spacing: -0.5px;
        }

        .slogan {
            font-size: 0.9rem;
            font-weight: 300;
            margin-top: 4px;
        }

        .player-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .track-title {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .progress-section {
            margin: 25px 0;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .icon-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-light);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .light .icon-button {
            color: rgba(0, 0, 0, 0.8);
        }

        .icon-button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .icon-button:active {
            transform: translateY(1px);
        }

        .icon-button.active {
            background: rgba(102, 126, 234, 0.2);
            color: #8a7cff;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .icon-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .icon-button.ripple::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 10%, transparent 10.01%);
            transform: scale(0);
            animation: ripple 0.4s ease-out;
        }

        @keyframes ripple {
            to { transform: scale(2); opacity: 0; }
        }

        .play-button {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .bottom-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .upload-area {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100px;
            border: 2px dashed var(--border-light);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }

        .upload-area:hover {
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(102, 126, 234, 0.05);
        }

        .upload-area i {
            font-size: 28px;
            color: var(--text-secondary);
        }

        .upload-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .theme-selector {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .theme-button {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .theme-button.active {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.5);
            color: var(--text-primary);
        }

        .theme-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-section {
            margin-top: 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .light .playlist-section {
            background: rgba(0, 0, 0, 0.05);
        }

        .playlist-section.expanded {
            max-height: 300px;
            overflow-y: auto;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .playlist-title {
            font-size: 1rem;
            font-weight: 500;
        }

        .playlist-controls {
            display: flex;
            gap: 10px;
        }

        .playlist-items {
            max-height: 250px;
            overflow-y: auto;
            padding: 0 10px 10px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .light .playlist-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .playlist-item.active {
            background: rgba(102, 126, 234, 0.2);
        }

        .playlist-item[draggable="true"]:hover::after {
            content: '拖动排序';
            position: absolute;
            right: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .playlist-item-icon {
            margin-right: 12px;
            color: var(--text-secondary);
        }

        .playlist-item-info {
            flex: 1;
            overflow: hidden;
        }

        .playlist-item-title {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-artist {
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-duration {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-left: 10px;
        }

        .playlist-item-delete {
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            margin-left: 10px;
        }

        .status {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 20px;
        }

        .light .status {
            background: rgba(0, 0, 0, 0.05);
        }

        input[type="file"] {
            display: none;
        }

        .swipe-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .swipe-hint.show {
            opacity: 1;
        }

        .tooltip {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        .icon-button:hover .tooltip,
        .icon-button.touched .tooltip {
            opacity: 1;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            max-width: 400px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .modal-content h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .modal-content p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .modal-content button {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 20px;
            color: white;
            cursor: pointer;
        }

        .mic-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .mic-controls input[type="range"] {
            width: 100px;
        }

        @media (max-width: 1024px) {
            .container {
                padding: 15px;
            }
            .player-card {
                max-width: 400px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            .player-card {
                padding: 20px;
            }
            .title {
                font-size: 1.8rem;
            }
            .control-row {
                gap: 8px;
            }
            .icon-button {
                width: 44px;
                height: 44px;
            }
            .play-button {
                width: 52px;
                height: 52px;
            }
        }

        @media (max-width: 480px) {
            .player-card {
                padding: 15px;
            }
            .title {
                font-size: 1.6rem;
            }
            .control-row {
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <canvas id="visualizer"></canvas>
    <div class="overlay"></div>

    <div class="container" id="main-container">
        <div class="player-card" id="player-card">
            <div class="logo-section">
                <div class="logo-circle" id="logo-circle">
                    <i class="material-icons logo-icon">music_note</i>
                </div>
                <div class="brand">
                    <h1 class="title">Sonoria</h1>
                    <p class="slogan">沉浸式音乐之旅</p>
                </div>
            </div>

            <div class="player-info" id="player-info">
                <div class="track-title" id="track-title">请上传音乐文件</div>
                <div class="track-artist" id="track-artist">或使用麦克风输入</div>
            </div>

            <div class="progress-section">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="control-row">
                <button class="icon-button" id="prev-button" aria-label="上一首">
                    <i class="material-icons">skip_previous</i>
                    <span class="tooltip">上一首</span>
                </button>
                <button class="icon-button play-button" id="play-toggle" aria-label="播放/暂停">
                    <i class="material-icons">play_arrow</i>
                    <span class="tooltip">播放</span>
                </button>
                <button class="icon-button" id="next-button" aria-label="下一首">
                    <i class="material-icons">skip_next</i>
                    <span class="tooltip">下一首</span>
                </button>
                <button class="icon-button" id="theme-toggle" aria-label="切换主题">
                    <i class="material-icons">brightness_6</i>
                    <span class="tooltip">切换主题</span>
                </button>
            </div>

            <div class="bottom-nav">
                <button class="icon-button" id="playlist-toggle" aria-label="播放列表">
                    <i class="material-icons">queue_music</i>
                    <span class="tooltip">播放列表</span>
                </button>
                <button class="icon-button" id="upload-button" aria-label="上传音乐">
                    <i class="material-icons">library_music</i>
                    <span class="tooltip">上传音乐</span>
                </button>
                <button class="icon-button" id="mic-toggle" aria-label="麦克风">
                    <i class="material-icons">mic_none</i>
                    <span class="tooltip">麦克风</span>
                </button>
                <button class="icon-button" id="shuffle-button" aria-label="随机播放">
                    <i class="material-icons">shuffle</i>
                    <span class="tooltip">随机播放</span>
                </button>
                <button class="icon-button" id="loop-button" aria-label="循环播放">
                    <i class="material-icons">loop</i>
                    <span class="tooltip">循环播放</span>
                </button>
            </div>

            <div class="mic-controls" id="mic-controls" style="display: none;">
                <label for="mic-volume">麦克风音量:</label>
                <input type="range" id="mic-volume" min="0" max="2" step="0.1" value="1">
            </div>

            <div class="upload-area" id="upload-area">
                <i class="material-icons">library_music</i>
                <div class="upload-text">拖放音乐文件到此处或点击上传</div>
            </div>

            <div class="theme-selector">
                <button class="theme-button active" data-mode="aurora">极光</button>
                <button class="theme-button" data-mode="cosmic">宇宙</button>
                <button class="theme-button" data-mode="neural">神经</button>
                <button class="theme-button" data-mode="liquid">液态</button>
                <button class="theme-button" data-mode="quantum">量子</button>
            </div>

            <div class="playlist-section" id="playlist-section">
                <div class="playlist-header">
                    <div class="playlist-title">播放列表</div>
                    <div class="playlist-controls">
                        <button class="icon-button" id="clear-playlist" aria-label="清空列表">
                            <i class="material-icons">clear_all</i>
                        </button>
                        <button class="icon-button" id="close-playlist" aria-label="关闭列表">
                            <i class="material-icons">close</i>
                        </button>
                    </div>
                </div>
                <div class="playlist-items" id="playlist-items"></div>
            </div>

            <div class="status" id="status"></div>
        </div>
    </div>

    <div class="modal" id="onboarding-modal">
        <div class="modal-content">
            <h2>欢迎体验 Sonoria</h2>
            <p>上传音乐文件或使用麦克风，享受沉浸式可视化体验！滑动屏幕切换主题，点击播放列表管理歌曲。</p>
            <button id="close-modal">开始</button>
        </div>
    </div>

    <div class="swipe-hint" id="swipe-hint">左右滑动切换可视化主题</div>

    <input type="file" id="audio-upload" accept="audio/mp3,audio/m4a,audio/wav,audio/flac,audio/*,video/mp4" multiple>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.7/jsmediatags.min.js"></script>
    <script>
        class AudioVisualizer {
            constructor(canvas, audioContext) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.audioContext = audioContext;
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 2048;
                this.analyser.smoothingTimeConstant = 0.85;
                this.dataArray = new Float32Array(this.analyser.frequencyBinCount);
                this.timeDomainArray = new Float32Array(this.analyser.frequencyBinCount);
                this.bufferLength = this.analyser.frequencyBinCount;
                this.animationId = null;

                this.mode = 'aurora';
                this.isPlaying = false;
                this.hue = 0;
                this.beatHistory = [];
                this.lastBeatTime = 0;
                this.bpm = 120;
                this.beatIntervals = [];
                this.HISTORY_SIZE = 43;
                this.BEAT_THRESHOLD = 1.2;
                this.BPM_HISTORY = 10;
                this.particles = [];
                this.waves = [];

                this.sampleRate = audioContext.sampleRate;
                this.energyHistory = new Array(64).fill(0);
                this.frameCounter = 0;
                this.onsetValue = 0;
                this.lastOnsetTime = 0;
                this.pitch = -1;
                this.rhythmComplexity = 0;

                this.resizeCanvas();
                window.addEventListener('resize', this.resizeCanvas.bind(this));
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            connectAudio(source) {
                try {
                    const audioSource = typeof source === 'string' ? new Audio(source) : source;
                    const mediaSource = this.audioContext.createMediaElementSource(audioSource);
                    mediaSource.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);
                } catch (error) {
                    console.error('音频连接错误:', error);
                }
            }

            connectStream(stream) {
                try {
                    const streamSource = this.audioContext.createMediaStreamSource(stream);
                    streamSource.connect(this.analyser);
                } catch (error) {
                    console.error('流连接错误:', error);
                }
            }

            setMode(mode) {
                this.mode = mode;
                this.initParticles();
                this.initWaves();
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < 100; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.5,
                        size: Math.random() * 2 + 1,
                        opacity: Math.random() * 0.4 + 0.3,
                        baseSize: Math.random() * 2 + 1
                    });
                }
            }

            initWaves() {
                this.waves = [];
                for (let i = 0; i < 4; i++) {
                    this.waves.push({
                        amplitude: 0,
                        frequency: 0.015 + i * 0.01,
                        phase: 0,
                        y: this.canvas.height / 2 + (i - 1.5) * 40
                    });
                }
            }

            getFinerBands() {
                const bands = {
                    subBass: this.avgBand(0, 2),
                    bass: this.avgBand(3, 5),
                    lowMid: this.avgBand(6, 11),
                    mid: this.avgBand(12, 23),
                    highMid: this.avgBand(24, 46),
                    presence: this.avgBand(47, 69),
                    brilliance: this.avgBand(70, this.bufferLength - 1)
                };
                Object.keys(bands).forEach(key => {
                    bands[key] = Math.max(0, (bands[key] + 100) / 100);
                });
                return bands;
            }

            avgBand(start, end) {
                let sum = 0;
                for (let i = start; i <= end; i++) sum += this.dataArray[i];
                return sum / (end - start + 1);
            }

            detectOnset(energy) {
                this.energyHistory.shift();
                this.energyHistory.push(energy);
                const avg = this.energyHistory.reduce((a, b) => a + b, 0) / this.energyHistory.length;
                const variance = this.energyHistory.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / this.energyHistory.length;
                const c = 1.2 - Math.sqrt(variance) * 0.01;
                const now = performance.now();
                if (energy > avg * c && now - this.lastOnsetTime > 250) {
                    this.lastOnsetTime = now;
                    return 1.0;
                }
                const timeSince = now - this.lastOnsetTime;
                if (timeSince < 250) {
                    let x = 1 - timeSince / 250;
                    if (x < 0.5) x = 4 * x * x * x;
                    else x = (x - 1) * (2 * x - 2) * (2 * x - 2) + 1;
                    return x;
                }
                return 0;
            }

            detectPitch() {
                this.analyser.getFloatTimeDomainData(this.timeDomainArray);
                let maxVal = -Infinity, bestOffset = -1;
                for (let offset = 0; offset < this.bufferLength; offset++) {
                    let sum = 0;
                    for (let j = 0; j < this.bufferLength - offset; j++) {
                        sum += this.timeDomainArray[j] * this.timeDomainArray[j + offset];
                    }
                    if (sum > maxVal) {
                        maxVal = sum;
                        bestOffset = offset;
                    }
                }
                return bestOffset > 0 ? this.sampleRate / bestOffset : -1;
            }

            improvedDetectBeat(energy) {
                const isBeat = this.detectBeat(energy);
                if (isBeat) {
                    if (this.beatIntervals.length > 1) {
                        const diffs = [];
                        for (let i = 1; i < this.beatIntervals.length; i++) {
                            diffs.push(this.beatIntervals[i] - this.beatIntervals[i - 1]);
                        }
                        const avgDiff = diffs.reduce((a, b) => a + b, 0) / diffs.length;
                        this.rhythmComplexity = diffs.reduce((a, b) => a + Math.pow(b - avgDiff, 2), 0) / diffs.length;
                        this.rhythmComplexity = Math.min(1, this.rhythmComplexity / (60000 / 120));
                    }
                }
                return isBeat;
            }

            detectBeat(energy) {
                this.beatHistory.push(energy);
                if (this.beatHistory.length > this.HISTORY_SIZE) this.beatHistory.shift();
                if (this.beatHistory.length === this.HISTORY_SIZE) {
                    const avg = this.beatHistory.reduce((a, b) => a + b) / this.HISTORY_SIZE;
                    const variance = this.beatHistory.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / this.HISTORY_SIZE;
                    const threshold = -variance * 0.0025 + this.BEAT_THRESHOLD;
                    if (energy > avg * threshold && performance.now() - this.lastBeatTime > 200) {
                        this.lastBeatTime = performance.now();
                        this.beatIntervals.push(this.lastBeatTime);
                        if (this.beatIntervals.length > this.BPM_HISTORY + 1) this.beatIntervals.shift();
                        if (this.beatIntervals.length > 1) {
                            const intervals = [];
                            for (let i = 1; i < this.beatIntervals.length; i++) {
                                intervals.push(this.beatIntervals[i] - this.beatIntervals[i - 1]);
                            }
                            const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
                            this.bpm = 60000 / avgInterval;
                        }
                        return true;
                    }
                }
                return false;
            }

            getEmotionHue(bpm, energy) {
                const arousal = Math.min(1, bpm / 180);
                const valence = Math.min(1, energy / 255);
                return (arousal * 60 + valence * 120) % 360;
            }

            animate() {
                this.animationId = requestAnimationFrame(this.animate.bind(this));
                if (!this.isPlaying) return;

                this.analyser.getFloatFrequencyData(this.dataArray);
                const energy = -this.dataArray.reduce((a, b) => a + b, 0) / this.bufferLength;
                const normalizedEnergy = Math.min(1, energy / 50);

                const bands = this.getFinerBands();
                this.onsetValue = this.detectOnset(normalizedEnergy);
                const isBeat = this.improvedDetectBeat(normalizedEnergy);
                this.hue = this.getEmotionHue(this.bpm, normalizedEnergy);

                this.frameCounter = (this.frameCounter + 1) % 4;
                if (this.frameCounter === 0) this.pitch = this.detectPitch();

                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                const gradient = this.ctx.createRadialGradient(this.canvas.width / 2, this.canvas.height / 2, 0, this.canvas.width / 2, this.canvas.height / 2, Math.max(this.canvas.width, this.canvas.height) / 2);
                gradient.addColorStop(0, `hsla(${this.hue}, 75%, 20%, 0.9)`);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 1)');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                let pulseRadius = 70 + bands.bass * 50;
                if (isBeat) pulseRadius *= 1.5;
                const pulseGradient = this.ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, pulseRadius);
                pulseGradient.addColorStop(0, `hsla(${this.hue + 180}, 85%, 55%, ${bands.bass + (isBeat ? 0.3 : 0)})`);
                pulseGradient.addColorStop(1, `hsla(${this.hue + 180}, 85%, 55%, 0)`);
                this.ctx.fillStyle = pulseGradient;
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, pulseRadius, 0, Math.PI * 2);
                this.ctx.fill();

                switch (this.mode) {
                    case 'aurora':
                        this.waves.forEach((wave, i) => {
                            wave.amplitude += (bands.mid * 50 + (isBeat ? 50 : 0) + this.onsetValue * 100 - wave.amplitude) * 0.12;
                            wave.phase += 0.04 + bands.brilliance / 6000 + (this.pitch > 0 ? this.pitch / 100000 : 0);
                            wave.frequency = 0.015 + i * 0.01 + bands.highMid * 0.005;
                            this.ctx.beginPath();
                            this.ctx.strokeStyle = `hsla(${this.hue + i * 50}, 65%, 65%, ${0.6 + bands.bass / 2})`;
                            this.ctx.lineWidth = 2.5;
                            for (let x = 0; x < this.canvas.width; x += 4) {
                                const y = wave.y + Math.sin(x * wave.frequency + wave.phase) * wave.amplitude;
                                this.ctx.lineTo(x, y);
                            }
                            this.ctx.stroke();
                        });
                        break;
                    case 'cosmic':
                        this.particles.forEach(p => {
                            const dx = centerX - p.x;
                            const dy = centerY - p.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist > 0) {
                                p.vx += (dx / dist) * (bands.bass / 2);
                                p.vy += (dy / dist) * (bands.bass / 2);
                            }
                            p.vx += (Math.random() - 0.5) * bands.brilliance * 2;
                            p.vy += (Math.random() - 0.5) * bands.brilliance * 2;
                            if (this.onsetValue > 0.5) { p.vx *= 1.5; p.vy *= 1.5; }
                            p.vx *= 0.96;
                            p.vy *= 0.96;
                            p.x += p.vx;
                            p.y += p.vy;
                            if (p.x < 0) p.x = this.canvas.width;
                            if (p.x > this.canvas.width) p.x = 0;
                            if (p.y < 0) p.y = this.canvas.height;
                            if (p.y > this.canvas.height) p.y = 0;
                            p.size = p.baseSize + bands.bass * 2 + (this.pitch > 1000 ? 2 : 0);
                            p.opacity = 0.3 + this.rhythmComplexity * 0.7;
                            this.ctx.beginPath();
                            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            this.ctx.fillStyle = `hsla(${this.hue + bands.brilliance * 50}, 75%, 75%, ${p.opacity})`;
                            this.ctx.fill();
                        });
                        break;
                    case 'neural':
                        this.particles.forEach((p1, i) => {
                            const dx = centerX - p1.x;
                            const dy = centerY - p1.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist > 0) {
                                p1.vx += (dx / dist) * (bands.bass / 2);
                                p1.vy += (dy / dist) * (bands.bass / 2);
                            }
                            p1.vx += (Math.random() - 0.5) * bands.brilliance * 2;
                            p1.vy += (Math.random() - 0.5) * bands.brilliance * 2;
                            if (this.onsetValue > 0.5) { p1.vx *= 1.5; p1.vy *= 1.5; }
                            p1.vx *= 0.96;
                            p1.vy *= 0.96;
                            p1.x += p1.vx;
                            p1.y += p1.vy;
                            if (p1.x < 0) p1.x = this.canvas.width;
                            if (p1.x > this.canvas.width) p1.x = 0;
                            if (p1.y < 0) p1.y = this.canvas.height;
                            if (p1.y > this.canvas.height) p1.y = 0;
                            this.particles.slice(i + 1).forEach(p2 => {
                                const dist = Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2);
                                if (dist < 100 + this.rhythmComplexity * 50) {
                                    this.ctx.beginPath();
                                    this.ctx.moveTo(p1.x, p1.y);
                                    this.ctx.lineTo(p2.x, p2.y);
                                    this.ctx.strokeStyle = `hsla(${this.hue}, 50%, 50%, ${1 - dist / 100 + this.onsetValue * 0.5})`;
                                    this.ctx.lineWidth = 1 + bands.presence;
                                    this.ctx.stroke();
                                }
                            });
                            this.ctx.beginPath();
                            this.ctx.arc(p1.x, p1.y, p1.size, 0, Math.PI * 2);
                            this.ctx.fillStyle = `hsla(${this.hue + bands.brilliance * 50}, 75%, 75%, ${p1.opacity})`;
                            this.ctx.fill();
                        });
                        break;
                    case 'liquid':
                        this.waves.forEach((wave, i) => {
                            wave.amplitude += (bands.lowMid * 50 + (isBeat ? 50 : 0) - wave.amplitude) * 0.12;
                            wave.phase += 0.04 + bands.brilliance / 6000;
                            this.ctx.beginPath();
                            this.ctx.fillStyle = `hsla(${this.hue + i * 50}, 65%, 65%, ${0.3 + bands.bass / 2})`;
                            this.ctx.moveTo(0, this.canvas.height);
                            for (let x = 0; x < this.canvas.width; x += 4) {
                                let y = wave.y + Math.sin(x * wave.frequency + wave.phase) * wave.amplitude;
                                y += Math.sin(x / 100 + (this.pitch > 0 ? this.pitch / 2000 : 0)) * bands.highMid * 10;
                                y *= 1 + this.onsetValue * 0.5;
                                this.ctx.lineTo(x, y);
                            }
                            this.ctx.lineTo(this.canvas.width, this.canvas.height);
                            this.ctx.fill();
                        });
                        break;
                    case 'quantum':
                        this.ctx.globalAlpha = 0.05 + this.rhythmComplexity * 0.1;
                        this.particles.forEach(p => {
                            const dx = centerX - p.x;
                            const dy = centerY - p.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist > 0) {
                                p.vx += (dx / dist) * (bands.bass / 2);
                                p.vy += (dy / dist) * (bands.bass / 2);
                            }
                            p.vx += (Math.random() - 0.5) * bands.brilliance * 2;
                            p.vy += (Math.random() - 0.5) * bands.brilliance * 2;
                            if (this.onsetValue > 0.5) { p.vx *= 1.5; p.vy *= 1.5; }
                            p.vx *= 0.96;
                            p.vy *= 0.96;
                            this.ctx.beginPath();
                            this.ctx.moveTo(p.x, p.y);
                            p.x += p.vx;
                            p.y += p.vy;
                            this.ctx.lineTo(p.x, p.y);
                            this.ctx.strokeStyle = `hsla(${this.hue + bands.brilliance * 50}, 75%, 75%, 0.8)`;
                            this.ctx.lineWidth = p.size + this.onsetValue * 2;
                            this.ctx.stroke();
                            if (p.x < 0) p.x = this.canvas.width;
                            if (p.x > this.canvas.width) p.x = 0;
                            if (p.y < 0) p.y = this.canvas.height;
                            if (p.y > this.canvas.height) p.y = 0;
                        });
                        this.ctx.globalAlpha = 1;
                        break;
                }

                this.hue = (this.hue + bands.brilliance * 0.5) % 360;
            }

            start() {
                this.isPlaying = true;
                this.initParticles();
                this.initWaves();
                this.animate();
            }

            stop() {
                this.isPlaying = false;
                cancelAnimationFrame(this.animationId);
            }

            getVisualizationAsBlob(callback) {
                this.canvas.toBlob(callback, 'image/jpeg', 0.8);
            }
        }

                    item.setAttribute('tabindex', '0');
                    item.setAttribute('aria-label', `播放 ${file.metadata?.title || file.name}`);
                    item.innerHTML = `
                        <i class="material-icons playlist-item-icon">music_note</i>
                        <div class="playlist-item-info">
                            <div class="playlist-item-title">${file.metadata?.title || file.name.replace(/\.[^/.]+$/, "")}</div>
                            <div class="playlist-item-artist">${file.metadata?.artist || '未知艺术家'}</div>
                        </div>
                        <div class="playlist-item-duration">${file.duration || '--:--'}</div>
                        <i class="material-icons playlist-item-delete" data-index="${index}">delete</i>
                    `;
                    item.addEventListener('click', () => {
                        currentTrack = index;
                        setupAudio(playlist[currentTrack]);
                        updatePlaylistDisplay();
                    });
                    item.addEventListener('dragstart', (e) => {
                        dragIndex = index;
                        e.dataTransfer.setData('text/plain', index);
                    });
                    item.addEventListener('dragover', (e) => e.preventDefault());
                    item.addEventListener('drop', (e) => {
                        e.preventDefault();
                        const dropIndex = index;
                        if (dragIndex !== dropIndex) {
                            const [moved] = playlist.splice(dragIndex, 1);
                            playlist.splice(dropIndex, 0, moved);
                            if (currentTrack === dragIndex) currentTrack = dropIndex;
                            else if (currentTrack > dragIndex && currentTrack <= dropIndex) currentTrack--;
                            else if (currentTrack < dragIndex && currentTrack >= dropIndex) currentTrack++;
                            updatePlaylistDisplay();
                            savePlaylist();
                        }
                    });
                    item.querySelector('.playlist-item-delete').addEventListener('click', (e) => {
                        e.stopPropagation();
                        playlist.splice(index, 1);
                        if (index === currentTrack) {
                            if (playlist.length > 0) {
                                currentTrack = Math.min(currentTrack, playlist.length - 1);
                                setupAudio(playlist[currentTrack]);
                            } else {
                                resetPlayerUI();
                            }
                        } else if (index < currentTrack) {
                            currentTrack--;
                        }
                        updatePlaylistDisplay();
                        savePlaylist();
                        updateStatus('已删除歌曲');
                    });
                    item.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            currentTrack = index;
                            setupAudio(playlist[currentTrack]);
                            updatePlaylistDisplay();
                        }
                    });
                    playlistItems.appendChild(item);
                });
                savePlaylist();
            }

            function savePlaylist() {
                try {
                    const playlistData = playlist.map(file => ({
                        name: file.name,
                        metadata: file.metadata,
                        duration: file.duration
                    }));
                    localStorage.setItem('sonoriaPlaylist', JSON.stringify(playlistData));
                } catch (error) {
                    console.error('保存播放列表失败:', error);
                }
            }

            function loadPlaylist() {
                try {
                    const saved = localStorage.getItem('sonoriaPlaylist');
                    if (saved) {
                        const playlistData = JSON.parse(saved);
                        playlist = playlistData.map(data => {
                            const file = new File([new Blob()], data.name, { type: 'audio/mp3' });
                            file.metadata = data.metadata;
                            file.duration = data.duration;
                            return file;
                        });
                        updatePlaylistDisplay();
                    }
                } catch (error) {
                    console.error('加载播放列表失败:', error);
                }
            }

            function togglePlaylist() {
                playlistSection.classList.toggle('expanded');
            }

            // 初始化
            loadPlaylist();
            if (!localStorage.getItem('sonoriaOnboarded')) {
                onboardingModal.classList.add('show');
                localStorage.setItem('sonoriaOnboarded', 'true');
            }

            // 事件监听器
            uploadButton.addEventListener('click', () => audioUpload.click());
            uploadArea.addEventListener('click', () => audioUpload.click());

            audioUpload.addEventListener('change', (e) => {
                const files = e.target.files;
                if (files && files.length > 0) {
                    let validFiles = 0;
                    Array.from(files).forEach(file => {
                        if (file.type.startsWith('audio/') || file.type.startsWith('video/')) {
                            if (file.size > 100 * 1024 * 1024) {
                                updateStatus(`文件 ${file.name} 过大，需小于100MB`);
                                return;
                            }
                            jsmediatags.read(file, {
                                onSuccess: (tag) => {
                                    file.metadata = tag.tags;
                                    playlist.push(file);
                                    validFiles++;
                                    if (validFiles === 1 && !isPlaying && !isMicActive) {
                                        currentTrack = playlist.length - 1;
                                        setupAudio(playlist[currentTrack]);
                                    }
                                    updatePlaylistDisplay();
                                },
                                onError: () => {
                                    file.metadata = {};
                                    playlist.push(file);
                                    validFiles++;
                                    if (validFiles === 1 && !isPlaying && !isMicActive) {
                                        currentTrack = playlist.length - 1;
                                        setupAudio(playlist[currentTrack]);
                                    }
                                    updatePlaylistDisplay();
                                }
                            });
                        } else {
                            updateStatus(`文件 ${file.name} 格式不支持`);
                        }
                    });
                    if (validFiles > 0) {
                        updateStatus(`已添加 ${validFiles} 个文件`);
                    }
                }
            });

            playToggle.addEventListener('click', () => {
                playToggle.classList.add('ripple');
                setTimeout(() => playToggle.classList.remove('ripple'), 400);
                
                if (isMicActive) {
                    // 麦克风模式下的播放/暂停
                    if (isPlaying) {
                        visualizer.stop();
                        isPlaying = false;
                        playToggle.innerHTML = '<i class="material-icons">play_arrow</i><span class="tooltip">播放</span>';
                        playToggle.setAttribute('aria-label', '播放');
                        updateStatus('麦克风输入已暂停');
                    } else {
                        visualizer.start();
                        isPlaying = true;
                        playToggle.innerHTML = '<i class="material-icons">pause</i><span class="tooltip">暂停</span>';
                        playToggle.setAttribute('aria-label', '暂停');
                        updateStatus('正在收听麦克风输入');
                    }
                } else if (audioElement) {
                    // 音频文件模式下的播放/暂停
                    if (isPlaying) {
                        audioElement.pause();
                        isPlaying = false;
                        playToggle.innerHTML = '<i class="material-icons">play_arrow</i><span class="tooltip">播放</span>';
                        playToggle.setAttribute('aria-label', '播放');
                    } else {
                        audioElement.play().then(() => {
                            isPlaying = true;
                            playToggle.innerHTML = '<i class="material-icons">pause</i><span class="tooltip">暂停</span>';
                            playToggle.setAttribute('aria-label', '暂停');
                        }).catch(error => {
                            console.error('播放失败:', error);
                            updateStatus('播放失败，请检查音频文件');
                        });
                    }
                } else if (playlist.length > 0) {
                    // 没有当前播放但有播放列表
                    setupAudio(playlist[currentTrack]);
                } else {
                    updateStatus('请先上传音乐文件');
                }
            });

            micToggle.addEventListener('click', async () => {
                micToggle.classList.add('ripple');
                setTimeout(() => micToggle.classList.remove('ripple'), 400);
                
                if (isMicActive) {
                    // 关闭麦克风
                    isMicActive = false;
                    micToggle.classList.remove('active');
                    micControls.style.display = 'none';
                    if (currentStream) {
                        currentStream.getTracks().forEach(track => track.stop());
                        currentStream = null;
                    }
                    visualizer.stop();
                    isPlaying = false;
                    playToggle.innerHTML = '<i class="material-icons">play_arrow</i><span class="tooltip">播放</span>';
                    playToggle.setAttribute('aria-label', '播放');
                    updateStatus('麦克风已关闭');
                    
                    // 如果有播放列表，恢复播放
                    if (playlist.length > 0 && audioElement) {
                        audioElement.play().catch(console.error);
                    }
                } else {
                    // 开启麦克风
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ 
                            audio: {
                                echoCancellation: true,
                                noiseSuppression: true,
                                autoGainControl: true
                            } 
                        });
                        setupAudio(stream, true);
                        isMicActive = true;
                        micToggle.classList.add('active');
                    } catch (err) {
                        console.error('麦克风访问失败:', err);
                        updateStatus('麦克风访问被拒绝或不可用');
                    }
                }
            });

            micVolume.addEventListener('input', () => {
                if (gainNode) gainNode.gain.value = parseFloat(micVolume.value);
            });

            shuffleButton.addEventListener('click', () => {
                shuffleButton.classList.add('ripple');
                setTimeout(() => shuffleButton.classList.remove('ripple'), 400);
                isShuffled = !isShuffled;
                shuffleButton.classList.toggle('active');
                updateStatus(isShuffled ? '随机播放已开启' : '随机播放已关闭');
            });

            loopButton.addEventListener('click', () => {
                loopButton.classList.add('ripple');
                setTimeout(() => loopButton.classList.remove('ripple'), 400);
                isLooping = !isLooping;
                if (audioElement) audioElement.loop = isLooping;
                loopButton.classList.toggle('active');
                updateStatus(isLooping ? '循环播放已开启' : '循环播放已关闭');
            });

            clearPlaylist.addEventListener('click', () => {
                clearPlaylist.classList.add('ripple');
                setTimeout(() => clearPlaylist.classList.remove('ripple'), 400);
                playlist = [];
                currentTrack = 0;
                resetPlayerUI();
                updatePlaylistDisplay();
                updateStatus('播放列表已清空');
            });

            prevButton.addEventListener('click', () => {
                prevButton.classList.add('ripple');
                setTimeout(() => prevButton.classList.remove('ripple'), 400);
                playPrevious();
            });

            nextButton.addEventListener('click', () => {
                nextButton.classList.add('ripple');
                setTimeout(() => nextButton.classList.remove('ripple'), 400);
                playNext();
            });

            playlistToggle.addEventListener('click', () => {
                playlistToggle.classList.add('ripple');
                setTimeout(() => playlistToggle.classList.remove('ripple'), 400);
                togglePlaylist();
            });

            closePlaylist.addEventListener('click', () => {
                closePlaylist.classList.add('ripple');
                setTimeout(() => closePlaylist.classList.remove('ripple'), 400);
                togglePlaylist();
            });

            progressBarContainer.addEventListener('click', (e) => {
                if (audioElement && audioElement.duration) {
                    const rect = progressBarContainer.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const percentage = x / rect.width;
                    audioElement.currentTime = percentage * audioElement.duration;
                    updateProgress();
                }
            });

            themeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    btn.classList.add('ripple');
                    setTimeout(() => btn.classList.remove('ripple'), 400);
                    visualizer.setMode(btn.dataset.mode);
                    themeButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });

            document.querySelectorAll('.icon-button, .theme-button').forEach(btn => {
                btn.addEventListener('touchstart', () => {
                    btn.classList.add('touched');
                    setTimeout(() => btn.classList.remove('touched'), 1000);
                });
            });

            document.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
            });

            document.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const diffX = touchStartX - touchEndX;
                if (Math.abs(diffX) > 50) {
                    const themes = Array.from(themeButtons).map(b => b.dataset.mode);
                    const currentIndex = themes.indexOf(visualizer.mode);
                    let newIndex;
                    if (diffX > 0) {
                        newIndex = (currentIndex + 1) % themes.length;
                    } else {
                        newIndex = (currentIndex - 1 + themes.length) % themes.length;
                    }
                    visualizer.setMode(themes[newIndex]);
                    themeButtons.forEach(b => b.classList.remove('active'));
                    themeButtons[newIndex].classList.add('active');
                    swipeHint.classList.add('show');
                    setTimeout(() => swipeHint.classList.remove('show'), 2000);
                }
            });

            document.addEventListener('mousemove', () => {
                clearTimeout(inactivityTimer);
                playerCard.classList.remove('minimized');
                inactivityTimer = setTimeout(() => playerCard.classList.add('minimized'), 5000);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === ' ') {
                    e.preventDefault();
                    playToggle.click();
                } else if (e.key === 'ArrowLeft') {
                    prevButton.click();
                } else if (e.key === 'ArrowRight') {
                    nextButton.click();
                }
            });

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'rgba(102, 126, 234, 0.7)';
                uploadArea.style.background = 'rgba(102, 126, 234, 0.1)';
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = 'var(--border-light)';
                uploadArea.style.background = 'transparent';
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--border-light)';
                uploadArea.style.background = 'transparent';
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    let validFiles = 0;
                    Array.from(files).forEach(file => {
                        if (file.type.startsWith('audio/') || file.type.startsWith('video/')) {
                            if (file.size > 100 * 1024 * 1024) {
                                updateStatus(`文件 ${file.name} 过大，需小于100MB`);
                                return;
                            }
                            jsmediatags.read(file, {
                                onSuccess: (tag) => {
                                    file.metadata = tag.tags;
                                    playlist.push(file);
                                    validFiles++;
                                    if (validFiles === 1 && !isPlaying && !isMicActive) {
                                        currentTrack = playlist.length - 1;
                                        setupAudio(playlist[currentTrack]);
                                    }
                                    updatePlaylistDisplay();
                                },
                                onError: () => {
                                    file.metadata = {};
                                    playlist.push(file);
                                    validFiles++;
                                    if (validFiles === 1 && !isPlaying && !isMicActive) {
                                        currentTrack = playlist.length - 1;
                                        setupAudio(playlist[currentTrack]);
                                    }
                                    updatePlaylistDisplay();
                                }
                            });
                        } else {
                            updateStatus(`文件 ${file.name} 格式不支持`);
                        }
                    });
                    if (validFiles > 0) {
                        updateStatus(`已添加 ${validFiles} 个文件`);
                    }
                }
            });

            closeModal.addEventListener('click', () => {
                onboardingModal.classList.remove('show');
            });

            themeToggle.addEventListener('click', () => {
                themeToggle.classList.add('ripple');
                setTimeout(() => themeToggle.classList.remove('ripple'), 400);
                document.body.classList.toggle('light');
                updateStatus(document.body.classList.contains('light') ? '已切换到亮色主题' : '已切换到暗色主题');
            });

            // PWA Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error('Service Worker registration failed:', err));
            }

            // 初始化音频上下文（在用户交互后）
            document.addEventListener('click', function initOnFirstClick() {
                if (!audioContext) {
                    initAudioContext();
                }
                document.removeEventListener('click', initOnFirstClick);
            });

            updateStatus('欢迎使用 Sonoria - 上传音乐或使用麦克风开始体验');
        });
    </script>
</body>
</html>
