<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonoria | Lorenz Chaos v3.1 – Rainbow Edition</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/music-metadata-browser@2.5.10/dist/index.min.js"></script>
    <!-- 同步加载 Three.js（关键修复） -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
        :root{
            --glass-bg:rgba(0,0,0,0.45);
            --glass-border:rgba(255,255,255,0.1);
            --text-primary:#fff;
            --text-secondary:rgba(255,255,255,0.6);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Inter',sans-serif;
            background:#000;
            color:#fff;
            overflow:hidden;
            height:100vh;
            cursor:default;
            user-select:none;
        }
        #visualizer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;}
        .vignette{
            position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;
            pointer-events:none;
            background:radial-gradient(circle at center,transparent 40%,rgba(0,0,0,0.9) 100%);
        }
        .ui-layer{
            position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;
            pointer-events:none;display:flex;flex-direction:column;
            justify-content:space-between;padding:40px;transition:opacity .8s cubic-bezier(.215,.61,.355,1);
        }
        .ui-layer.idle{opacity:0;}
        .top-bar{display:flex;justify-content:space-between;align-items:center;pointer-events:auto;}
        .brand{font-size:1.3rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;opacity:.9;}

        /* 新增：配色模式切换 */
        .color-modes{display:flex;gap:10px;}
        .color-btn{
            width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
            background:var(--c, #333);box-shadow:0 0 15px rgba(255,255,255,.2);
            transition:all .3s;
        }
        .color-btn.active{transform:scale(1.15);box-shadow:0 0 25px var(--c, #fff);}

        .control-island{
            pointer-events:auto;max-width:720px;margin:0 auto;
            background:var(--glass-bg);backdrop-filter:blur(40px) saturate(180%);
            border:1px solid var(--glass-border);border-radius:28px;padding:28px 36px;
            box-shadow:0 30px 80px rgba(0,0,0,.6);
        }
        .track-title{font-size:1.7rem;font-weight:500;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .track-artist{font-size:1rem;color:var(--text-secondary);}

        .progress-container{display:flex;align-items:center;gap:15px;margin:24px 0;font-variant-numeric:tabular-nums;}
        .progress-bar-bg{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:3px;position:relative;cursor:pointer;overflow:hidden;}
        .progress-fill{position:absolute;left:0;top:0;height:100%;width:0%;background:linear-gradient(90deg,#00ffff,#ff00ff);box-shadow:0 0 20px rgba(255,0,255,.8);transition:width .1s linear;}

        .controls-row{display:flex;justify-content:space-between;align-items:center;}
        .main-controls{display:flex;gap:28px;align-items:center;}
        .btn-icon{border:none;background:none;color:#fff;cursor:pointer;font-size:28px;transition:all .3s;opacity:.8;}
        .btn-icon:hover{opacity:1;transform:scale(1.15);}
        .btn-play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);}
        .btn-play:hover{background:rgba(255,255,255,.25);box-shadow:0 0 40px rgba(255,255,255,.3);}

        .drag-overlay{
            position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);
            backdrop-filter:blur(10px);z-index:100;display:flex;flex-direction:column;
            justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .4s;
        }
        .drag-overlay.active{opacity:1;pointer-events:auto;}
        .drag-txt{font-size:64px;color:#fff;}

        .toast{
            position:fixed;top:40px;left:50%;transform:translateX(-50%) translateY(-30px);
            background:rgba(255,255,255,.15);backdrop-filter:blur(12px);
            padding:10px 24px;border-radius:30px;font-size:.9rem;
            border:1px solid rgba(255,255,255,.1);opacity:0;z-index:200;
            transition:all .4s;
        }
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

        @media(max-width:768px){
            .ui-layer{padding:20px;}
            .control-island{padding:20px;border-radius:20px;}
        }
    </style>
</head>
<body>
    <div id="visualizer"></div>
    <div class="vignette"></div>

    <div class="ui-layer" id="ui-layer">
        <div class="top-bar">
            <div class="brand">LORENZ CHAOS v3.1</div>

            <!-- 配色模式切换 -->
            <div class="color-modes">
                <button class="color-btn active" data-color="classic" style="--c:#00ffff;" title="经典青紫"></button>
                <button class="color-btn" data-color="rainbow" style="--c:linear-gradient(45deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);" title="彩虹狂欢"></button>
                <button class="color-btn" data-color="emotion" style="--c:#ff6b6b;" title="情绪色彩"></button>
            </div>
        </div>

        <div class="control-island">
            <div class="track-title" id="track-title">Sonoria Rainbow Chaos</div>
            <div class="track-artist" id="track-artist">拖入或点击上传音乐</div>

            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar-bg" id="progress-bg"><div class="progress-fill" id="progress-fill"></div></div>
                <span id="total-time">--:--</span>
            </div>

            <div class="controls-row">
                <button class="btn-icon" id="prev-btn"><i class="material-icons-round">skip_previous</i></button>
                <button class="btn-icon btn-play" id="play-btn"><i class="material-icons-round">play_arrow</i></button>
                <button class="btn-icon" id="next-btn"><i class="material-icons-round">skip_next</i></button>
                <button class="btn-icon" id="upload-btn"><i class="material-icons-round">add</i></button>
            </div>
        </div>
    </div>

    <div class="drag-overlay" id="drag-overlay">
        <div class="drag-txt">↑ Release to Immerse ↑</div>
    </div>

    <div class="toast" id="toast">v3.1 已就绪 – 彩虹混沌启动！</div>
    <input type="file" id="file-input" multiple accept="audio/*" style="display:none">

<script>
const clamp = (v,min,max)=>Math.min(Math.max(v,min),max);

let idleTimer;
function resetIdle(){ 
    document.getElementById('ui-layer').classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer=setTimeout(()=>document.getElementById('ui-layer').classList.add('idle'),4000);
}
['mousemove','touchstart','click'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));

class SonoriaVisualizer{
    constructor(container){
        this.container = container;
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
        this.camera.position.z = 80;

        this.renderer = new THREE.WebGLRenderer({antialias:true,alpha:false});
        this.renderer.setSize(innerWidth,innerHeight);
        this.renderer.setPixelRatio(devicePixelRatio);
        container.appendChild(this.renderer.domElement);

        // 音频
        this.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        this.analyser = this.audioCtx.createAnalyser();
        this.analyser.fftSize = 2048;
        this.analyser.smoothingTimeConstant = 0.82;
        this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

        // 参数
        this.sigma=10; this.rho=28; this.beta=8/3; this.dt=0.006;
        this.x=0.1; this.y=0; this.z=0;
        this.points = [];
        this.maxPoints = 8000;

        // 彩色线条（关键！）
        this.lineGeometry = new THREE.BufferGeometry();
        this.lineMaterial = new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.9});
        this.line = new THREE.Line(this.lineGeometry,this.lineMaterial);
        this.scene.add(this.line);

        // 粒子（Shader 彩虹）
        this.particleCount = 3000;
        this.pgeo = new THREE.BufferGeometry();
        this.ppos = new Float32Array(this.particleCount*3);
        this.pcol = new Float32Array(this.particleCount*3);
        for(let i=0;i<this.particleCount;i++){
            this.ppos[i*3]   = (Math.random()-0.5)*120;
            this.ppos[i*3+1] = (Math.random()-0.5)*120;
            this.ppos[i*3+2] = (Math.random()-0.5)*120;
        }
        this.pgeo.setAttribute('position',new THREE.BufferAttribute(this.ppos,3));
        this.pgeo.setAttribute('color',new THREE.BufferAttribute(this.pcol,3));
        this.pmat = new THREE.PointsMaterial({size:1.8,vertexColors:true,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending});
        this.particles = new THREE.Points(this.pgeo,this.pmat);
        this.scene.add(this.particles);

        this.colorMode = 'rainbow'; // classic | rainbow | emotion

        window.addEventListener('resize',()=>this.onResize());
        this.animate();
    }

    onResize(){
        this.camera.aspect = innerWidth/innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(innerWidth,innerHeight);
    }

    connect(source){
        source.connect(this.analyser);
        this.analyser.connect(this.audioCtx.destination);
    }

    getEnergy(a,b){
        let sum=0, len=this.dataArray.length;
        a=Math.max(0,a); b=Math.min(b,len);
        for(let i=a;i<b;i++) sum+=this.dataArray[i];
        return sum/(b-a);
    }

    setColorMode(mode){
        this.colorMode = mode;
        document.querySelectorAll('.color-btn').forEach(b=>b.classList.toggle('active',b.dataset.color===mode));
    }

    animate(){
        requestAnimationFrame(()=>this.animate());
        this.analyser.getByteFrequencyData(this.dataArray);

        const bass = this.getEnergy(0,12)/255;
        const mid  = this.getEnergy(80,300)/255;
        const high = this.getEnergy(600,1200)/255;

        // 参数响应
        this.rho = 28 + mid*20;
        this.dt  = 0.005 + bass*0.008;

        // Lorenz 步进
        for(let i=0;i<8;i++){
            const dx = this.sigma*(this.y-this.x)*this.dt;
            const dy = this.x*(this.rho-this.z)-this.y*this.dt;
            const dz = this.x*this.y - this.beta*this.z*this.dt;
            this.x+=dx; this.y+=dy; this.z+=dz;

            this.points.push(this.x*0.5, this.y*0.5, this.z*0.5);
            if(this.points.length> this.maxPoints*3) this.points.splice(0,3);
        }

        // 更新线条 + 颜色
        this.lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(this.points,3));

        const colors = [];
        for(let i=0;i<this.points.length;i+=3){
            let hue;
            if(this.colorMode==='classic'){
                hue = 180 + this.points[i+2]*2; // 青紫经典
            }else if(this.colorMode==='rainbow'){
                hue = (Date.now()/20 + i*0.3 + this.points[i+2]*3) % 360;
            }else{ // emotion
                hue = bass>0.7? 0 : mid>0.6? 280 : high>0.6? 180 : 60;
            }
            const col = new THREE.Color(`hsl(${hue},100%,65%)`);
            colors.push(col.r,col.g,col.b);
        }
        this.lineGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));

        // 粒子彩虹
        for(let i=0;i<this.particleCount;i++){
            const idx = i*3;
            const hue = (Date.now()/30 + i*2 + bass*200 + high*100) % 360;
            const c = new THREE.Color(`hsl(${hue},100%,70%)`);
            this.pcol[idx]=c.r; this.pcol[idx+1]=c.g; this.pcol[idx+2]=c.b;

            // 粒子受音乐震动
            const force = bass*3 + high;
            this.ppos[idx]   += (Math.random()-0.5)*force;
            this.ppos[idx+1] += (Math.random()-0.5)*force;
            this.ppos[idx+2] += (Math.random()-0.5)*force;
        }
        this.pgeo.attributes.position.needsUpdate = true;
        this.pgeo.attributes.color.needsUpdate = true;

        // 旋转
        this.line.rotation.y += 0.003 + high*0.01;
        this.line.rotation.x = Math.sin(Date.now()/8000)*0.3;
        this.particles.rotation.y += 0.005 + bass*0.02;

        this.renderer.render(this.scene,this.camera);
    }
}

// App
const app = {
    audio:new Audio(),
    playlist:[],
    idx:0,
    viz:null,
    source:null,

    init(){
        this.viz = new SonoriaVisualizer(document.getElementById('visualizer'));
        this.bind();
        this.dragDrop();
        setTimeout(()=>document.getElementById('toast').classList.add('show'),500);
    },

    bind(){
        document.getElementById('play-btn').onclick = ()=>this.toggle();
        document.getElementById('prev-btn').onclick = ()=>this.prev();
        document.getElementById('next-btn').onclick = ()=>this.next();
        document.getElementById('upload-btn').onclick = ()=>document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = e=>this.addFiles(e.target.files);

        // 配色切换
        document.querySelectorAll('.color-btn').forEach(btn=>{
            btn.onclick=()=>{ app.viz.setColorMode(btn.dataset.color); };
        });

        // 进度条点击
        document.getElementById('progress-bg').onclick = e=>{
            if(!this.audio.duration) return;
            const rect = e.target.getBoundingClientRect();
            const per = (e.clientX-rect.left)/rect.width;
            this.audio.currentTime = per * this.audio.duration;
        };
    },

    async addFiles(files){
        for(const file of files){
            if(!file.type.startsWith('audio/')) continue;
            const url = URL.createObjectURL(file);
            let title = file.name.replace(/\.[^.]+$/,'');
            try{
                const meta = await musicMetadata.parseBlob(file);
                title = meta.common.title||title;
            }catch(e){}
            this.playlist.push({url,title,artist:'Local'});
        }
        if(this.playlist.length===files.length) this.play(0);
        this.showToast(`已添加 ${this.playlist.length} 首`);
    },

    async play(i){
        this.idx = i;
        if(this.source) this.source.disconnect();
        this.audio.src = this.playlist[i].url;
        this.source = this.viz.audioCtx.createMediaElementSource(this.audio);
        this.viz.connect(this.source);
        document.getElementById('track-title').textContent = this.playlist[i].title;
        document.getElementById('track-artist').textContent = this.playlist[i].artist||'Unknown';
        await this.audio.play();
        document.querySelector('#play-btn i').textContent='pause';
    },

    toggle(){
        if(this.audio.paused && this.playlist.length){
            if(!this.audio.src) this.play(0);
            else this.audio.play();
            document.querySelector('#play-btn i').textContent='pause';
        }else{
            this.audio.pause();
            document.querySelector('#play-btn i').textContent='play_arrow';
        }
    },

    prev(){ if(this.playlist.length) this.play((this.idx-1+this.playlist.length)%this.playlist.length); }
    next(){ if(this.playlist.length) this.play((this.idx+1)%this.playlist.length); }

    dragDrop(){
        const overlay = document.getElementById('drag-overlay');
        let cnt=0;
        document.body.addEventListener('dragenter',e=>{e.preventDefault(); cnt++; overlay.classList.add('active');});
        document.body.addEventListener('dragleave',e=>{e.preventDefault(); if(--cnt===0) overlay.classList.remove('active');});
        document.body.addEventListener('dragover',e=>e.preventDefault());
        document.body.addEventListener('drop',e=>{
            e.preventDefault(); cnt=0; overlay.classList.remove('active');
            if(e.dataTransfer.files.length) this.addFiles(e.dataTransfer.files);
        });
    },

    showToast(msg){
        const t=document.getElementById('toast');
        t.textContent=msg;
        t.classList.add('show');
        setTimeout(()=>t.classList.remove('show'),3000);
    }
};

window.onload = ()=>app.init();
</script>
</body>
</html>
