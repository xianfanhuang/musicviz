<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonoria-动人心绚，乐音之境</title>
    <meta name="color-scheme" content="dark">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.8);
        }
        
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* 光晕容器 */
        #halo-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            transition: transform 0.3s ease;
        }
        
        /* 光晕效果 */
        #halo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(var(--scale, 1));
        }
        
        #halo::before {
            content: "";
            position: absolute;
            inset: -20%;
            background: radial-gradient(
                circle at 50% 50%,
                hsl(var(--hue, 200), 80%, 60%, calc(0.3 * var(--glow, 0))) 0%,
                transparent 70%
            );
            animation: pulse calc(1s / var(--pulse, 1)) infinite alternate;
            opacity: var(--brightness, 1);
        }
        
        #halo::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(
                circle at 50% 50%,
                hsl(var(--hue, 200), 80%, 60%, 0.9) 0%,
                hsl(var(--hue, 200), 80%, 40%, 0.6) 50%,
                transparent 70%
            );
            filter: saturate(var(--saturation, 1));
        }
        
        /* 光晕中心点 */
        #halo-core {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: hsl(var(--hue, 200), 80%, 60%);
            position: absolute;
            box-shadow: 
                0 0 30px hsl(var(--hue, 200), 80%, 60%),
                inset 0 0 10px rgba(0, 0, 0, 0.3);
            animation: breath 2s infinite alternate;
            z-index: 3;
        }
        
        /* 初始品牌文字 */
        #brand {
            position: absolute;
            text-align: center;
            opacity: var(--brand-opacity, 1);
            transition: opacity 1.5s ease-in-out;
            z-index: 4;
        }
        
        #brand h1 {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(100, 200, 255, 0.5);
        }
        
        #brand p {
            font-size: 1rem;
            opacity: 0.7;
            letter-spacing: 0.05em;
        }
        
        /* 状态提示 */
        #status {
            position: absolute;
            bottom: 30%;
            text-align: center;
            font-size: 1rem;
            opacity: 0.7;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        
        /* 控制面板 - 默认隐藏 */
        #controls {
            position: absolute;
            bottom: 20%;
            display: flex;
            gap: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        
        #controls.visible {
            opacity: 0.8;
            transform: translateY(0);
            pointer-events: all;
        }
        
        #controls:hover {
            opacity: 1;
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        
        /* 主题选择器 - 默认隐藏 */
        #themes {
            position: absolute;
            top: 20px;
            right: 20px;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.4s ease;
            pointer-events: none;
        }
        
        #themes.visible {
            opacity: 0.7;
            transform: translateX(0);
            pointer-events: all;
        }
        
        #themes:hover {
            opacity: 1;
        }
        
        .theme-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        
        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* 文件输入 */
        #file-input {
            display: none;
        }
        
        /* 动画 */
        @keyframes pulse {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }
        
        @keyframes breath {
            from { transform: scale(0.95); }
            to { transform: scale(1.05); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            #halo-container {
                width: 220px;
                height: 220px;
            }
            
            #halo-core {
                width: 50px;
                height: 50px;
            }
            
            #brand h1 {
                font-size: 2.2rem;
            }
            
            .control-btn {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="visualizer"></canvas>
        
        <div id="halo-container">
            <div id="brand">
                <h1>SONORIA</h1>
                <p>动人心绚，乐音之境</p>
            </div>
            
            <div id="halo">
                <div id="halo-core"></div>
            </div>
            
            <div id="status">your music ↑</div>
            
            <div id="controls">
                <button class="control-btn" id="prev-btn"><previous</button>
                <button class="control-btn" id="play-btn">▶</button>
                <button class="control-btn" id="next-btn">Next></button>
            </div>
            
            <div id="themes">
                <button class="theme-btn" id="theme-btn">them<button>
            </div>
        </div>
        
        <input type="file" id="file-input" accept="audio/mp3,audio/wav,audio/ma, audio/flac,audio/*" multiple>
    </div>

    <script>
        // 状态管理
        const APP_STATE = {
            IDLE: 'idle',
            LOADING: 'loading',
            PLAYING: 'playing',
            PAUSED: 'paused'
        };
        
        let currentState = APP_STATE.IDLE;
        
        // 主题定义
        const themes = [
            { name: '脉冲光晕', hue: 200 },
            { name: '火焰之舞', hue: 20 },
            { name: '深海韵律', hue: 220 },
            { name: '森林呼吸', hue: 120 }
        ];
        
        let currentThemeIndex = 0;
        
        // 音频状态
        const audioState = {
            ctx: null,
            analyser: null,
            source: null,
            data: null,
            tracks: [],
            currentTrackIndex: -1,
            isPlaying: false
        };
        
        // 可视化变量
        let canvas, ctx;
        let particles = [];
        let animationId;
        
        // DOM 元素
        const halo = document.getElementById('halo');
        const haloCore = document.getElementById('halo-core');
        const brand = document.getElementById('brand');
        const status = document.getElementById('status');
        const controls = document.getElementById('controls');
        const themesPanel = document.getElementById('themes');
        const fileInput = document.getElementById('file-input');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const themeBtn = document.getElementById('theme-btn');
        
        // 初始化
        function init() {
            setupCanvas();
            setupEventListeners();
            setAppState(APP_STATE.IDLE);
            
            // 初始动画 - 品牌文字渐隐，光晕保持
            setTimeout(() => {
                document.documentElement.style.setProperty('--brand-opacity', '0');
                
                setTimeout(() => {
                    brand.style.display = 'none';
                }, 1500);
            }, 2500);
            
            // 初始渲染
            render();
        }
        
        // 设置画布
        function setupCanvas() {
            canvas = document.getElementById('visualizer');
            ctx = canvas.getContext('2d');
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }
        
        // 调整画布大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 光晕点击 - 选择文件
            halo.addEventListener('click', () => {
                if (currentState === APP_STATE.IDLE) {
                    fileInput.click();
                }
            });
            
            // 文件选择
            fileInput.addEventListener('change', handleFileSelect);
            
            // 控制按钮
            playBtn.addEventListener('click', togglePlayback);
            prevBtn.addEventListener('click', playPrevious);
            nextBtn.addEventListener('click', playNext);
            
            // 主题切换
            themeBtn.addEventListener('click', cycleTheme);
            
            // 显示/隐藏控制面板
            halo.addEventListener('mouseenter', showControls);
            halo.addEventListener('mouseleave', hideControls);
            
            // 触摸设备支持
            halo.addEventListener('touchstart', handleTouch, { passive: true });
        }
        
        // 处理文件选择
        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length === 0) return;
            
            audioState.tracks = Array.from(files);
            audioState.currentTrackIndex = 0;
            
            loadAndPlayTrack(audioState.tracks[0]);
        }
        
        // 加载并播放音轨
        async function loadAndPlayTrack(file) {
            setAppState(APP_STATE.LOADING);
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                
                if (!audioState.ctx) {
                    await setupAudioContext();
                }
                
                const audioBuffer = await audioState.ctx.decodeAudioData(arrayBuffer);
                
                if (audioState.source) {
                    audioState.source.stop();
                }
                
                audioState.source = audioState.ctx.createBufferSource();
                audioState.source.buffer = audioBuffer;
                audioState.source.connect(audioState.analyser);
                audioState.source.start(0);
                
                audioState.source.onended = () => {
                    playNext();
                };
                
                audioState.isPlaying = true;
                setAppState(APP_STATE.PLAYING);
                
                // 更新状态提示
                status.textContent = file.name.replace(/\.[^/.]+$/, ""); // 移除扩展名
                
            } catch (error) {
                console.error('Error playing audio:', error);
                setAppState(APP_STATE.IDLE);
                status.textContent = '无法播放该文件';
            }
        }
        
        // 设置音频上下文
        async function setupAudioContext() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioState.ctx = new AudioContext();
            
            // 创建分析器
            audioState.analyser = audioState.ctx.createAnalyser();
            audioState.analyser.fftSize = 256;
            audioState.data = new Uint8Array(audioState.analyser.frequencyBinCount);
            
            // 连接到目的地
            audioState.analyser.connect(audioState.ctx.destination);
            
            // 恢复音频上下文（针对浏览器自动暂停策略）
            if (audioState.ctx.state === 'suspended') {
                await audioState.ctx.resume();
            }
        }
        
        // 切换播放状态
        function togglePlayback() {
            if (!audioState.ctx) return;
            
            if (audioState.isPlaying) {
                audioState.ctx.suspend().then(() => {
                    audioState.isPlaying = false;
                    setAppState(APP_STATE.PAUSED);
                    playBtn.textContent = '▶';
                });
            } else {
                audioState.ctx.resume().then(() => {
                    audioState.isPlaying = true;
                    setAppState(APP_STATE.PLAYING);
                    playBtn.textContent = '⏸';
                });
            }
        }
        
        // 播放上一首
        function playPrevious() {
            if (audioState.tracks.length === 0) return;
            
            audioState.currentTrackIndex = 
                (audioState.currentTrackIndex - 1 + audioState.tracks.length) % audioState.tracks.length;
            
            loadAndPlayTrack(audioState.tracks[audioState.currentTrackIndex]);
        }
        
        // 播放下一首
        function playNext() {
            if (audioState.tracks.length === 0) return;
            
            audioState.currentTrackIndex = 
                (audioState.currentTrackIndex + 1) % audioState.tracks.length;
            
            loadAndPlayTrack(audioState.tracks[audioState.currentTrackIndex]);
        }
        
        // 循环主题
        function cycleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const theme = themes[currentThemeIndex];
            
            document.documentElement.style.setProperty('--hue', theme.hue);
            status.textContent = theme.name;
            
            setTimeout(() => {
                if (currentState === APP_STATE.IDLE) {
                    status.textContent = '点击光晕选择音乐';
                }
            }, 2000);
        }
        
        // 显示控制面板
        function showControls() {
            if (audioState.tracks.length > 0) {
                controls.classList.add('visible');
                themesPanel.classList.add('visible');
            }
        }
        
        // 隐藏控制面板
        function hideControls() {
            controls.classList.remove('visible');
            themesPanel.classList.remove('visible');
        }
        
        // 处理触摸事件
        function handleTouch(e) {
            if (audioState.tracks.length > 0) {
                controls.classList.toggle('visible');
                themesPanel.classList.toggle('visible');
            }
            
            e.preventDefault();
        }
        
        // 设置应用状态
        function setAppState(state) {
            currentState = state;
            
            switch (state) {
                case APP_STATE.IDLE:
                    document.documentElement.style.setProperty('--pulse', '1');
                    document.documentElement.style.setProperty('--brightness', '1');
                    document.documentElement.style.setProperty('--saturation', '1');
                    document.documentElement.style.setProperty('--scale', '1');
                    playBtn.textContent = '▶';
                    break;
                    
                case APP_STATE.LOADING:
                    document.documentElement.style.setProperty('--pulse', '1.5');
                    document.documentElement.style.setProperty('--brightness', '1.2');
                    document.documentElement.style.setProperty('--scale', '0.95');
                    status.textContent = '加载中...';
                    break;
                    
                case APP_STATE.PLAYING:
                    document.documentElement.style.setProperty('--pulse', '1');
                    document.documentElement.style.setProperty('--brightness', '1');
                    document.documentElement.style.setProperty('--scale', '1');
                    playBtn.textContent = '⏸';
                    break;
                    
                case APP_STATE.PAUSED:
                    document.documentElement.style.setProperty('--pulse', '1.2');
                    document.documentElement.style.setProperty('--brightness', '0.8');
                    document.documentElement.style.setProperty('--saturation', '0.7');
                    playBtn.textContent = '▶';
                    break;
            }
        }
        
        // 创建粒子
        function createParticles() {
            particles = [];
            
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: 0,
                    y: 0,
                    size: Math.random() * 3 + 1,
                    speed: Math.random() * 2 + 1,
                    angle: Math.random() * Math.PI * 2,
                    distance: Math.random() * 150 + 50,
                    hue: Math.random() * 60 + (themes[currentThemeIndex].hue - 30)
                });
            }
        }
        
        // 渲染循环
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 获取音频数据（如果正在播放）
            if (audioState.isPlaying && audioState.analyser) {
                audioState.analyser.getByteFrequencyData(audioState.data);
                
                // 更新光晕效果
                const average = Array.from(audioState.data).reduce((a, b) => a + b) / audioState.data.length;
                const intensity = average / 256;
                
                document.documentElement.style.setProperty('--glow', intensity);
                document.documentElement.style.setProperty('--scale', 1 + intensity * 0.1);
                
                // 更新和渲染粒子
                updateParticles(intensity);
            } else if (currentState === APP_STATE.IDLE || currentState === APP_STATE.PAUSED) {
                // 空闲状态下的柔和动画
                renderIdleAnimation();
            }
            
            animationId = requestAnimationFrame(render);
        }
        
        // 更新粒子
        function updateParticles(intensity) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                
                // 根据音频强度调整粒子距离
                const pulseDistance = p.distance * (1 + intensity * 0.5);
                
                // 计算粒子位置
                p.x = centerX + Math.cos(p.angle) * pulseDistance;
                p.y = centerY + Math.sin(p.angle) * pulseDistance;
                
                // 根据音频数据调整粒子大小和透明度
                const sizeMod = audioState.data[Math.floor(i / particles.length * audioState.data.length)] / 256;
                const alpha = 0.3 + sizeMod * 0.7;
                
                // 绘制粒子
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (1 + sizeMod), 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue}, 80%, 60%, ${alpha})`;
                ctx.fill();
                
                // 更新粒子角度
                p.angle += 0.005 * p.speed;
            }
        }
        
        // 空闲状态动画
        function renderIdleAnimation() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const time = Date.now() * 0.001;
            
            // 绘制柔和的光晕效果
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 50,
                centerX, centerY, 250
            );
            
            gradient.addColorStop(0, `hsla(${themes[currentThemeIndex].hue}, 80%, 60%, 0.3)`);
            gradient.addColorStop(1, 'hsla(200, 80%, 60%, 0)');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 250, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // 绘制缓慢移动的粒子
            if (particles.length === 0) {
                createParticles();
            }
            
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                
                // 计算粒子位置
                p.x = centerX + Math.cos(p.angle + time * 0.2) * p.distance;
                p.y = centerY + Math.sin(p.angle + time * 0.2) * p.distance;
                
                // 绘制粒子
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue}, 80%, 60%, 0.5)`;
                ctx.fill();
                
                // 缓慢更新粒子角度
                p.angle += 0.001 * p.speed;
            }
        }
        
        // 初始化应用
        init();
    </script>
</body>
</html>
