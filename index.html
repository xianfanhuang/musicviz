<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>声音的境界</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="color-scheme" content="dark">
<style>
  :root{--bg:#000;--brand-hue:200;--glow:0}
  *,*:before,*:after{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none}
  #app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #hint{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:14px}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="hint">点击屏幕开始</div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
