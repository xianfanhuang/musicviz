<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sonoria AI | 生成式音乐感知引擎</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <!-- Puter SDK - 异步加载优化 -->
    <script>
        (function() {
            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://js.puter.com/v2/';
            script.onerror = function() {
                console.warn('[Sonoria] Puter SDK加载失败，使用本地模式');
                window.puterUnavailable = true;
            };
            document.head.appendChild(script);
        })();
    </script>

    <style>
        :root {
            --primary: #8E2DE2;
            --accent: #00d2ff;
            --ai-glow: #00f2ff;
            --bg-deep: #000000;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-strong: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.06);
            --highlight: rgba(255, 255, 255, 0.15);
            --text-main: rgba(255, 255, 255, 0.95);
            --text-sub: rgba(255, 255, 255, 0.55);
            --ease-smooth: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        /* AI Status Indicator */
        .ai-status {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            display: flex; align-items: center; gap: 8px;
            background: rgba(0, 242, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.2);
            padding: 8px 16px; border-radius: 100px; font-size: 0.75rem;
            color: var(--ai-glow); opacity: 0; transform: translateY(-20px);
            transition: all 0.4s var(--ease-elastic); font-family: 'Space Grotesk', monospace;
            backdrop-filter: blur(10px);
        }
        .ai-status.active { opacity: 1; transform: translateY(0); }
        .ai-pulse { width: 8px; height: 8px; background: var(--ai-glow); border-radius: 50%;
            box-shadow: 0 0 10px var(--ai-glow); animation: ai-breathe 2s infinite; }
        @keyframes ai-breathe {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Visualizer Canvas */
        #visualizer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; filter: contrast(1.2) saturate(1.3);
        }
        .vignette {
            position: fixed; inset: 0; z-index: 2; pointer-events: none;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%);
        }

        /* Particle Overlay for AI Art */
        #ai-particles {
            position: fixed; inset: 0; z-index: 3; pointer-events: none;
            mix-blend-mode: screen;
        }

        /* Main UI */
        .app-shell {
            position: relative; z-index: 10; height: 100vh; width: 100vw;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: var(--safe-top) 20px calc(20px + var(--safe-bottom));
            transition: all 0.6s var(--ease-smooth);
        }

        .lens-card {
            width: 100%; max-width: 440px;
            background: var(--glass);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--border);
            border-top: 1px solid var(--highlight);
            border-radius: 32px;
            padding: 28px;
            display: flex; flex-direction: column; gap: 20px;
            box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
            transform-style: preserve-3d;
            transition: all 0.5s var(--ease-smooth);
            position: relative;
            overflow: hidden;
        }
        .lens-card::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.05), transparent 50%);
            pointer-events: none;
        }

        /* AI Insight Bubble */
        .ai-insight {
            position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 12px 20px; border-radius: 16px; font-size: 0.8rem;
            color: var(--ai-glow); max-width: 90%; text-align: center;
            opacity: 0; pointer-events: none; transition: all 0.4s;
            backdrop-filter: blur(20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ai-insight.show { opacity: 1; top: -50px; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand {
            font-family: 'Space Grotesk', sans-serif; font-size: 0.7rem;
            letter-spacing: 3px; font-weight: 700;
            color: var(--text-sub); display: flex; align-items: center; gap: 8px;
            text-transform: uppercase;
        }
        .ai-badge {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .icon-btn {
            background: transparent; border: none; color: var(--text-main);
            width: 40px; height: 40px; border-radius: 50%;
            display: grid; place-items: center; cursor: pointer;
            transition: all 0.2s; position: relative;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.1); }
        .icon-btn.ai-active { color: var(--ai-glow); text-shadow: 0 0 20px var(--ai-glow); }

        /* Hero Section with AI Mood */
        .hero-text { text-align: center; margin: 8px 0; position: relative; }
        .mood-indicator {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.7rem; color: var(--ai-glow); margin-bottom: 8px;
            opacity: 0; transition: opacity 0.5s; font-family: 'Space Grotesk', monospace;
            border: 1px solid rgba(0, 242, 255, 0.2); padding: 4px 12px; border-radius: 100px;
            background: rgba(0, 242, 255, 0.05);
        }
        .mood-indicator.active { opacity: 1; }

        .title {
            font-size: 1.3rem; font-weight: 700; line-height: 1.4;
            color: var(--text-main); margin-bottom: 6px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .artist {
            font-size: 0.9rem; color: var(--text-sub);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* AI Chat Interface */
        .ai-drawer {
            max-height: 0; overflow: hidden; transition: all 0.4s var(--ease-smooth);
            background: rgba(0,0,0,0.4); border-radius: 20px; margin-top: 0;
        }
        .ai-drawer.open { max-height: 300px; margin-top: 16px; border: 1px solid rgba(0, 210, 255, 0.2); }

        .chat-container { padding: 16px; display: flex; flex-direction: column; gap: 12px; height: 300px; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-message {
            padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 0.85rem;
            animation: message-in 0.3s var(--ease-elastic);
        }
        @keyframes message-in {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .chat-message.user {
            background: rgba(255,255,255,0.1); align-self: flex-end; border-bottom-right-radius: 4px;
        }
        .chat-message.ai {
            background: rgba(0, 210, 255, 0.1); border: 1px solid rgba(0, 210, 255, 0.2);
            align-self: flex-start; border-bottom-left-radius: 4px; color: var(--ai-glow);
        }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input {
            flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px; border-radius: 100px; color: #fff; outline: none;
        }
        .chat-input:focus { border-color: var(--ai-glow); }
        .chat-send {
            width: 40px; height: 40px; border-radius: 50%; background: var(--ai-glow); border: none;
            color: #000; display: grid; place-items: center; cursor: pointer; transition: transform 0.2s;
        }
        .chat-send:hover { transform: scale(1.1); }
        .chat-send:active { transform: scale(0.95); }

        /* Progress & Controls */
        .progress-container { padding: 16px 0; cursor: pointer; touch-action: none; }
        .progress-rail {
            height: 4px; background: rgba(255,255,255,0.1); width: 100%; border-radius: 2px; overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%; border-radius: 2px; transition: width 0.1s linear;
            box-shadow: 0 0 10px var(--accent);
        }
        .time-meta {
            display: flex; justify-content: space-between; font-size: 0.75rem;
            color: var(--text-sub); margin-top: 8px; font-variant-numeric: tabular-nums;
        }

        .controls {
            display: flex; justify-content: center; align-items: center; gap: 32px; padding: 10px 0;
        }
        .play-btn {
            width: 72px; height: 72px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; display: grid; place-items: center; cursor: pointer;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(0, 210, 255, 0.1);
            transition: all 0.3s var(--ease-elastic); backdrop-filter: blur(10px);
        }
        .play-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 210, 255, 0.3); }
        .play-btn.ai-listening { animation: ai-pulse-border 2s infinite; border-color: var(--ai-glow); }
        @keyframes ai-pulse-border {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.4); }
            50% { box-shadow: 0 0 20px 5px rgba(0, 242, 255, 0.2); }
        }

        .control-btn {
            background: none; border: none; color: var(--text-sub); cursor: pointer;
            transition: all 0.2s; display: grid; place-items: center;
        }
        .control-btn:hover { color: #fff; transform: scale(1.1); }

        /* Toolbar */
        .toolbar {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid var(--border); padding-top: 20px; gap: 8px;
        }
        .toolbar-group { display: flex; gap: 8px; }
        .pill {
            height: 36px; padding: 0 16px; border-radius: 100px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main); font-size: 0.8rem; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .pill:hover { background: rgba(255,255,255,0.1); }
        .pill.ai-mode {
            background: rgba(0, 210, 255, 0.15); border-color: rgba(0, 210, 255, 0.3); color: var(--ai-glow);
        }

        /* Zen Capsule with AI */
        .phantom-capsule {
            position: fixed; bottom: calc(24px + var(--safe-bottom)); left: 50%;
            transform: translateX(-50%) translateY(200px);
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(40px);
            border: 1px solid rgba(0, 210, 255, 0.2); border-radius: 100px;
            padding: 8px; display: flex; align-items: center; gap: 12px;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: all 0.6s var(--ease-elastic);
        }
        .app-shell.zen ~ .phantom-capsule {
            transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto;
        }
        .capsule-core {
            width: 44px; height: 44px; position: relative; display: grid; place-items: center;
            border-radius: 50%; border: 2px solid rgba(0, 210, 255, 0.3);
        }
        .capsule-ai-indicator {
            position: absolute; inset: -4px; border-radius: 50%;
            border: 2px solid transparent; border-top-color: var(--ai-glow);
            animation: spin 3s linear infinite; opacity: 0; transition: opacity 0.3s;
        }
        .capsule-core.ai-active .capsule-ai-indicator { opacity: 1; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed; top: calc(20px + var(--safe-top)); left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0,0,0,0.9); border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 12px 24px; border-radius: 100px; color: var(--ai-glow);
            font-size: 0.9rem; z-index: 2000; opacity: 0; transition: all 0.4s var(--ease-elastic);
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Puter Integration Specifics */
        .puter-auth-btn {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 8px 16px; border-radius: 100px; cursor: pointer;
            font-size: 0.8rem; display: flex; align-items: center; gap: 8px;
            transition: all 0.3s;
        }
        .puter-auth-btn:hover { background: rgba(255,255,255,0.2); }
        .puter-auth-btn.authenticated { background: rgba(46, 213, 115, 0.2); border-color: rgba(46, 213, 115, 0.4); color: #2ed573; }

        /* Loading State */
        .loading-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 3000; display: none; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
        }
        .loading-overlay.active { display: flex; }
        .loading-spinner {
            width: 40px; height: 40px; border: 3px solid rgba(0, 242, 255, 0.2);
            border-top-color: var(--ai-glow); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <!-- Puter Auth -->
    <button class="puter-auth-btn" id="puter-auth" onclick="togglePuterAuth()">
        <i class="material-icons-round" style="font-size:18px;">account_circle</i>
        <span id="auth-text">连接 Puter</span>
    </button>

    <!-- AI Status -->
    <div class="ai-status" id="ai-status">
        <span class="ai-pulse"></span>
        <span>AI 感知引擎运行中</span>
    </div>

    <!-- Canvas Layers -->
    <canvas id="visualizer"></canvas>
    <canvas id="ai-particles"></canvas>
    <div class="vignette"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <div style="color: var(--ai-glow); font-size: 0.9rem;">AI 正在分析...</div>
    </div>

    <!-- Main App -->
    <main class="app-shell" id="app-shell">
        <div class="lens-card" id="card">
            <!-- AI Insight Bubble -->
            <div class="ai-insight" id="ai-insight">
                正在分析音频特征...
            </div>

            <div class="header">
                <button class="icon-btn" onclick="enterZen()">
                    <i class="material-icons-round">keyboard_arrow_down</i>
                </button>
                <div class="brand">
                    <span class="ai-badge">AI</span> SONORIA
                </div>
                <button class="icon-btn ai-active" id="ai-chat-toggle" onclick="toggleAIChat()">
                    <i class="material-icons-round">psychology</i>
                </button>
            </div>

            <div class="hero-text">
                <div class="mood-indicator" id="mood-indicator">
                    <i class="material-icons-round" style="font-size:14px;">auto_awesome</i>
                    <span id="mood-text">分析中...</span>
                </div>
                <div class="title" id="track-title">导入音乐或连接麦克风</div>
                <div class="artist" id="track-artist">AI 将实时分析音频特征</div>
            </div>

            <!-- AI Chat Drawer -->
            <div class="ai-drawer" id="ai-drawer">
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages">
                        <div class="chat-message ai">
                            我是 Sonoria AI。我可以帮你：<br>
                            • "分析这首歌的情绪"<br>
                            • "生成迷幻视觉"<br>
                            • "推荐相似音乐"<br>
                            • "解释歌词含义"
                        </div>
                    </div>
                    <div class="chat-input-row">
                        <input type="text" class="chat-input" id="chat-input" placeholder="输入指令或提问..." onkeypress="handleChatKey(event)">
                        <button class="chat-send" onclick="sendChat()">
                            <i class="material-icons-round">send</i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="progress-container" id="progress-container">
                <div class="progress-rail"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="time-meta">
                    <span id="curr-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" onclick="playPrev()">
                    <i class="material-icons-round" style="font-size:32px;">skip_previous</i>
                </button>
                <button class="play-btn" id="main-play" onclick="togglePlay()">
                    <i class="material-icons-round" style="font-size:32px;">play_arrow</i>
                </button>
                <button class="control-btn" onclick="playNext()">
                    <i class="material-icons-round" style="font-size:32px;">skip_next</i>
                </button>
            </div>

            <div class="toolbar">
                <button class="pill" onclick="document.getElementById('file-input').click()">
                    <i class="material-icons-round">add</i> 导入
                </button>
                <div class="toolbar-group">
                    <button class="pill ai-mode" onclick="analyzeCurrentTrack()">
                        <i class="material-icons-round">analytics</i> 分析
                    </button>
                    <button class="icon-btn" onclick="toggleMic()" id="mic-btn">
                        <i class="material-icons-round">mic</i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Zen Capsule -->
    <div class="phantom-capsule" id="capsule" onclick="exitZen()">
        <div class="capsule-core" id="capsule-core">
            <div class="capsule-ai-indicator"></div>
            <i class="material-icons-round" style="color:#fff;">graphic_eq</i>
        </div>
        <div style="width:120px;">
            <div style="font-size:0.85rem;font-weight:600;color:#fff;" id="capsule-title">就绪</div>
        </div>
        <button class="icon-btn" onclick="event.stopPropagation(); togglePlay()" style="color:#fff;">
            <i class="material-icons-round" id="capsule-play-icon">play_arrow</i>
        </button>
    </div>

    <div class="toast" id="toast">Puter 模式离线运行</div>
    <input type="file" id="file-input" accept="audio/mp3,audio/m4a,audio/wav,audio/flac,audio/*" multiple="" style="display:none" onchange="handleFiles(this.files)">

    <script>
        // ==========================================
        // Sonoria AI Core - Optimized Version
        // ==========================================

        const AppState = {
            playing: false,
            aiActive: false,
            zenMode: false,
            currentTrack: null,
            audioContext: null,
            analyser: null,
            source: null,
            audioEl: null,
            playlist: [],
            currentIndex: 0,
            aiHistory: [],
            puterReady: false,
            animationFrameId: null,  // 优化：动画帧ID管理
            visualParams: {
                hue: 0,
                energy: 0,
                mood: 'neutral',
                complexity: 0.5,
                colorPalette: ['#00d2ff', '#8E2DE2']
            }
        };

        // ==========================================
        // Audio Analysis Engine - 优化版
        // ==========================================

        class AudioAnalyzer {
            constructor() {
                this.features = {
                    bpm: 120,
                    energy: 0,
                    spectralCentroid: 0,
                    onsetDetected: false
                };
                this.history = [];
                this.lastOnset = 0;
                this.maxHistorySize = 100;  // 优化：限制历史数据大小
            }

            analyze() {
                if (!AppState.analyser) return;

                const dataArray = new Uint8Array(AppState.analyser.frequencyBinCount);
                AppState.analyser.getByteFrequencyData(dataArray);

                // Calculate energy (bass)
                let bass = 0, treble = 0;
                for (let i = 0; i < 20; i++) bass += dataArray[i];
                for (let i = 100; i < 200; i++) treble += dataArray[i];

                const totalEnergy = bass / 20 / 255;
                this.features.energy = totalEnergy;
                this.features.spectralCentroid = this.calculateSpectralCentroid(dataArray);

                // Onset detection for beat
                if (totalEnergy > 0.6 && Date.now() - this.lastOnset > 300) {
                    this.features.onsetDetected = true;
                    this.lastOnset = Date.now();
                    this.onBeat();
                } else {
                    this.features.onsetDetected = false;
                }

                // 优化：限制历史数据大小，防止内存泄漏
                this.history.push({...this.features});
                if (this.history.length > this.maxHistorySize) {
                    this.history.shift();
                }

                return this.features;
            }

            calculateSpectralCentroid(data) {
                let numerator = 0, denominator = 0;
                for (let i = 0; i < data.length; i++) {
                    numerator += i * data[i];
                    denominator += data[i];
                }
                return denominator === 0 ? 0 : numerator / denominator;
            }

            onBeat() {
                // Trigger visual effects on beat
                AppState.visualParams.energy = 1.0;
                const capsuleCore = document.getElementById('capsule-core');
                if (capsuleCore) {
                    capsuleCore.style.transform = 'scale(1.2)';
                    setTimeout(() => {
                        capsuleCore.style.transform = 'scale(1)';
                    }, 100);
                }
            }

            // 优化：清理历史数据
            clearHistory() {
                this.history = [];
            }
        }

        const analyzer = new AudioAnalyzer();

        // ==========================================
        // Generative Visualizer - 性能优化版
        // ==========================================

        class GenerativeVisualizer {
            constructor() {
                this.canvas = document.getElementById('visualizer');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());

                // AI-influenced parameters
                this.params = {
                    particleCount: 100,
                    connectionDistance: 100,
                    turbulence: 0.5,
                    colorShift: 0
                };

                // 优化：空间分区网格
                this.gridSize = 50;
                this.grid = {};
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            updateParams(aiAnalysis) {
                if (!aiAnalysis) return;

                // Adjust visual params based on AI mood analysis
                switch(aiAnalysis.mood) {
                    case 'energetic':
                        this.params.particleCount = 150;
                        this.params.turbulence = 0.8;
                        break;
                    case 'calm':
                        this.params.particleCount = 60;
                        this.params.turbulence = 0.2;
                        break;
                    case 'intense':
                        this.params.particleCount = 200;
                        this.params.turbulence = 1.2;
                        break;
                }

                AppState.visualParams.colorPalette = aiAnalysis.colorScheme || ['#00d2ff', '#8E2DE2'];
            }

            // 优化：空间分区算法 - 将O(n²)降为O(n)
            buildGrid() {
                this.grid = {};
                this.particles.forEach((p, i) => {
                    const gx = Math.floor(p.x / this.gridSize);
                    const gy = Math.floor(p.y / this.gridSize);
                    const key = `${gx},${gy}`;
                    if (!this.grid[key]) this.grid[key] = [];
                    this.grid[key].push(i);
                });
            }

            getNearbyParticles(x, y) {
                const nearby = [];
                const gx = Math.floor(x / this.gridSize);
                const gy = Math.floor(y / this.gridSize);

                // 检查周围9个格子
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const key = `${gx + dx},${gy + dy}`;
                        if (this.grid[key]) {
                            nearby.push(...this.grid[key]);
                        }
                    }
                }
                return nearby;
            }

            render() {
                if (!AppState.playing) return;

                const features = analyzer.analyze();
                const energy = features.energy;

                // Fade effect
                this.ctx.fillStyle = 'rgba(0,0,0,0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // AI-driven color
                AppState.visualParams.hue += 0.5 + energy;
                const [c1, c2] = AppState.visualParams.colorPalette;

                // Dynamic visualization based on AI mode
                this.renderNeuralNetwork(features, c1, c2);

                // Update global energy decay
                AppState.visualParams.energy *= 0.95;
            }

            renderNeuralNetwork(features, color1, color2) {
                const { width, height } = this.canvas;
                const cx = width / 2, cy = height / 2;
                const count = this.params.particleCount;

                // Generate nodes based on frequency data
                while (this.particles.length < count) {
                    this.particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: 0, vy: 0,
                        size: Math.random() * 3 + 1
                    });
                }

                // Trim excess particles
                while (this.particles.length > count) {
                    this.particles.pop();
                }

                const data = new Uint8Array(AppState.analyser.frequencyBinCount);
                AppState.analyser.getByteFrequencyData(data);

                // 优化：构建空间分区网格
                this.buildGrid();

                this.particles.forEach((p, i) => {
                    // Movement influenced by audio and AI turbulence
                    const freq = data[i % data.length] / 255;
                    const angle = (i / count) * Math.PI * 2 + AppState.visualParams.hue * 0.01;
                    const radius = 100 + freq * 200;

                    const targetX = cx + Math.cos(angle) * radius;
                    const targetY = cy + Math.sin(angle) * radius;

                    p.x += (targetX - p.x) * 0.05 * this.params.turbulence;
                    p.y += (targetY - p.y) * 0.05 * this.params.turbulence;

                    // Draw node
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size * (1 + features.energy), 0, Math.PI * 2);
                    this.ctx.fillStyle = color1;
                    this.ctx.fill();

                    // 优化：使用空间分区查找邻近粒子
                    const nearbyIndices = this.getNearbyParticles(p.x, p.y);
                    const maxConnections = 10;  // 限制每粒子的最大连接数

                    nearbyIndices.slice(0, maxConnections).forEach(j => {
                        if (j <= i) return;  // 避免重复连接

                        const p2 = this.particles[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);

                        if (dist < this.params.connectionDistance * (1 + features.energy)) {
                            this.ctx.beginPath();
                            this.ctx.moveTo(p.x, p.y);
                            this.ctx.lineTo(p2.x, p2.y);
                            const alpha = (1 - dist / this.params.connectionDistance) * 0.5;
                            this.ctx.strokeStyle = color2 + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                            this.ctx.stroke();
                        }
                    });
                });
            }

            // 优化：清理粒子
            clearParticles() {
                this.particles = [];
                this.grid = {};
            }
        }

        const viz = new GenerativeVisualizer();

        // ==========================================
        // AI Services - 增强版
        // ==========================================

        class AIService {
            static async analyzeAudio(features) {
                // Check if Puter is available and authenticated
                if (AppState.puterReady && typeof puter !== 'undefined' && puter.auth && puter.auth.isSignedIn()) {
                    try {
                        const prompt = `分析以下音频特征并返回JSON格式：{
                            "mood": "情绪标签(energetic/calm/melancholic/intense)",
                            "colorScheme": ["主色", "辅色"],
                            "description": "一句话描述",
                            "visualStyle": "推荐的视觉风格"
                        }
                        音频特征：BPM估算${features.bpm}, 平均能量${features.energy}, 频谱集中度${features.spectralCentroid}`;

                        const response = await puter.ai.chat(prompt);
                        return JSON.parse(response.message.content);
                    } catch (e) {
                        console.warn('[AI] Puter分析失败，使用本地fallback:', e);
                        return this.localAnalysis(features);
                    }
                }
                return this.localAnalysis(features);
            }

            static localAnalysis(features) {
                // Fallback analysis without API - 优化版
                const moods = ['energetic', 'calm', 'intense', 'melancholic'];
                let mood;
                if (features.energy > 0.7) {
                    mood = 'intense';
                } else if (features.energy > 0.4) {
                    mood = 'energetic';
                } else if (features.energy < 0.2) {
                    mood = 'melancholic';
                } else {
                    mood = 'calm';
                }

                const colors = {
                    energetic: ['#ff006e', '#fb5607'],
                    calm: ['#00d2ff', '#8E2DE2'],
                    intense: ['#ff0000', '#ff8800'],
                    melancholic: ['#3a86ff', '#8338ec']
                };

                return {
                    mood,
                    colorScheme: colors[mood],
                    description: `检测到${mood === 'intense' ? '高强度' : mood === 'energetic' ? '活跃' : mood === 'calm' ? '平静' : '忧郁'}的音乐氛围`,
                    visualStyle: mood
                };
            }

            static async chat(message, context = '') {
                // Check if Puter is available and authenticated
                if (AppState.puterReady && typeof puter !== 'undefined' && puter.auth && puter.auth.isSignedIn()) {
                    try {
                        const systemPrompt = `你是 Sonoria AI，一个懂音乐、艺术和心理学的高级 AI。当前播放：${AppState.currentTrack?.title || '无'}。请简短回答（少于100字）。`;
                        const response = await puter.ai.chat([
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: message }
                        ]);
                        return response.message.content;
                    } catch (e) {
                        console.warn('[AI] Puter对话失败，使用本地fallback:', e);
                        return this.localChatResponse(message);
                    }
                }
                return this.localChatResponse(message);
            }

            static localChatResponse(message) {
                // 优化：增强的本地响应逻辑
                const lower = message.toLowerCase();

                // 情绪/分析类
                if (lower.includes('分析') || lower.includes('情绪') || lower.includes('mood')) {
                    return `正在分析当前音频波形特征...检测到${AppState.visualParams.mood || '平静'}的音乐氛围，建议切换"量子"可视化模式以获得最佳体验。`;
                }

                // 视觉类
                if (lower.includes('视觉') || lower.includes('画面') || lower.includes('visual')) {
                    return '已调整生成参数：增加粒子密度，启用流体动力学模拟，色彩映射基于频谱分析实时生成。';
                }

                // 推荐类
                if (lower.includes('推荐') || lower.includes('recommend') || lower.includes('相似')) {
                    return '基于当前音乐特征，推荐您探索：Porter Robinson的《Virtual Self》、Kavinsky的《Outrun》系列，以及整体Synthwave流派作品。';
                }

                // 歌词类
                if (lower.includes('歌词') || lower.includes('lyrics') || lower.includes('含义')) {
                    return '很抱歉，当前版本暂不支持歌词分析。请连接 Puter 账户以启用完整 AI 能力，包括深度歌词解读和智能推荐。';
                }

                // 控制类
                if (lower.includes('播放') || lower.includes('play')) {
                    playAudio();
                    return '已开始播放';
                }
                if (lower.includes('暂停') || lower.includes('pause') || lower.includes('停止')) {
                    pauseAudio();
                    return '已暂停播放';
                }
                if (lower.includes('禅') || lower.includes('zen')) {
                    enterZen();
                    return '已进入禅模式';
                }

                // 默认回复
                return '我理解了。要解锁完整 AI 能力（包括深度音乐分析、智能推荐、歌词解读），请点击左上角连接 Puter 账户。';
            }

            static async generateArtPrompt(mood) {
                const prompts = {
                    energetic: 'futuristic neon city, cyberpunk, high energy, motion blur, electric blue and magenta',
                    calm: 'underwater bioluminescence, deep ocean, floating particles, cyan and purple gradient, ethereal',
                    intense: 'supernova explosion, fractal flames, red and orange plasma, high contrast, chaotic',
                    melancholic: 'rainy window, bokeh lights, blue monochromatic, slow shutter, nostalgic'
                };
                return prompts[mood] || prompts.calm;
            }
        }

        // ==========================================
        // Puter Integration
        // ==========================================

        async function initPuter() {
            // 等待Puter SDK加载
            let attempts = 0;
            const maxAttempts = 50;  // 5秒超时

            while (typeof puter === 'undefined' && attempts < maxAttempts) {
                await new Promise(r => setTimeout(r, 100));
                attempts++;
            }

            if (typeof puter === 'undefined') {
                console.warn('[Puter] SDK加载超时，使用本地模式');
                return;
            }

            try {
                await puter.init();
                AppState.puterReady = true;
                console.log('[Puter] Initialized');

                // Check auth status
                if (puter.auth.isSignedIn()) {
                    updateAuthUI(true);
                    showToast('已连接到 Puter AI 云');
                }

                // Load saved playlist if any
                loadFromPuterFS();
            } catch (e) {
                console.warn('[Puter] 初始化失败:', e);
                showToast('Puter 模式离线运行');
            }
        }

        function togglePuterAuth() {
            if (!AppState.puterReady || typeof puter === 'undefined') {
                showToast('Puter 不可用，使用本地模式');
                return;
            }

            if (puter.auth.isSignedIn()) {
                puter.auth.signOut();
                updateAuthUI(false);
            } else {
                puter.auth.signIn();
                updateAuthUI(true);
            }
        }

        function updateAuthUI(authed) {
            const btn = document.getElementById('puter-auth');
            const text = document.getElementById('auth-text');
            if (authed) {
                btn.classList.add('authenticated');
                text.textContent = '已连接';
            } else {
                btn.classList.remove('authenticated');
                text.textContent = '连接 Puter';
            }
        }

        async function saveAnalysisToPuter(title, analysis) {
            if (!AppState.puterReady || typeof puter === 'undefined') return;
            try {
                const data = JSON.stringify({ title, analysis, timestamp: new Date().toISOString() });
                await puter.fs.write(`/sonoria_analyses/${Date.now()}.json`, data);
            } catch (e) {
                console.log('保存失败', e);
            }
        }

        async function loadFromPuterFS() {
            if (!AppState.puterReady || typeof puter === 'undefined') return;
            try {
                const files = await puter.fs.readdir('/sonoria_playlist');
                // Implementation for loading saved playlists
            } catch (e) {
                // Directory might not exist
            }
        }

        // ==========================================
        // Chat Interface
        // ==========================================

        function toggleAIChat() {
            const drawer = document.getElementById('ai-drawer');
            drawer.classList.toggle('open');
            if (drawer.classList.contains('open')) {
                setTimeout(() => document.getElementById('chat-input').focus(), 100);
            }
        }

        function handleChatKey(e) {
            if (e.key === 'Enter') sendChat();
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            addChatMessage(message, 'user');

            // Show typing indicator
            const aiStatus = document.getElementById('ai-status');
            aiStatus.classList.add('active');

            try {
                const response = await AIService.chat(message);
                addChatMessage(response, 'ai');

                // Process commands
                processAICommand(message.toLowerCase());
            } catch (e) {
                console.error(e);
                addChatMessage('抱歉，处理请求时出错。', 'ai');
            } finally {
                setTimeout(() => aiStatus.classList.remove('active'), 1000);
            }
        }

        function addChatMessage(text, sender) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `chat-message ${sender}`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function processAICommand(cmd) {
            if (cmd.includes('禅') || cmd.includes('zen')) enterZen();
            if (cmd.includes('分析')) analyzeCurrentTrack();
            if (cmd.includes('停止') || cmd.includes('暂停')) pauseAudio();
            if (cmd.includes('播放')) playAudio();
        }

        // ==========================================
        // Audio Control - 优化版
        // ==========================================

        async function initAudio() {
            if (AppState.audioContext) return;

            AppState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            AppState.analyser = AppState.audioContext.createAnalyser();
            AppState.analyser.fftSize = 2048;
            AppState.analyser.smoothingTimeConstant = 0.8;
        }

        async function handleFiles(files) {
            // 显示加载状态
            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.classList.add('active');

            await initAudio();

            const file = files[0];
            if (!file) {
                loadingOverlay.classList.remove('active');
                return;
            }

            AppState.currentTrack = {
                title: file.name.replace(/\.[^/.]+$/, ""),
                file: file
            };

            const url = URL.createObjectURL(file);
            if (AppState.audioEl) {
                AppState.audioEl.pause();
                AppState.audioEl = null;
            }

            AppState.audioEl = new Audio(url);
            AppState.audioEl.onended = () => {
                pauseAudio();
            };

            // Connect to analyzer
            const source = AppState.audioContext.createMediaElementSource(AppState.audioEl);
            source.connect(AppState.analyser);
            AppState.analyser.connect(AppState.audioContext.destination);

            document.getElementById('track-title').textContent = AppState.currentTrack.title;
            document.getElementById('track-artist').textContent = '本地文件';

            // 隐藏加载状态
            loadingOverlay.classList.remove('active');

            playAudio();

            // Auto analyze after 5 seconds
            setTimeout(analyzeCurrentTrack, 5000);
        }

        async function analyzeCurrentTrack() {
            if (!AppState.analyser) return;

            const insight = document.getElementById('ai-insight');
            const moodIndicator = document.getElementById('mood-indicator');
            const moodText = document.getElementById('mood-text');

            insight.textContent = '正在分析音频特征与情绪...';
            insight.classList.add('show');
            moodIndicator.classList.add('active');

            // Show loading
            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.classList.add('active');

            // Collect 3 seconds of analysis
            const samples = [];
            for (let i = 0; i < 30; i++) {
                samples.push(analyzer.analyze());
                await new Promise(r => setTimeout(r, 100));
            }

            const avgEnergy = samples.reduce((a, s) => a + s.energy, 0) / samples.length;
            const features = { energy: avgEnergy, bpm: 128, spectralCentroid: 2000 };

            const analysis = await AIService.analyzeAudio(features);

            // Hide loading
            loadingOverlay.classList.remove('active');

            // Update UI with results
            AppState.visualParams.mood = analysis.mood;
            viz.updateParams(analysis);

            insight.textContent = analysis.description;
            moodText.textContent = analysis.mood.toUpperCase();

            document.getElementById('ai-status').classList.add('active');
            AppState.aiActive = true;

            setTimeout(() => {
                insight.classList.remove('show');
            }, 5000);

            // Save analysis
            saveAnalysisToPuter(AppState.currentTrack.title, analysis);
        }

        function togglePlay() {
            if (!AppState.audioEl) {
                document.getElementById('file-input').click();
                return;
            }

            if (AppState.playing) {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        function playAudio() {
            if (AppState.audioEl) {
                AppState.audioEl.play();
                AppState.playing = true;
                updatePlayButton();
                animate();
                document.getElementById('ai-status').classList.add('active');
            }
        }

        function pauseAudio() {
            if (AppState.audioEl) {
                AppState.audioEl.pause();
                AppState.playing = false;
                updatePlayButton();

                // 优化：正确停止动画循环
                if (AppState.animationFrameId) {
                    cancelAnimationFrame(AppState.animationFrameId);
                    AppState.animationFrameId = null;
                }
            }
        }

        function updatePlayButton() {
            const icon = AppState.playing ? 'pause' : 'play_arrow';
            document.querySelector('#main-play i').textContent = icon;
            document.getElementById('capsule-play-icon').textContent = icon;
        }

        function playNext() { showToast('播放下一首 (示例)'); }
        function playPrev() { showToast('播放上一首 (示例)'); }

        async function toggleMic() {
            await initAudio();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = AppState.audioContext.createMediaStreamSource(stream);
                source.connect(AppState.analyser);
                AppState.playing = true;
                animate();
                document.getElementById('mic-btn').classList.add('ai-active');
                showToast('AI 正在实时聆听环境音');
            } catch (e) {
                showToast('无法访问麦克风');
            }
        }

        // ==========================================
        // Animation Loop - 优化版
        // ==========================================

        function animate() {
            if (!AppState.playing) return;

            viz.render();

            // 优化：保存动画帧ID
            AppState.animationFrameId = requestAnimationFrame(animate);
        }

        // ==========================================
        // UI Helpers
        // ==========================================

        function enterZen() {
            document.getElementById('app-shell').classList.add('zen');
            AppState.zenMode = true;
        }

        function exitZen() {
            document.getElementById('app-shell').classList.remove('zen');
            AppState.zenMode = false;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Progress bar interaction
        document.getElementById('progress-container').addEventListener('click', function(e) {
            if (!AppState.audioEl) return;
            const pct = e.offsetX / this.offsetWidth;
            AppState.audioEl.currentTime = pct * AppState.audioEl.duration;
        });

        // Update progress
        setInterval(() => {
            if (AppState.audioEl && AppState.playing) {
                const pct = AppState.audioEl.currentTime / AppState.audioEl.duration;
                document.getElementById('progress-fill').style.width = (pct * 100) + '%';
                document.getElementById('curr-time').textContent = formatTime(AppState.audioEl.currentTime);
                document.getElementById('total-time').textContent = formatTime(AppState.audioEl.duration || 0);
            }
        }, 100);

        function formatTime(s) {
            if (!s) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        // 优化：页面卸载时清理资源
        window.addEventListener('beforeunload', () => {
            if (AppState.animationFrameId) {
                cancelAnimationFrame(AppState.animationFrameId);
            }
            analyzer.clearHistory();
            viz.clearParticles();
        });

        // Init
        window.addEventListener('load', () => {
            initPuter();

            // Demo mode if no file
            setTimeout(() => {
                if (!AppState.currentTrack) {
                    document.getElementById('track-title').textContent = '导入音乐或连接麦克风';
                    document.getElementById('track-artist').textContent = 'AI 将实时分析音频特征';
                }
            }, 1000);
        });
    </script>
