    <input type="file" id="audio-upload" accept="audio/mp3,audio/wav,audio/m4a,audio/flac,audio/*" multiple>

    <script>
        // 国际化支持
        const i18n = {
            'zh-CN': {
                title: 'Sonoria',
                slogan: '沉浸式音频可视化体验',
                waiting: '等待音频输入',
                instruction: '上传音乐文件或使用麦克风',
                urlPlaceholder: '输入网易云/QQ音乐/B站音频链接',
                parseButton: '解析链接',
                uploadText: '拖放音乐文件到此处或点击上传',
                playlist: '播放列表',
                clearPlaylist: '清空列表',
                performanceMode: '性能模式',
                qualityMode: '高质量模式'
            },
            'en': {
                title: 'Sonoria',
                slogan: 'Immersive Audio Visualization',
                waiting: 'Waiting for audio input',
                instruction: 'Upload music files or use microphone',
                urlPlaceholder: 'Enter Netease/QQ Music/Bilibili audio URL',
                parseButton: 'Parse URL',
                uploadText: 'Drag files here or click to upload',
                playlist: 'Playlist',
                clearPlaylist: 'Clear list',
                performanceMode: 'Performance Mode',
                qualityMode: 'Quality Mode'
            }
        };

        // 切换语言功能
        function setLanguage(lang) {
            document.documentElement.lang = lang;
            const texts = i18n[lang] || i18n['zh-CN'];
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (texts[key]) el.textContent = texts[key];
            });
            
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (texts[key]) el.placeholder = texts[key];
            });
            
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (texts[key]) el.title = texts[key];
            });
            
            // 更新性能模式按钮文本
            const perfBtn = document.getElementById('performance-toggle');
            if (perfBtn.classList.contains('active')) {
                perfBtn.textContent = texts.performanceMode;
            } else {
                perfBtn.textContent = texts.qualityMode;
            }
        }

        class OptimizedVisualizer {
            constructor(canvas, audioContext) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.audioContext = audioContext;
                this.analyser = this.audioContext.createAnalyser();
                
                // 性能优化：根据设备类型设置不同参数
                this.isMobile = window.innerWidth < 768;
                this.fftSize = this.isMobile ? 1024 : 2048;
                this.analyser.fftSize = this.fftSize;
                
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.animationId = null;
                this.isPlaying = false;
                this.mode = 'aurora';
                this.hue = 0;
                this.energy = 0;
                this.particles = [];
                this.waves = [];
                this.lastRender = 0;
                this.performanceMode = localStorage.getItem('performanceMode') === 'true';
                
                // 移动端默认使用性能模式
                if (this.isMobile && localStorage.getItem('performanceMode') === null) {
                    this.performanceMode = true;
                }
                
                // 初始化时清除画布
                this.clearCanvas();
                this.resizeCanvas();
                
                // 使用被动事件监听器优化滚动性能
                window.addEventListener('resize', this.resizeCanvas.bind(this), { passive: true });
                
                // 初始化粒子和波浪
                this.initParticles();
                this.initWaves();
            }

            clearCanvas() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            resizeCanvas() {
                // 防止频繁触发resize导致的性能问题
                if (this.resizeTimeout) clearTimeout(this.resizeTimeout);
                
                this.resizeTimeout = setTimeout(() => {
                    const { innerWidth: width, innerHeight: height } = window;
                    
                    // 仅在尺寸变化时重绘
                    if (this.canvas.width !== width || this.canvas.height !== height) {
                        this.canvas.width = width;
                        this.canvas.height = height;
                        
                        // 重新初始化粒子以适应新尺寸
                        this.initParticles();
                        this.initWaves();
                    }
                }, 100); // 节流处理
            }

            connectAudio(source) {
                try {
                    // 断开已有连接
                    if (this.mediaSource) {
                        this.mediaSource.disconnect();
                    }
                    
                    this.mediaSource = this.audioContext.createMediaElementSource(source);
                    this.mediaSource.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);
                } catch (error) {
                    console.error('音频连接错误:', error);
                }
            }

            connectStream(stream) {
                try {
                    // 断开已有连接
                    if (this.streamSource) {
                        this.streamSource.disconnect();
                    }
                    
                    this.streamSource = this.audioContext.createMediaStreamSource(stream);
                    this.streamSource.connect(this.analyser);
                } catch (error) {
                    console.error('流连接错误:', error);
                }
            }

            setMode(mode) {
                this.mode = mode;
            }

            // 切换性能模式
            togglePerformanceMode(enable) {
                this.performanceMode = enable;
                localStorage.setItem('performanceMode', enable);
                
                // 根据性能模式调整参数
                this.fftSize = enable ? 512 : (this.isMobile ? 1024 : 2048);
                this.analyser.fftSize = this.fftSize;
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                
                // 重新初始化粒子系统
                this.initParticles();
            }

            initParticles() {
                // 性能模式减少粒子数量
                const particleCount = this.performanceMode ? 60 : 120;
                this.particles = [];
                
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        size: Math.random() * 2.5 + 1,
                        opacity: Math.random() * 0.5 + 0.3,
                        baseSize: Math.random() * 2.5 + 1
                    });
                }
            }

            initWaves() {
                this.waves = [];
                // 性能模式减少波浪层数
                const waveCount = this.performanceMode ? 2 : 4;
                
                for (let i = 0; i < waveCount; i++) {
                    this.waves.push({
                        amplitude: 0,
                        frequency: 0.01 + i * 0.005,
                        phase: 0,
                        y: this.canvas.height / 2 + (i - 1.5) * 50
                    });
                }
            }

            getBandAverage(start, end) {
                let sum = 0;
                const count = Math.min(end, this.dataArray.length - 1) - start + 1;
                if (count <= 0) return 0;
                
                for (let i = start; i <= Math.min(end, this.dataArray.length - 1); i++) {
                    sum += this.dataArray[i] || 0;
                }
                return sum / count;
            }

            animate(timestamp) {
                if (!this.isPlaying) return;
                
                // 控制帧率以提高性能
                const targetFps = this.performanceMode ? 30 : 60;
                if (timestamp - this.lastRender < 1000 / targetFps) {
                    this.animationId = requestAnimationFrame(this.animate.bind(this));
                    return;
                }
                this.lastRender = timestamp;
                
                // 获取音频数据
                this.analyser.getByteFrequencyData(this.dataArray);
                
                // 计算能量值
                this.energy = this.getBandAverage(0, 10) / 255;
                
                // 根据当前模式渲染可视化
                this.renderVisualization();
                
                // 更新色调
                this.hue = (this.hue + 0.5) % 360;
                
                this.animationId = requestAnimationFrame(this.animate.bind(this));
            }
            
            renderVisualization() {
                // 清除画布
                this.ctx.fillStyle = 'rgba(10, 10, 20, 0.08)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 根据当前模式渲染不同的可视化效果
                switch(this.mode) {
                    case 'aurora':
                        this.renderAurora();
                        break;
                    case 'cosmic':
                        this.renderCosmic();
                        break;
                    case 'neural':
                        this.renderNeural();
                        break;
                    case 'liquid':
                        this.renderLiquid();
                        break;
                    case 'quantum':
                        this.renderQuantum();
                        break;
                }
            }
            
            renderAurora() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const maxRadius = Math.min(centerX, centerY) * 0.7;
                
                // 性能模式减少绘制点数量
                const step = this.performanceMode ? 8 : 4;
                
                // 绘制频谱环
                for (let i = 0; i < this.dataArray.length; i += step) {
                    const value = this.dataArray[i] || 0;
                    const percent = value / 255;
                    const radius = percent * maxRadius;
                    const angle = (i / this.dataArray.length) * Math.PI * 2;
                    
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 1.5 + percent * 3, 0, Math.PI * 2);
                    this.ctx.fillStyle = `hsla(${this.hue + i * 2}, 80%, 60%, ${0.4 + percent * 0.6})`;
                    this.ctx.fill();
                }
                
                // 绘制中心脉冲
                const pulseRadius = maxRadius * 0.15 + this.energy * maxRadius * 0.25;
                const gradient = this.ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, pulseRadius);
                gradient.addColorStop(0, `hsla(${this.hue}, 85%, 65%, 0.8)`);
                gradient.addColorStop(1, `hsla(${this.hue + 60}, 85%, 65%, 0)`);
                
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, pulseRadius, 0, Math.PI * 2);
                this.ctx.fillStyle = gradient;
                this.ctx.fill();
            }
            
            renderCosmic() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                // 绘制粒子
                this.particles.forEach(p => {
                    // 粒子运动
                    p.x += p.vx * (1 + this.energy);
                    p.y += p.vy * (1 + this.energy);
                    
                    // 边界检查
                    if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;
                    
                    // 粒子大小和透明度受音频影响
                    p.size = p.baseSize + this.energy * 4;
                    p.opacity = 0.3 + this.energy * 0.7;
                    
                    // 绘制粒子
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `hsla(${this.hue + p.size * 10}, 75%, 70%, ${p.opacity})`;
                    this.ctx.fill();
                });
                
                // 绘制中心星体
                const starRadius = 40 + this.energy * 40;
                const starGradient = this.ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, starRadius);
                starGradient.addColorStop(0, `hsla(${this.hue}, 100%, 80%, 0.9)`);
                starGradient.addColorStop(1, `hsla(${this.hue + 120}, 100%, 60%, 0.1)`);
                
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, starRadius, 0, Math.PI * 2);
                this.ctx.fillStyle = starGradient;
                this.ctx.fill();
            }
            
            renderNeural() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                // 绘制粒子
                this.particles.forEach((p, i) => {
                    // 粒子运动
                    p.x += p.vx * (1 + this.energy * 0.5);
                    p.y += p.vy * (1 + this.energy * 0.5);
                    
                    // 边界检查
                    if (p.x < 0) p.x = this.canvas.width;
                    if (p.x > this.canvas.width) p.x = 0;
                    if (p.y < 0) p.y = this.canvas.height;
                    if (p.y > this.canvas.height) p.y = 0;
                    
                    // 粒子大小和透明度受音频影响
                    p.size = p.baseSize + this.energy * 2.5;
                    p.opacity = 0.3 + this.energy * 0.7;
                    
                    // 绘制粒子
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `hsla(${this.hue + i * 2}, 75%, 70%, ${p.opacity})`;
                    this.ctx.fill();
                    
                    // 性能模式减少连接线
                    if (!this.performanceMode) {
                        // 绘制连接线
                        this.particles.slice(i + 1).forEach(p2 => {
                            const dx = p.x - p2.x;
                            const dy = p.y - p2.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            
                            if (distance < 120) {
                                this.ctx.beginPath();
                                this.ctx.moveTo(p.x, p.y);
                                this.ctx.lineTo(p2.x, p2.y);
                                this.ctx.strokeStyle = `hsla(${this.hue}, 60%, 60%, ${0.25 * (1 - distance / 120)})`;
                                this.ctx.lineWidth = 0.8;
                                this.ctx.stroke();
                            }
                        });
                    }
                });
            }
            
            renderLiquid() {
                // 绘制波浪
                this.waves.forEach((wave, i) => {
                    wave.amplitude = 25 + this.energy * 80;
                    wave.phase += 0.02 + this.energy * 0.04;
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, wave.y);
                    
                    // 性能模式减少采样点
                    const step = this.performanceMode ? 10 : 5;
                    
                    for (let x = 0; x < this.canvas.width; x += step) {
                        const y = wave.y + Math.sin(x * wave.frequency + wave.phase) * wave.amplitude;
                        this.ctx.lineTo(x, y);
                    }
                    
                    this.ctx.lineTo(this.canvas.width, this.canvas.height);
                    this.ctx.lineTo(0, this.canvas.height);
                    this.ctx.closePath();
                    
                    const gradient = this.ctx.createLinearGradient(0, wave.y - 40, 0, wave.y + 40);
                    gradient.addColorStop(0, `hsla(${this.hue + i * 30}, 80%, 60%, 0.6)`);
                    gradient.addColorStop(1, `hsla(${this.hue + i * 30 + 60}, 80%, 60%, 0.15)`);
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.fill();
                });
            }
            
            renderQuantum() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                // 绘制量子轨迹
                this.particles.forEach(p => {
                    // 粒子运动
                    p.x += p.vx * (1 + this.energy);
                    p.y += p.vy * (1 + this.energy);
                    
                    // 边界检查
                    if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;
                    
                    // 绘制轨迹
                    this.ctx.beginPath();
                    this.ctx.moveTo(p.x, p.y);
                    this.ctx.lineTo(p.x + p.vx * 8, p.y + p.vy * 8);
                    this.ctx.strokeStyle = `hsla(${this.hue}, 80%, 70%, 0.6)`;
                    this.ctx.lineWidth = 0.8 + this.energy * 2.5;
                    this.ctx.stroke();
                    
                    // 绘制粒子
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, 1.5 + this.energy * 4, 0, Math.PI * 2);
                    this.ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, 0.8)`;
                    this.ctx.fill();
                });
                
                // 绘制中心能量场
                const fieldRadius = 60 + this.energy * 60;
                const fieldGradient = this.ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, fieldRadius);
                fieldGradient.addColorStop(0, `hsla(${this.hue}, 100%, 80%, 0.7)`);
                fieldGradient.addColorStop(0.5, `hsla(${this.hue + 60}, 100%, 70%, 0.3)`);
                fieldGradient.addColorStop(1, `hsla(${this.hue + 120}, 100%, 60%, 0)`);
                
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, fieldRadius, 0, Math.PI * 2);
                this.ctx.fillStyle = fieldGradient;
                this.ctx.fill();
            }

            start() {
                if (!this.isPlaying) {
                    this.isPlaying = true;
                    this.animationId = requestAnimationFrame(this.animate.bind(this));
                }
            }

            stop() {
                this.isPlaying = false;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
            }

            // 清理资源
            destroy() {
                this.stop();
                this.clearCanvas();
                window.removeEventListener('resize', this.resizeCanvas.bind(this));
                this.particles = [];
                this.waves = [];
            }
        }

        // 音频链接解析功能 - 增强版
        async function parseAudioUrl(url) {
            showLoading(true);
            
            try {
                // 简单的URL解析模拟（实际项目中需要后端支持）
                if (url.includes('music.163.com')) {
                    // 模拟网易云音乐解析
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    showNotification('网易云音乐链接解析成功');
                    return {
                        title: '网易云音乐示例',
                        url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' // 实际可用的测试音频
                    };
                } else if (url.includes('qq.com')) {
                    // 模拟QQ音乐解析
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    showNotification('QQ音乐链接解析成功');
                    return {
                        title: 'QQ音乐示例',
                        url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' // 实际可用的测试音频
                    };
                } else if (url.includes('bilibili.com')) {
                    // 模拟B站解析
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    showNotification('B站音频解析成功');
                    return {
                        title: 'B站音频示例',
                        url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' // 实际可用的测试音频
                    };
                } else if (url.startsWith('http') && (url.endsWith('.mp3') || url.endsWith('.wav') || url.endsWith('.flac') || url.endsWith('.m4a'))) {
                    // 直接可播放的音频URL
                    showNotification('音频URL解析成功');
                    const fileName = url.split('/').pop().split('?')[0];
                    return {
                        title: fileName,
                        url: url
                    };
                }
                
                throw new Error('不支持的链接类型');
            } catch (error) {
                console.error('音频解析错误:', error);
                showNotification(`解析失败: ${error.message}`);
                return null;
            } finally {
                showLoading(false);
            }
        }

        // 拖拽排序辅助函数 - 增强版
        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.playlist-item:not(.dragging)')];
            
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // 显示加载状态
        function showLoading(show) {
            let loader = document.getElementById('loading-indicator');
            
            if (show) {
                if (!loader) {
                    loader = document.createElement('div');
                    loader.id = 'loading-indicator';
                    loader.innerHTML = `<div class="loader-spinner"></div><span style="margin-left:10px;">加载中...</span>`;
                    document.body.appendChild(loader);
                }
            } else {
                if (loader) {
                    document.body.removeChild(loader);
                }
            }
        }

        // 显示通知
        function showNotification(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            
            clearTimeout(status.dataset.timeout);
            status.dataset.timeout = setTimeout(() => {
                if (status.textContent === message) {
                    status.textContent = '';
                }
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('visualizer');
            const playerCard = document.getElementById('player-card');
            const uploadArea = document.getElementById('upload-area');
            const audioUpload = document.getElementById('audio-upload');
            const playToggle = document.getElementById('play-toggle');
            const playlistToggle = document.getElementById('playlist-toggle');
            const uploadButton = document.getElementById('upload-button');
            const micToggle = document.getElementById('mic-toggle');
            const clearPlaylist = document.getElementById('clear-playlist');
            const prevButton = document.getElementById('prev-button');
            const nextButton = document.getElementById('next-button');
            const closePlaylist = document.getElementById('close-playlist');
            const progressBar = document.getElementById('progress');
            const progressBarContainer = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const totalTimeEl = document.getElementById('total-time');
            const trackTitle = document.getElementById('track-title');
            const trackArtist = document.getElementById('track-artist');
            const playlistSection = document.getElementById('playlist-section');
            const playlistItems = document.getElementById('playlist-items');
            const themeButtons = document.querySelectorAll('.theme-button');
            const status = document.getElementById('status');
            const onboardingModal = document.getElementById('onboarding-modal');
            const closeModal = document.getElementById('close-modal');
            const urlInput = document.getElementById('url-input');
            const parseButton = document.getElementById('parse-button');
            const languageSwitcher = document.getElementById('language-switcher');
            const performanceToggle = document.getElementById('performance-toggle');

            let audioContext = null;
            let visualizer = null;
            let audioElement = null;
            let isPlaying = false;
            let isMicActive = false;
            let playlist = [];
            let currentTrack = 0;
            let currentStream = null;
            let isUserInteracted = false; // 标记用户是否已交互

            // 初始化语言
            const userLang = navigator.language.includes('zh') ? 'zh-CN' : 'en';
            setLanguage(userLang);

            // 确保在用户首次交互后初始化音频上下文（解决浏览器自动播放限制）
            function initAudioContext() {
                if (!audioContext && isUserInteracted) {
                    try {
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        visualizer = new OptimizedVisualizer(canvas, audioContext);
                        
                        // 同步性能模式按钮状态
                        if (visualizer.performanceMode) {
                            performanceToggle.classList.add('active');
                            performanceToggle.textContent = i18n[userLang].performanceMode;
                        } else {
                            performanceToggle.textContent = i18n[userLang].qualityMode;
                        }
                        
                        console.log('音频上下文初始化成功');
                    } catch (error) {
                        console.error('音频上下文初始化失败:', error);
                        showNotification('音频初始化失败，请刷新页面重试');
                    }
                }
            }

            // 标记用户交互
            function markUserInteraction() {
                if (!isUserInteracted) {
                    isUserInteracted = true;
                    initAudioContext(); // 尝试初始化音频上下文
                }
            }

            // 为所有交互元素添加用户交互标记
            document.querySelectorAll('button, .upload-area, .progress-bar, .url-input').forEach(el => {
                el.addEventListener('click', markUserInteraction);
                el.addEventListener('touchstart', markUserInteraction, { once: true });
            });

            // 音频设置函数 - 增强版
            function setupAudio(source, isUrl = false, isMic = false) {
                // 确保用户已交互
                if (!isUserInteracted) {
                    showNotification('请先点击界面任意位置激活音频功能');
                    return;
                }
                
                // 确保音频上下文已初始化
                initAudioContext();
                if (!audioContext) return;
                
                if (isMic) {
                    try {
                        visualizer.connectStream(source);
                        isPlaying = true;
                        currentStream = source;
                        showNotification('正在收听麦克风输入');
                        playToggle.innerHTML = '<i class="material-icons">pause</i>';
                        trackTitle.textContent = '麦克风输入';
                        trackArtist.textContent = i18n[document.documentElement.lang].instruction.split('或')[1].trim();
                        visualizer.start();
                        return;
                    } catch (error) {
                        console.error('麦克风设置失败:', error);
                        showNotification('麦克风设置失败');
                        return;
                    }
                }

                if (audioElement) {
                    audioElement.pause();
                    if (audioElement.src.startsWith('blob:')) {
                        URL.revokeObjectURL(audioElement.src); // 释放blob资源
                    }
                }
                
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                    isMicActive = false;
                    micToggle.classList.remove('active');
                }

                // 处理URL源
                if (isUrl) {
                    audioElement = new Audio(source.url);
                    trackTitle.textContent = source.title;
                    trackArtist.textContent = '网络音频';
                } else {
                    // 处理文件源
                    audioElement = new Audio(URL.createObjectURL(source));
                    trackTitle.textContent = source.name.replace(/\.[^/.]+$/, "");
                    trackArtist.textContent = '本地文件';
                }

                visualizer.connectAudio(audioElement);

                // 预加载元数据
                audioElement.load();
                
                audioElement.addEventListener('loadedmetadata', function() {
                    totalTimeEl.textContent = formatTime(audioElement.duration);
                    // 更新播放列表中的时长信息
                    playlist.forEach((item, index) => {
                        if (index === currentTrack) {
                            item.duration = formatTime(audioElement.duration);
                        }
                    });
                    updatePlaylistDisplay();
                });

                audioElement.addEventListener('timeupdate', function() {
                    updateProgress();
                    currentTimeEl.textContent = formatTime(audioElement.currentTime);
                });

                audioElement.addEventListener('ended', function() {
                    playNext();
                });

                // 错误处理增强
                audioElement.addEventListener('error', function() {
                    console.error('音频播放错误:', audioElement.error);
                    const errorMessages = {
                        1: '音频加载中断',
                        2: '音频格式不支持',
                        3: '音频解码失败',
                        4: '音频播放中断'
                    };
                    showNotification(`播放失败: ${errorMessages[audioElement.error.code] || '未知错误'}`);
                    showLoading(false);
                });

                // 网络错误处理
                audioElement.addEventListener('abort', function() {
                    console.error('音频加载被中止');
                    showNotification('音频加载被中止');
                    showLoading(false);
                });

                audioElement.addEventListener('stalled', function() {
                    console.error('音频加载停滞');
                    showNotification('网络不稳定，音频加载停滞');
                });

                showLoading(true);
                audioElement.play().then(() => {
                    isPlaying = true;
                    playToggle.innerHTML = '<i class="material-icons">pause</i>';
                    showNotification(`正在播放: ${trackTitle.textContent}`);
                    visualizer.start();
                }).catch(error => {
                    console.error('播放失败:', error);
                    showNotification('播放失败，请点击播放按钮重试');
                }).finally(() => {
                    showLoading(false);
                });
            }

            function updateProgress() {
                if (audioElement && !isNaN(audioElement.duration) && isFinite(audioElement.duration)) {
                    const progress = (audioElement.currentTime / audioElement.duration) * 100;
                    progressBar.style.width = `${progress}%`;
                }
            }

            function formatTime(seconds) {
                if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            function playPrevious() {
                if (playlist.length > 1) {
                    currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
                    const track = playlist[currentTrack];
                    setupAudio(track.isUrl ? track.file : track.file, track.isUrl);
                    updatePlaylistDisplay();
                } else {
                    showNotification('播放列表中没有其他歌曲');
                }
            }

            function playNext() {
                if (playlist.length > 1) {
                    currentTrack = (currentTrack + 1) % playlist.length;
                    const track = playlist[currentTrack];
                    setupAudio(track.isUrl ? track.file : track.file, track.isUrl);
                    updatePlaylistDisplay();
                } else {
                    // 列表中只有一首歌时，播放结束后停止
                    if (audioElement) {
                        audioElement.pause();
                        audioElement.currentTime = 0;
                        isPlaying = false;
                        playToggle.innerHTML = '<i class="material-icons">play_arrow</i>';
                        if (visualizer) visualizer.stop();
                    }
                    showNotification('已播放到列表末尾');
                }
            }

            function resetPlayerUI() {
                if (audioElement) {
                    audioElement.pause();
                    if (audioElement.src.startsWith('blob:')) {
                        URL.revokeObjectURL(audioElement.src); // 释放blob资源
                    }
                    audioElement = null;
                }
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }
                isPlaying = false;
                isMicActive = false;
                micToggle.classList.remove('active');
                playToggle.innerHTML = '<i class="material-icons">play_arrow</i>';
                trackTitle.textContent = i18n[document.documentElement.lang].waiting;
                trackArtist.textContent = i18n[document.documentElement.lang].instruction;
                progressBar.style.width = '0%';
                currentTimeEl.textContent = '0:00';
                totalTimeEl.textContent = '0:00';
                if (visualizer) visualizer.stop();
            }

            // 播放列表显示和拖拽排序 - 增强版
            function updatePlaylistDisplay() {
                playlistItems.innerHTML = '';
                
                if (playlist.length === 0) {
                    playlistItems.innerHTML = `
                        <div style="text-align:center;padding:20px;color:var(--text-secondary);">
                            ${i18n[document.documentElement.lang].playlist}为空
                        </div>
                    `;
                    return;
                }
                
                playlist.forEach((item, index) => {
                    const isUrl = item.isUrl;
                    const file = isUrl ? item.file : item.file;
                    
                    const duration = item.duration || '--:--';
                    
                    const element = document.createElement('div');
                    element.className = `playlist-item ${index === currentTrack ? 'active' : ''}`;
                    element.setAttribute('draggable', true);
                    element.innerHTML = `
                        <i class="material-icons playlist-item-icon">${isUrl ? 'cloud' : 'music_note'}</i>
                        <div class="playlist-item-info">
                            <div class="playlist-item-title">${file.title || file.name.replace(/\.[^/.]+$/, "")}</div>
                            <div class="playlist-item-artist">${isUrl ? '网络音频' : '本地文件'}</div>
                        </div>
                        <div class="playlist-item-duration">${duration}</div>
                        <i class="material-icons playlist-item-delete" data-index="${index}">delete</i>
                    `;
                    
                    element.addEventListener('click', () => {
                        currentTrack = index;
                        setupAudio(isUrl ? file : file, isUrl);
                        updatePlaylistDisplay();
                    });
                    
                    // 删除按钮事件 - 防止冒泡
                    const deleteBtn = element.querySelector('.playlist-item-delete');
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const idx = parseInt(deleteBtn.dataset.index);
                        // 保存要删除的元素信息
                        const wasCurrent = idx === currentTrack;
                        const itemToRemove = playlist[idx];
                        
                        // 释放资源
                        if (!itemToRemove.isUrl && itemToRemove.file) {
                            if (audioElement && audioElement.src.startsWith('blob:') && 
                                itemToRemove.file.name === audioElement.src.split('/').pop()) {
                                URL.revokeObjectURL(audioElement.src);
                            }
                        }
                        
                        playlist.splice(idx, 1);
                        
                        if (wasCurrent) {
                            if (playlist.length > 0) {
                                currentTrack = Math.min(currentTrack, playlist.length - 1);
                                const track = playlist[currentTrack];
                                setupAudio(track.isUrl ? track.file : track.file, track.isUrl);
                            } else {
                                resetPlayerUI();
                            }
                        } else if (idx < currentTrack) {
                            currentTrack--;
                        }
                        
                        updatePlaylistDisplay();
                        showNotification('已删除歌曲');
                    });
                    
                    // 拖拽排序事件
                    element.addEventListener('dragstart', () => {
                        element.classList.add('dragging');
                    });
                    
                    element.addEventListener('dragend', () => {
                        element.classList.remove('dragging');
                        
                        // 更新播放列表顺序
                        const items = Array.from(playlistItems.querySelectorAll('.playlist-item'));
                        const newPlaylist = [];
                        
                        items.forEach(item => {
                            const index = parseInt(item.querySelector('.playlist-item-delete').dataset.index);
                            newPlaylist.push(playlist[index]);
                        });
                        
                        // 检查当前播放的曲目是否被移动
                        const oldIndex = currentTrack;
                        currentTrack = newPlaylist.findIndex(item => 
                            item === playlist[oldIndex]
                        );
                        
                        playlist = newPlaylist;
                        updatePlaylistDisplay();
                    });
                    
                    playlistItems.appendChild(element);
                });
                
                // 拖拽排序目标事件
                playlistItems.addEventListener('dragover', e => {
                    e.preventDefault();
                    const afterElement = getDragAfterElement(playlistItems, e.clientY);
                    const draggable = document.querySelector('.dragging');
                    
                    if (draggable && afterElement !== draggable) {
                        if (afterElement == null) {
                            playlistItems.appendChild(draggable);
                        } else {
                            playlistItems.insertBefore(draggable, afterElement);
                        }
                    }
                });
            }

            function togglePlaylist() {
                playlistSection.classList.toggle('expanded');
                
                // 动态计算最大高度
                if (playlistSection.classList.contains('expanded')) {
                    // 修复展开动画不流畅问题
                    setTimeout(() => {
                        playlistSection.style.maxHeight = `${300}px`;
                    }, 10);
                } else {
                    playlistSection.style.maxHeight = '0';
                }
            }

            // 初始化引导模态框
            if (!localStorage.getItem('sonoriaOnboarded')) {
                onboardingModal.classList.add('show');
                localStorage.setItem('sonoriaOnboarded', 'true');
            }

            // 事件监听器
            uploadButton.addEventListener('click', () => {
                markUserInteraction();
                audioUpload.click();
            });
            
            uploadArea.addEventListener('click', () => {
                markUserInteraction();
                audioUpload.click();
            });

            // 拖放上传增强
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
                uploadArea.style.borderColor = 'rgba(102, 126, 234, 0.8)';
                uploadArea.style.background = 'rgba(102, 126, 234, 0.12)';
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
                uploadArea.style.borderColor = 'var(--border-light)';
                uploadArea.style.background = 'transparent';
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                uploadArea.style.borderColor = 'var(--border-light)';
                uploadArea.style.background = 'transparent';
                
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    let validFiles = 0;
                    
                    Array.from(files).forEach(file => {
                        if (file.type.startsWith('audio/') || 
                            ['.mp3', '.wav', '.flac', '.m4a', '.aac'].includes(file.name.split('.').pop().toLowerCase())) {
                            
                            if (file.size > 100 * 1024 * 1024) {
                                showNotification(`文件 ${file.name} 过大，需小于100MB`);
                                return;
                            }
                            
                            playlist.push({ file, isUrl: false });
                            validFiles++;
                            
                            if (validFiles === 1 && !isPlaying) {
                                currentTrack = playlist.length - 1;
                                setupAudio(playlist[currentTrack].file, false);
                            }
                        } else {
                            showNotification(`文件 ${file.name} 不是音频文件`);
                        }
                    });
                    
                    if (validFiles > 0) {
                        updatePlaylistDisplay();
                        showNotification(`已添加 ${validFiles} 个音频文件`);
                    }
                }
            });

            audioUpload.addEventListener('change', (e) => {
                const files = e.target.files;
                if (files && files.length > 0) {
                    let validFiles = 0;
                    
                    Array.from(files).forEach(file => {
                        if (file.type.startsWith('audio/') || 
                            ['.mp3', '.wav', '.flac', '.m4a', '.aac'].includes(file.name.split('.').pop().toLowerCase())) {
                            
                            if (file.size > 100 * 1024 * 1024) {
                                showNotification(`文件 ${file.name} 过大，需小于100MB`);
                                return;
                            }
                            
                            playlist.push({ file, isUrl: false });
                            validFiles++;
                            
                            if (validFiles === 1 && !isPlaying) {
                                currentTrack = playlist.length - 1;
                                setupAudio(playlist[currentTrack].file, false);
                            }
                        } else {
                            showNotification(`文件 ${file.name} 不是音频文件`);
                        }
                    });
                    
                    if (validFiles > 0) {
                        updatePlaylistDisplay();
                        showNotification(`已添加 ${validFiles} 个音频文件`);
                    }
                    
                    e.target.value = '';
                }
            });

            // 解析URL按钮事件
            parseButton.addEventListener('click', async () => {
                markUserInteraction();
                const url = urlInput.value.trim();
                if (!url) {
                    showNotification('请输入音频链接');
                    return;
                }
                
                const result = await parseAudioUrl(url);
                if (result) {
                    playlist.push({ 
                        file: result, 
                        isUrl: true,
                        url: result.url
                    });
                    
                    urlInput.value = '';
                    updatePlaylistDisplay();
                    
                    if (!isPlaying) {
                        currentTrack = playlist.length - 1;
                        setupAudio(playlist[currentTrack].file, true);
                    }
                }
            });

            // 按Enter键解析URL
            urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    parseButton.click();
                }
            });

            playToggle.addEventListener('click', () => {
                markUserInteraction();
                
                if (isMicActive) {
                    if (isPlaying) {
                        visualizer.stop();
                        isPlaying = false;
                        playToggle.innerHTML = '<i class="material-icons">play_arrow</i>';
                        showNotification('麦克风输入已暂停');
                    } else {
                        visualizer.start();
                        isPlaying = true;
                        playToggle.innerHTML = '<i class="material-icons">pause</i>';
                        showNotification('正在收听麦克风输入');
                    }
                } else if (audioElement) {
                    if (isPlaying) {
                        audioElement.pause();
                        isPlaying = false;
                        playToggle.innerHTML = '<i class="material-icons">play_arrow</i>';
                        visualizer.stop();
                    } else {
                        showLoading(true);
                        audioElement.play().then(() => {
                            isPlaying = true;
                            playToggle.innerHTML = '<i class="material-icons">pause</i>';
                            visualizer.start();
                        }).catch(error => {
                            console.error('播放失败:', error);
                            showNotification('播放失败，请检查音频文件');
                        }).finally(() => {
                            showLoading(false);
                        });
                    }
                } else if (playlist.length > 0) {
                    currentTrack = 0;
                    const track = playlist[currentTrack];
                    setupAudio(track.isUrl ? track.file : track.file, track.isUrl);
                } else {
                    showNotification('请先上传音乐文件或输入音频链接');
                }
            });

            micToggle.addEventListener('click', async () => {
                markUserInteraction();
                
                if (isMicActive) {
                    isMicActive = false;
                    micToggle.classList.remove('active');
                    if (currentStream) {
                        currentStream.getTracks().forEach(track => track.stop());
                        currentStream = null;
                    }
                    if (visualizer) visualizer.stop();
                    isPlaying = false;
                    playToggle.innerHTML = '<i class="material-icons">play_arrow</i>';
                    showNotification('麦克风已关闭');
                    
                    if (playlist.length > 0) {
                        const track = playlist[currentTrack];
                        trackTitle.textContent = track.file.title || track.file.name.replace(/\.[^/.]+$/, "");
                        trackArtist.textContent = track.isUrl ? '网络音频' : '本地文件';
                    } else {
                        trackTitle.textContent = i18n[document.documentElement.lang].waiting;
                        trackArtist.textContent = i18n[document.documentElement.lang].instruction;
                    }
                } else {
                    try {
                        showLoading(true);
                        const stream = await navigator.mediaDevices.getUserMedia({ 
                            audio: {
                                echoCancellation: true,
                                noiseSuppression: true
                            } 
                        });
                        setupAudio(stream, false, true);
                        isMicActive = true;
                        micToggle.classList.add('active');
                    } catch (err) {
                        console.error('麦克风访问失败:', err);
                        showNotification('麦克风访问被拒绝或不可用');
                    } finally {
                        showLoading(false);
                    }
                }
            });

            clearPlaylist.addEventListener('click', () => {
                markUserInteraction();
                
                // 释放资源
                playlist.forEach(item => {
                    if (!item.isUrl && item.file) {
                        // 释放blob URL
                        if (audioElement && audioElement.src.startsWith('blob:') && 
                            item.file.name === audioElement.src.split('/').pop()) {
                            URL.revokeObjectURL(audioElement.src);
                        }
                    }
                });
                
                playlist = [];
                currentTrack = 0;
                resetPlayerUI();
                updatePlaylistDisplay();
                showNotification('播放列表已清空');
            });

            prevButton.addEventListener('click', () => {
                markUserInteraction();
                playPrevious();
            });

            nextButton.addEventListener('click', () => {
                markUserInteraction();
                playNext();
            });

            playlistToggle.addEventListener('click', () => {
                markUserInteraction();
                togglePlaylist();
            });

            closePlaylist.addEventListener('click', () => {
                markUserInteraction();
                togglePlaylist();
            });

            progressBarContainer.addEventListener('click', (e) => {
                markUserInteraction();
                if (audioElement && !isNaN(audioElement.duration) && isFinite(audioElement.duration)) {
                    const rect = progressBarContainer.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const percentage = x / rect.width;
                    audioElement.currentTime = percentage * audioElement.duration;
                    updateProgress();
                }
            });

            // 移动端进度条触摸支持
            progressBarContainer.addEventListener('touchstart', (e) => {
                markUserInteraction();
                if (audioElement && !isNaN(audioElement.duration) && isFinite(audioElement.duration)) {
                    const rect = progressBarContainer.getBoundingClientRect();
                    const x = e.touches[0].clientX - rect.left;
                    const percentage = x / rect.width;
                    audioElement.currentTime = percentage * audioElement.duration;
                    updateProgress();
                }
                e.preventDefault(); // 防止触摸事件冒泡
            }, { passive: false });

            themeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    markUserInteraction();
                    if (visualizer) {
                        visualizer.setMode(btn.dataset.mode);
                        themeButtons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    }
                });
            });

            // 性能模式切换
            performanceToggle.addEventListener('click', () => {
                markUserInteraction();
                if (visualizer) {
                    const enable = !performanceToggle.classList.contains('active');
                    visualizer.togglePerformanceMode(enable);
                    
                    performanceToggle.classList.toggle('active', enable);
                    const lang = document.documentElement.lang;
                    performanceToggle.textContent = enable 
                        ? i18n[lang].performanceMode 
                        : i18n[lang].qualityMode;
                    
                    showNotification(enable ? '性能模式已开启' : '高质量模式已开启');
                }
            });

            // 语言切换
            languageSwitcher.addEventListener('click', () => {
                markUserInteraction();
                const currentLang = document.documentElement.lang;
                const newLang = currentLang === 'zh-CN' ? 'en' : 'zh-CN';
                setLanguage(newLang);
            });

            closeModal.addEventListener('click', () => {
                markUserInteraction();
                onboardingModal.classList.remove('show');
            });

            // 按钮点击波纹效果
            document.querySelectorAll('.icon-button').forEach(button => {
                if (!['play-toggle', 'mic-toggle', 'prev-button', 'next-button', 'playlist-toggle', 'close-playlist', 'clear-playlist'].includes(button.id)) {
                    button.addEventListener('click', function() {
                        this.classList.add('ripple');
                        setTimeout(() => this.classList.remove('ripple'), 600);
                    });
                }
            });

            // 初始化播放列表显示
            updatePlaylistDisplay();

            // 初始化完成
            showNotification('欢迎使用 Sonoria - 请先点击界面任意位置激活音频功能');
            
            // 窗口关闭时释放资源
            window.addEventListener('beforeunload', () => {
                if (audioElement && audioElement.src.startsWith('blob:')) {
                    URL.revokeObjectURL(audioElement.src);
                }
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                if (visualizer) {
                    visualizer.destroy();
                }
            });
        });
    </script>
</body>
</html>
