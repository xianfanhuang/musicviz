<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonoria Pro - 沉浸式音频可视化体验</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #f093fb;
            --tertiary: #4facfe;
            --accent: #ff6b6b;
            --bg-dark: #0a0a14;
            --bg-card: rgba(255, 255, 255, 0.08);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border-light: rgba(255, 255, 255, 0.15);
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 浅色模式支持 */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-dark: #f5f5f7;
                --bg-card: rgba(0, 0, 0, 0.05);
                --text-primary: rgba(0, 0, 0, 0.9);
                --text-secondary: rgba(0, 0, 0, 0.6);
                --border-light: rgba(0, 0, 0, 0.1);
                --shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            }
            
            .player-card {
                box-shadow: var(--shadow), inset 0 1px 0 rgba(0, 0, 0, 0.05);
            }
            
            .icon-button {
                background: rgba(0, 0, 0, 0.05);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            touch-action: manipulation; /* 优化移动端触摸体验 */
            line-height: 1.6;
        }

        #visualizer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 10, 20, 0.6) 0%, rgba(10, 10, 20, 0.3) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        .player-card {
            background: var(--bg-card);
            backdrop-filter: blur(30px) saturate(180%);
            border-radius: var(--radius-lg);
            padding: 30px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 480px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            max-height: 90vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* 优化iOS滚动 */
        }

        /* 横屏模式优化 */
        @media (orientation: landscape) and (max-height: 500px) {
            .player-card {
                max-width: 90vw;
                display: flex;
                flex-direction: row;
                align-items: center;
                padding: 15px 20px;
                max-height: 90vh;
            }
            
            .logo-section {
                margin-bottom: 0;
                margin-right: 20px;
                flex-shrink: 0;
            }
            
            .upload-area {
                display: none; /* 横屏时隐藏上传区域节省空间 */
            }
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.6);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .logo-circle:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.8);
        }

        .logo-circle::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 70%);
        }

        .logo-icon {
            font-size: 2.2rem;
            color: white;
            z-index: 1;
        }

        .brand {
            text-align: center;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--tertiary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(102, 126, 234, 0.6);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .slogan {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .player-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .track-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: var(--transition);
        }

        .track-artist {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* URL输入区域 */
        .url-input-section {
            margin: 15px 0;
        }

        .url-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            transition: var(--transition);
            -webkit-appearance: none; /* 移除iOS默认样式 */
        }

        .url-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
        }

        .parse-button {
            margin-top: 8px;
            padding: 6px 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            width: 100%;
            -webkit-appearance: none; /* 移除iOS默认样式 */
        }

        .parse-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .progress-section {
            margin: 25px 0;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
            cursor: pointer;
            position: relative;
            touch-action: manipulation;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
            overflow: hidden;
        }

        .progress::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .control-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 25px;
            gap: 15px;
        }

        .icon-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
        }

        .icon-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .icon-button:active {
            transform: translateY(1px);
        }

        .icon-button.active {
            background: rgba(102, 126, 234, 0.25);
            color: #8a7cff;
            box-shadow: 0 0 25px rgba(102, 126, 234, 0.4);
        }

        .icon-button.ripple::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 10%, transparent 10.01%);
            transform: scale(0);
            animation: ripple 0.5s ease-out;
        }

        @keyframes ripple {
            to { transform: scale(2); opacity: 0; }
        }

        .play-button {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .play-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.5);
        }

        .bottom-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .upload-area {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100px;
            border: 2px dashed var(--border-light);
            border-radius: 16px;
            cursor: pointer;
            transition: var(--transition);
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: rgba(102, 126, 234, 0.6);
            background: rgba(102, 126, 234, 0.08);
        }

        .upload-area i {
            font-size: 28px;
            color: var(--text-secondary);
        }

        .upload-text {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .theme-selector {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .theme-button {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            -webkit-tap-highlight-color: transparent;
        }

        .theme-button.active {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.5);
            color: var(--text-primary);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .theme-button:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .playlist-section {
            margin-top: 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .playlist-section.expanded {
            max-height: 300px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* 优化iOS滚动 */
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 12px;
            padding-top: 16px;
        }

        .playlist-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .playlist-controls {
            display: flex;
            gap: 10px;
        }

        .playlist-items {
            max-height: 250px;
            overflow-y: auto;
            padding: 0 12px 12px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .playlist-item.active {
            background: rgba(102, 126, 234, 0.25);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .playlist-item.dragging {
            opacity: 0.5;
            transform: scale(1.02);
            background: rgba(102, 126, 234, 0.15);
        }

        .playlist-item-icon {
            margin-right: 12px;
            color: var(--text-secondary);
        }

        .playlist-item-info {
            flex: 1;
            overflow: hidden;
        }

        .playlist-item-title {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .playlist-item-artist {
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-duration {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-left: 10px;
            font-weight: 500;
        }

        .playlist-item-delete {
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            margin-left: 10px;
            transition: var(--transition);
        }

        .playlist-item-delete:hover {
            color: var(--accent);
        }

        .status {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 20px;
            font-weight: 500;
            transition: var(--transition);
        }

        input[type="file"] {
            display: none;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 28px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .modal-content p {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .modal-content button {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 24px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            -webkit-appearance: none;
        }

        .modal-content button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        /* 加载指示器 */
        #loading-indicator {
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            z-index: 9999; 
            padding: 15px 25px; 
            background: var(--bg-card);
            border-radius: 8px; 
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
        }

        .loader-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 语言切换按钮 */
        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 5px 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .language-switcher:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* 性能模式切换 */
        .performance-toggle {
            margin-top: 10px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .performance-toggle.active {
            background: rgba(102, 126, 234, 0.25);
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }
            .player-card {
                padding: 24px;
            }
            .title {
                font-size: 2rem;
            }
            .control-row {
                gap: 10px;
            }
            .icon-button {
                width: 46px;
                height: 46px;
            }
            .play-button {
                width: 56px;
                height: 56px;
            }
        }

        @media (max-width: 480px) {
            .player-card {
                padding: 20px;
            }
            .title {
                font-size: 1.8rem;
            }
            .control-row {
                gap: 8px;
            }
            .bottom-nav {
                gap: 12px;
            }
            .theme-selector {
                gap: 8px;
            }
            .theme-button {
                padding: 6px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <canvas id="visualizer"></canvas>
    <div class="overlay"></div>

    <div class="container" id="main-container">
        <div class="player-card" id="player-card">
            <button class="language-switcher" id="language-switcher">中/En</button>
            
            <div class="logo-section">
                <div class="logo-circle" id="logo-circle">
                    <i class="material-icons logo-icon">graphic_eq</i>
                </div>
                <div class="brand">
                    <h1 class="title">Sonoria</h1>
                    <p class="slogan" data-i18n="slogan">动人心绚，悦音之境</p>
                </div>
            </div>

            <div class="player-info" id="player-info">
                <div class="track-title" id="track-title" data-i18n="waiting">等待音频输入</div>
                <div class="track-artist" id="track-artist" data-i18n="instruction">上传音乐文件或使用麦克风</div>
            </div>

            <!-- URL输入区域 -->
            <div class="url-input-section">
                <input type="text" class="url-input" id="url-input" placeholder="输入网易云/QQ音乐/B站音频链接" data-i18n-placeholder="urlPlaceholder">
                <button class="parse-button" id="parse-button" data-i18n="parseButton">解析链接</button>
            </div>

            <div class="progress-section">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="control-row">
                <button class="icon-button" id="prev-button" aria-label="上一首">
                    <i class="material-icons">skip_previous</i>
                </button>
                <button class="icon-button play-button" id="play-toggle" aria-label="播放/暂停">
                    <i class="material-icons">play_arrow</i>
                </button>
                <button class="icon-button" id="next-button" aria-label="下一首">
                    <i class="material-icons">skip_next</i>
                </button>
            </div>

            <div class="bottom-nav">
                <button class="icon-button" id="playlist-toggle" aria-label="播放列表">
                    <i class="material-icons">queue_music</i>
                </button>
                <button class="icon-button" id="upload-button" aria-label="上传音乐">
                    <i class="material-icons">library_music</i>
                </button>
                <button class="icon-button" id="mic-toggle" aria-label="麦克风">
                    <i class="material-icons">mic_none</i>
                </button>
            </div>

            <div class="upload-area" id="upload-area">
                <i class="material-icons">library_music</i>
                <div class="upload-text" data-i18n="uploadText">拖放音乐文件到此处或点击上传</div>
            </div>

            <div class="theme-selector">
                <button class="theme-button active" data-mode="aurora">极光</button>
                <button class="theme-button" data-mode="cosmic">宇宙</button>
                <button class="theme-button" data-mode="neural">神经</button>
                <button class="theme-button" data-mode="liquid">液态</button>
                <button class="theme-button" data-mode="quantum">量子</button>
                <button class="performance-toggle" id="performance-toggle">性能模式</button>
            </div>

            <div class="playlist-section" id="playlist-section">
                <div class="playlist-header">
                    <div class="playlist-title" data-i18n="playlist">播放列表</div>
                    <div class="playlist-controls">
                        <button class="icon-button" id="clear-playlist" aria-label="清空列表" data-i18n-title="clearPlaylist">

    <div class="modal" id="onboarding-modal">
        <div class="modal-content">
            <h2>欢迎体验 Sonoria</h2>

        </div>
