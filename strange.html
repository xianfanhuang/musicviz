<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Sonoria | Lorenz Chaos</title>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/music-metadata-browser@2.5.10/dist/index.min.js"></script>
    
    <style>
        /* 样式保持原极简优雅设计不变 */
        :root {
            --glass-bg: rgba(0, 0, 0, 0.25);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.5);
            --accent: #ffffff;
            --accent-glow: 0 0 20px rgba(255,255,255,0.3);
            --ease-out: cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: default;
        }

        #visualizer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            /* 强调中心聚焦的暗角效果 */
            mask-image: radial-gradient(circle at center, black 60%, rgba(0,0,0,0.8) 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 60%, rgba(0,0,0,0.8) 100%);
        }

        /* 极简UI容器及底部控制岛等样式 */
        .ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 40px; transition: opacity 0.8s var(--ease-out);
        }
        .ui-layer.idle { opacity: 0; }
        .top-bar { pointer-events: auto; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 1.2rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; mix-blend-mode: overlay; }
        .control-island {
            pointer-events: auto; width: 100%; max-width: 680px; margin: 0 auto; background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); transform: translateY(0); transition: transform 0.6s var(--ease-out);
        }
        .ui-layer.idle .control-island { transform: translateY(40px); }
        .track-info { text-align: center; margin-bottom: 24px; }
        .track-title { font-size: 1.5rem; font-weight: 500; letter-spacing: -0.5px; margin-bottom: 4px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 0.9rem; font-weight: 300; color: var(--text-secondary); letter-spacing: 0.5px; }
        .progress-container { display: flex; align-items: center; gap: 15px; margin-bottom: 24px; font-size: 0.75rem; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
        .progress-bar-bg { flex: 1; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; cursor: pointer; transition: height 0.2s; }
        .progress-bar-bg:hover { height: 4px; }
        .progress-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--accent); border-radius: 2px; box-shadow: var(--accent-glow); }
        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .main-controls { display: flex; align-items: center; gap: 24px; }
        .btn-icon { background: none; border: none; color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0.7; transition: all 0.3s ease; position: relative; }
        .btn-icon:hover { opacity: 1; transform: scale(1.1); }
        .btn-icon i { font-size: 24px; }
        .btn-play { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); opacity: 1; }
        .btn-play:hover { background: rgba(255,255,255,0.2); box-shadow: 0 0 30px rgba(255,255,255,0.1); }
        .btn-play i { font-size: 28px; }
        .btn-secondary { color: var(--text-secondary); }
        .btn-secondary:hover { color: var(--text-primary); }
        .btn-secondary.active { color: var(--accent); text-shadow: 0 0 10px rgba(255,255,255,0.5); opacity: 1; }
        
        .theme-switcher { display: none; }
        .playlist-drawer { position: fixed; bottom: 20px; right: 20px; width: 320px; max-height: 50vh; background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; transform: translateX(120%); transition: transform 0.5s var(--ease-out); z-index: 20; overflow-y: auto; pointer-events: auto; }
        .playlist-drawer.open { transform: translateX(0); }
        .playlist-item { display: flex; align-items: center; padding: 12px; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-bottom: 4px; }
        .playlist-item:hover { background: rgba(255,255,255,0.05); }
        .playlist-item.active { background: rgba(255,255,255,0.1); }
        .playlist-item.active .item-title { color: var(--accent); }
        .item-info { flex: 1; overflow: hidden; margin-left: 10px; }
        .item-title { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-artist { font-size: 0.75rem; color: var(--text-secondary); }
        .toast { position: fixed; top: 40px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.05); opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 30; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .drag-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 100; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; flex-direction: column; gap: 20px; }
        .drag-overlay.active { opacity: 1; pointer-events: auto; }
        .drag-icon { font-size: 64px; color: var(--text-secondary); }

        @media (max-width: 768px) {
            .ui-layer { padding: 20px; }
            .control-island { padding: 20px; border-radius: 20px; }
            .playlist-drawer { bottom: 0; right: 0; width: 100%; border-radius: 20px 20px 0 0; transform: translateY(110%); }
            .playlist-drawer.open { transform: translateY(0); }
            .track-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <canvas id="visualizer"></canvas>
    
    <div class="ui-layer" id="ui-layer">
        <div class="top-bar">
            <div class="brand">LORENZ CHAOS</div>
            <button class="btn-icon btn-secondary" id="playlist-toggle">
                <i class="material-icons-round">queue_music</i>
            </button>
        </div>
        
        <div class="control-island">
            <div class="track-info">
                <div class="track-title" id="track-title">Sonoria Experience</div>
                <div class="track-artist" id="track-artist">Drag & Drop Audio File</div>
            </div>

            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar-bg" id="progress-container">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="total-time">--:--</span>
            </div>

            <div class="controls-row">
                <button class="btn-icon btn-secondary" id="mic-toggle" title="Microphone Mode">
                    <i class="material-icons-round">mic_none</i>
                </button>
                
                <div class="main-controls">
                    <button class="btn-icon" id="prev-btn"><i class="material-icons-round">skip_previous</i></button>
                    <button class="btn-icon btn-play" id="play-btn"><i class="material-icons-round">play_arrow</i></button>
                    <button class="btn-icon" id="next-btn"><i class="material-icons-round">skip_next</i></button>
                </div>

                <button class="btn-icon btn-secondary" id="upload-btn" title="Upload Music">
                    <i class="material-icons-round">add</i>
                </button>
            </div>
        </div>
    </div>

    <div class="playlist-drawer" id="playlist-drawer">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; color:var(--text-secondary); font-size:0.8rem; text-transform:uppercase; letter-spacing:1px;">
            <span>Queue</span>
            <span id="clear-playlist" style="cursor:pointer; hover:text-white;">Clear</span>
        </div>
        <div id="playlist-content"></div>
    </div>

    <div class="drag-overlay" id="drag-overlay">
        <i class="material-icons-round drag-icon">file_upload</i>
        <p>Release to Immerse</p>
    </div>

    <div class="toast" id="toast">Ready</div>
    <input type="file" id="file-input" multiple accept="audio/*" style="display:none">

    <script>
        // --- 沉浸式交互逻辑 ---
        const uiLayer = document.getElementById('ui-layer');
        let idleTimer;

        function resetIdleTimer() {
            uiLayer.classList.remove('idle');
            document.body.style.cursor = 'default';
            clearTimeout(idleTimer);
            if (!document.getElementById('playlist-drawer').classList.contains('open')) {
                idleTimer = setTimeout(() => {
                    uiLayer.classList.add('idle');
                    document.body.style.cursor = 'none';
                }, 4000);
            }
        }

        document.addEventListener('mousemove', resetIdleTimer);
        document.addEventListener('click', resetIdleTimer);
        document.addEventListener('touchstart', resetIdleTimer);

        // --- 核心视觉：洛伦兹吸引子 ---
        class LorenzVisualizer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioCtx.createAnalyser();
                this.analyser.fftSize = 4096; // 更高的频率分辨率
                this.analyser.smoothingTimeConstant = 0.85; // 保持平滑
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                
                this.width = canvas.width = window.innerWidth;
                this.height = canvas.height = window.innerHeight;
                
                this.isPlaying = false;
                
                // 吸引子参数 (Lorenz Attractor)
                this.sigma = 10;
                this.rho = 28; // 关键参数，将受音乐影响
                this.beta = 8/3;
                this.dt = 0.005; // 迭代步长，将受音乐影响

                // 吸引子状态
                this.x = 0.1;
                this.y = 0;
                this.z = 0;
                this.points = []; // 存储轨迹点

                // 3D 投影参数
                this.focalLength = 300; // 焦距
                this.scale = 8; // 整体缩放

                // 镜头/旋转参数
                this.angleX = 0;
                this.angleY = 0;
                this.autoRotateSpeed = 0.0005; // 基础自动旋转速度

                window.addEventListener('resize', () => {
                    this.width = this.canvas.width = window.innerWidth;
                    this.height = this.canvas.height = window.innerHeight;
                });
            }

            connectSource(sourceNode) {
                sourceNode.connect(this.analyser);
                this.analyser.connect(this.audioCtx.destination);
            }
            
            connectStream(stream) {
                 const source = this.audioCtx.createMediaStreamSource(stream);
                 source.connect(this.analyser);
            }

            // 音乐能量获取
            getEnergy(start, end) {
                let sum = 0;
                for(let i=start; i<end; i++) sum += this.dataArray[i];
                return sum / (end - start);
            }

            // 洛伦兹迭代函数 (Runge-Kutta 逼近)
            lorenzStep(x, y, z) {
                // 标准洛伦兹微分方程:
                const dx = this.sigma * (y - x) * this.dt;
                const dy = (x * (this.rho - z) - y) * this.dt;
                const dz = (x * y - this.beta * z) * this.dt;

                this.x += dx;
                this.y += dy;
                this.z += dz;
                this.points.push({x: this.x, y: this.y, z: this.z});
                
                if (this.points.length > 5000) {
                    this.points.shift();
                }
            }

            // 3D 旋转和投影 (Rotation and Projection)
            project(point, angleX, angleY) {
                const sinX = Math.sin(angleX);
                const cosX = Math.cos(angleX);
                const sinY = Math.sin(angleY);
                const cosY = Math.cos(angleY);

                // 绕 X 轴旋转 (俯仰)
                let y1 = point.y * cosX - point.z * sinX;
                let z1 = point.y * sinX + point.z * cosX;

                // 绕 Y 轴旋转 (偏航)
                let x2 = point.x * cosY + z1 * sinY;
                let z2 = z1 * cosY - point.x * sinY;

                // 透视投影
                const perspective = this.focalLength / (this.focalLength + z2 + 100); 
                const px = x2 * perspective * this.scale * 3;
                const py = y1 * perspective * this.scale * 3;

                return { px, py, perspective: perspective, z: z2 };
            }

            render() {
                if(!this.isPlaying) return;
                
                this.analyser.getByteFrequencyData(this.dataArray);
                
                // --- 音乐数据映射 ---
                const bass = this.getEnergy(0, 50); // 低频 (Kick, Sub)
                const mid = this.getEnergy(100, 500); // 中频 (Vocals, Pads)
                const high = this.getEnergy(1000, 3000); // 高频 (Hats, Treble)
                const overallAvg = (bass + mid + high) / 3;

                // 1. 结构驱动 (中频 -> 结构参数 $\rho$)
                this.rho = 28 + (mid / 255) * 4 * Math.sin(Date.now() / 5000); 
                
                // 2. 冲击力驱动 (低频 -> 迭代步长 $dt$ 和缩放)
                this.dt = 0.005 + (bass / 255) * 0.003; 
                this.scale = 8 + (bass / 255) * 1.5;

                // 3. 视觉驱动 (高频 -> 光晕/颜色)
                const particleSize = 1.5 + (high / 255) * 3; 
                
                // 4. 视角驱动 (整体平均 -> 旋转)
                this.angleY += this.autoRotateSpeed + (overallAvg / 255) * 0.0005;
                this.angleX = Math.sin(Date.now() / 15000) * 0.5;

                // --- 渲染 ---
                
                // 清除画布 (微弱拖尾)
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; 
                this.ctx.fillRect(0, 0, this.width, this.height);

                // 洛伦兹迭代 (每帧计算 10 步)
                for(let i=0; i<10; i++) this.lorenzStep(this.x, this.y, this.z);

                this.ctx.globalCompositeOperation = 'lighter'; // 发光混合模式

                const centerX = this.width / 2;
                const centerY = this.height / 2;

                // 绘制轨迹点
                this.points.forEach((point, index) => {
                    const { px, py, perspective, z } = this.project(point, this.angleX, this.angleY);
                    
                    // 轨迹颜色映射 (z 坐标深度 + 轨迹时间)
                    const timeHue = index / this.points.length * 30; // 轨迹越新，颜色越亮
                    const depthLightness = 50 + z * 0.5; // z 越远，越暗
                    const alpha = perspective * 0.8; // 越远越透明
                    
                    this.ctx.fillStyle = `hsla(${180 + timeHue}, 90%, ${depthLightness}%, ${alpha})`;

                    // 绘制粒子 (尺寸受高频和深度影响)
                    const size = particleSize * perspective;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(centerX + px, centerY + py, size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                
                this.ctx.globalCompositeOperation = 'source-over';
                requestAnimationFrame(this.render.bind(this));
            }

            start() { 
                this.isPlaying = true; 
                this.x = 0.1; this.y = 0; this.z = 0; this.points = [];
                this.render(); 
            }
            stop() { this.isPlaying = false; }
        }

        // --- 应用逻辑 ---
        const app = {
            audio: new Audio(),
            playlist: [],
            currentIndex: 0,
            visualizer: null,
            isMicMode: false,

            init() {
                const canvas = document.getElementById('visualizer');
                this.visualizer = new LorenzVisualizer(canvas); 
                
                this.bindEvents();
                this.setupDragDrop();
                
                this.audio.addEventListener('timeupdate', () => this.updateProgress());
                this.audio.addEventListener('ended', () => this.next());
            },

            bindEvents() {
                // 播放控制
                document.getElementById('play-btn').onclick = () => this.togglePlay();
                document.getElementById('prev-btn').onclick = () => this.prev();
                document.getElementById('next-btn').onclick = () => this.next();
                document.getElementById('upload-btn').onclick = () => document.getElementById('file-input').click();
                
                // 文件选择
                document.getElementById('file-input').onchange = (e) => this.handleFiles(e.target.files);

                // 进度条点击
                const pContainer = document.getElementById('progress-container');
                pContainer.onclick = (e) => {
                    const rect = pContainer.getBoundingClientRect();
                    const percent = (e.clientX - rect.left) / rect.width;
                    if(this.audio.duration) this.audio.currentTime = percent * this.audio.duration;
                };

                // 麦克风
                document.getElementById('mic-toggle').onclick = () => this.toggleMic();

                // 播放列表UI
                const drawer = document.getElementById('playlist-drawer');
                document.getElementById('playlist-toggle').onclick = () => {
                    drawer.classList.toggle('open');
                };
                document.getElementById('clear-playlist').onclick = () => {
                    this.playlist = [];
                    this.currentIndex = 0;
                    this.audio.pause();
                    this.visualizer.stop();
                    this.updatePlayIcon(false);
                    this.updatePlaylistUI();
                    this.showToast('Playlist Cleared');
                }
            },

            togglePlay() {
                if(this.isMicMode) return;
                if(this.audio.paused && this.playlist.length > 0) {
                    this.audio.play();
                    this.visualizer.audioCtx.resume();
                    this.visualizer.start();
                    this.updatePlayIcon(true);
                } else {
                    this.audio.pause();
                    this.visualizer.stop(); // 暂停时停止渲染
                    this.updatePlayIcon(false);
                }
            },

            updatePlayIcon(isPlaying) {
                const icon = document.querySelector('#play-btn i');
                icon.textContent = isPlaying ? 'pause' : 'play_arrow';
            },

            async handleFiles(files) {
                let added = 0;
                for(let file of files) {
                    if(file.type.startsWith('audio/')) {
                        let meta = { title: file.name, artist: 'Unknown' };
                        try {
                            const m = await musicMetadata.parseBlob(file);
                            meta.title = m.common.title || file.name;
                            meta.artist = m.common.artist || 'Unknown Artist';
                        } catch(e) {}
                        
                        this.playlist.push({ file, ...meta });
                        added++;
                    }
                }
                
                this.updatePlaylistUI();
                if(this.playlist.length === added && added > 0) {
                    this.loadTrack(0);
                } else if (added > 0 && this.audio.paused) {
                    this.updatePlaylistUI();
                }
                
                if (added > 0) {
                    this.showToast(`Added ${added} tracks`);
                }
            },

            loadTrack(index) {
                if(index < 0 || index >= this.playlist.length) return;
                this.currentIndex = index;
                const track = this.playlist[index];
                
                const url = URL.createObjectURL(track.file);
                this.audio.src = url;
                this.audio.load();
                
                if(!this.sourceNode) {
                    this.sourceNode = this.visualizer.audioCtx.createMediaElementSource(this.audio);
                    this.visualizer.connectSource(this.sourceNode);
                }

                document.getElementById('track-title').textContent = track.title;
                document.getElementById('track-artist').textContent = track.artist;
                
                this.audio.play();
                this.visualizer.start();
                this.updatePlayIcon(true);
                this.updatePlaylistUI();
            },

            prev() { this.loadTrack((this.currentIndex - 1 + this.playlist.length) % this.playlist.length); },
            next() { this.loadTrack((this.currentIndex + 1) % this.playlist.length); },

            updateProgress() {
                const cur = this.audio.currentTime;
                const dur = this.audio.duration || 1;
                const percent = (cur / dur) * 100;
                
                document.getElementById('progress-fill').style.width = `${percent}%`;
                document.getElementById('current-time').textContent = this.formatTime(cur);
                document.getElementById('total-time').textContent = this.formatTime(dur);
            },

            formatTime(s) {
                const m = Math.floor(s/60);
                const sec = Math.floor(s%60);
                return `${m}:${sec<10?'0':''}${sec}`;
            },

            updatePlaylistUI() {
                const container = document.getElementById('playlist-content');
                container.innerHTML = '';
                this.playlist.forEach((track, i) => {
                    const div = document.createElement('div');
                    div.className = `playlist-item ${i === this.currentIndex ? 'active' : ''}`;
                    div.innerHTML = `
                        <i class="material-icons-round" style="font-size:16px; opacity:0.7">${i === this.currentIndex ? 'volume_up' : 'music_note'}</i>
                        <div class="item-info">
                            <div class="item-title">${track.title}</div>
                            <div class="item-artist">${track.artist}</div>
                        </div>
                        ${i === this.currentIndex ? '<i class="material-icons-round" style="font-size:16px;">equalizer</i>' : ''}
                    `;
                    div.onclick = () => this.loadTrack(i);
                    container.appendChild(div);
                });
            },

            async toggleMic() {
                const btn = document.getElementById('mic-toggle');
                if(this.isMicMode) {
                    this.isMicMode = false;
                    btn.classList.remove('active');
                    this.audio.pause();
                    document.getElementById('track-title').textContent = "Sonoria";
                    document.getElementById('track-artist').textContent = "Visualizer Paused";
                    document.getElementById('total-time').textContent = "--:--";
                    this.visualizer.stop();
                    
                    if(this.playlist[this.currentIndex]) {
                        this.loadTrack(this.currentIndex);
                    } else {
                        this.updatePlayIcon(false);
                    }
                } else {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        this.isMicMode = true;
                        btn.classList.add('active');
                        this.audio.pause();
                        
                        document.getElementById('track-title').textContent = "Microphone Input";
                        document.getElementById('track-artist').textContent = "Live Chaos Visualization";
                        document.getElementById('current-time').textContent = "LIVE";
                        document.getElementById('total-time').textContent = "LIVE";
                        
                        this.visualizer.connectStream(stream);
                        this.visualizer.start();
                        this.updatePlayIcon(false);
                        this.showToast('Mic Mode Active');
                    } catch(e) {
                        this.showToast('Microphone Access Denied');
                    }
                }
            },

            setupDragDrop() {
                const overlay = document.getElementById('drag-overlay');
                document.body.ondragover = (e) => { e.preventDefault(); overlay.classList.add('active'); };
                document.body.ondragleave = (e) => { 
                    if(e.target === overlay) overlay.classList.remove('active'); 
                };
                document.body.ondrop = (e) => {
                    e.preventDefault();
                    overlay.classList.remove('active');
                    this.handleFiles(e.dataTransfer.files);
                };
            },

            showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3000);
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
